<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marc FLOVE</title>
<meta name="description" content="Saludos en vídeo, cinco versos y un bis con dos canciones: Marc (marcflove), autor de flove.">
<meta name="author" content="Marc (marcflove)">
<link rel="canonical" href="https://flove.org/marc/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='12' y1='0' x2='88' y2='0' gradientUnits='userSpaceOnUse'><stop offset='0' stop-color='%23ff3344'/><stop offset='.5' stop-color='%23ff8a3a'/><stop offset='1' stop-color='%23ffd633'/></linearGradient></defs><path d='M50 60 C 22 60, 12 38, 16 18 C 38 22, 54 38, 50 60 Z' fill='url(%23g)'/><path d='M50 60 C 78 60, 88 38, 84 18 C 62 22, 46 38, 50 60 Z' fill='url(%23g)'/><path d='M50 58 C 50 72, 50 84, 50 92' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' fill='none'/></svg>">
<meta name="theme-color" content="#fff8f1">
<style>
  :root{
    --ink:#1a1820; --soft:#5f5a6b;
    --paper:#fff8f1;
    --line:rgba(20,16,32,.10); --line-2:rgba(20,16,32,.18);
    --red:#ff3344; --orange:#ff8a3a; --yellow:#ffd633;
    --sans:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; color:var(--ink); font-family:var(--sans); background:var(--paper);
    background-image:
      radial-gradient(900px 520px at 92% -10%, rgba(255,214,51,.30), transparent 60%),
      radial-gradient(800px 460px at -8% 8%, rgba(255,51,68,.16), transparent 58%),
      radial-gradient(700px 480px at 50% 108%, rgba(255,138,58,.14), transparent 60%);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  a{color:inherit}
  .wrap{max-width:920px; margin:0 auto; padding:0 24px}
  :focus-visible{outline:3px solid var(--orange); outline-offset:3px}

  /* ── Header: Author of Flove.org en una línea + avisos al pasar ───── */
  .topbar{display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding-block:20px}
  .brand{display:inline-flex; align-items:center; gap:11px; text-decoration:none; font-weight:800;
    letter-spacing:.16em; font-size:.88rem}
  .brand svg{width:32px; height:32px; flex:0 0 auto; filter:drop-shadow(0 2px 10px rgba(255,51,68,.25))}
  .brand-text{position:relative; display:block; white-space:nowrap}
  .brand-author{display:inline-block; position:relative}
  .brand-site{display:inline-block; position:relative; font-family:var(--mono); font-size:1.1rem;
    letter-spacing:normal; color:var(--orange); font-weight:700}
  .brand:hover .brand-site{color:var(--red)}

  /* Al pasar por encima: el autor enseña su correo, Flove.org enseña "See full website". */
  .brand-tip{
    position:absolute; left:0; top:calc(100% + 8px); z-index:2;
    font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.02em;
    text-transform:none; color:var(--ink); white-space:nowrap; pointer-events:none;
    padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,255,255,.96); box-shadow:0 8px 20px -12px rgba(20,16,32,.55);
    opacity:0; visibility:hidden; transform:translateY(-3px);
    transition:opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .brand-author:hover .brand-tip,
  .brand-site:hover .brand-tip,
  .brand:focus-visible .brand-author .brand-tip{opacity:1; visibility:visible; transform:none}

  /* ── Apertura en dos columnas + reel ─────────────────────────────── */
  main{padding:22px 0 0}
  .opening{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));
    gap:26px; align-items:stretch; margin:0 0 106px;
  }
  .reel{margin:0 0 106px}
  .frame{position:relative; border-radius:20px; overflow:hidden; background:#131118;
    border:1px solid rgba(20,16,32,.55);
    box-shadow:0 30px 60px -34px rgba(20,16,32,.7), 0 2px 0 rgba(255,255,255,.5) inset}
  .frame video{display:block; width:100%; height:100%; max-block-size:76vh; object-fit:contain; background:#131118}
  .frame::after{content:""; position:absolute; inset:0; border-radius:20px; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

  /* ── Slideshow: cinco versos ─────────────────────────────────────── */
  .verses,.song{
    background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.64));
    border:1px solid var(--line);
    box-shadow:0 24px 50px -40px rgba(20,16,32,.5), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .verses{
    position:relative; margin:0; padding:34px 30px 24px; border-radius:24px;
    text-align:center; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    display:flex; flex-direction:column;
  }
  .verse-stage{display:grid; place-items:center; min-block-size:clamp(150px,22vh,210px); flex:1 1 auto}
  .verse{grid-area:1 / 1; margin:0; opacity:0; visibility:hidden; transform:translateY(10px);
    transition:opacity .55s ease, transform .55s ease, visibility .55s}
  .verse.is-active{opacity:1; visibility:visible; transform:none}
  .verse blockquote{margin:0}
  .verse p{
    font-family:var(--serif); font-weight:400; margin:0 auto; max-inline-size:26ch;
    font-size:clamp(1.45rem,3.6vw,2.35rem); line-height:1.22; letter-spacing:-.02em;
    text-wrap:balance;
  }
  /* En la apertura a dos columnas los versos afinan para caber en una línea. */
  .opening .verse p{font-size:clamp(1.35rem,2.9vw,2rem)}
  .verse-controls{display:flex; align-items:center; justify-content:center; gap:20px; margin-top:30px}
  .verse-dots{display:flex; align-items:center; gap:12px}
  .verse-dots button{
    position:relative; inline-size:18px; block-size:18px; padding:0; border:0; border-radius:999px; cursor:pointer;
    background:rgba(20,16,32,.18); transition:inline-size .2s ease, background .2s ease;
  }
  /* Zona de toque invisible: los puntos pequeños siguen siendo fáciles de pulsar. */
  .verse-dots button::after{content:""; position:absolute; inset:-6px; border-radius:50%}
  .verse-dots button:hover{background:rgba(20,16,32,.32)}
  .verse-dots button[aria-current="true"]{
    inline-size:52px; background:linear-gradient(90deg,var(--red),var(--orange));
  }

  /* Flecha del stepper: avanzar los versos. */
  .verse-next{
    display:inline-grid; place-items:center; inline-size:60px; block-size:60px; padding:0;
    border:1px solid var(--line); border-radius:50%; background:rgba(255,255,255,.72);
    color:var(--soft); cursor:pointer; transition:border-color .15s, color .15s;
  }
  .verse-next:hover{border-color:var(--line-2); color:var(--ink)}
  .verse-next svg{inline-size:22px; block-size:22px; fill:none; stroke:currentColor;
    stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

  /* ── Longer... y Bis...: dos columnas ────────────────────────────── */
  .longer,.bis{margin:0 0 114px; text-align:center}
  .longer h2,.bis h2{
    font-family:var(--serif); font-weight:400; line-height:.9; margin:0 0 30px;
    letter-spacing:.3em; font-size:clamp(2rem,6vw,3.4rem);
  }
  .longer-grid,.bis-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:26px}
  .longer-col h3,.song h3{
    font-family:var(--mono); font-weight:700; text-transform:uppercase; color:var(--soft); margin:0 0 14px;
  }
  .longer-col h3{font-size:.62rem; letter-spacing:.26em}
  .song h3{display:flex; align-items:center; gap:8px; font-size:.68rem; letter-spacing:.22em}
  .frame--empty{
    aspect-ratio:16/9; background:rgba(255,255,255,.35); border:1.5px dashed var(--line-2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  }
  .song{padding:22px 22px 18px; border-radius:16px; text-align:left}
  .song h3 svg{inline-size:14px; block-size:14px; flex:0 0 auto; fill:none; stroke:currentColor;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; color:var(--orange)}
  .song audio{display:block; inline-size:100%}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0}

  /* ── Pie: "See you around!" — vuelve arriba ─────────────────────── */
  .foot{padding-bottom:84px; text-align:center}
  .foot a{
    font-family:var(--serif); font-weight:400; text-decoration:none; color:var(--ink);
    font-size:clamp(1rem,3vw,1.7rem); line-height:1.1; letter-spacing:.1em;
    transition:color .2s ease;
  }
  .foot a:hover{color:var(--red)}

  @media (max-width:720px){
    .topbar{align-items:flex-start}
    .verses{padding:26px 22px 20px}
    .verse-stage{min-block-size:clamp(140px,26vh,200px)}
    .verse p{max-inline-size:22ch}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .brand-site,.brand-tip,.verse-dots button,.verse-next,.foot a{transition:none}
    .verse{transition:none; transform:none}
  }
</style>
</head>
<body>

<header class="topbar wrap" id="top">
  <a class="brand" href="https://flove.org" aria-label="Author of Flove.org — marc@futbolia.org">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="sprout" x1="12" y1="0" x2="88" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ff3344"/><stop offset=".5" stop-color="#ff8a3a"/><stop offset="1" stop-color="#ffd633"/>
      </linearGradient></defs>
      <path d="M50 60 C 22 60 12 38 16 18 C 38 22 54 38 50 60 Z" fill="url(#sprout)"/>
      <path d="M50 60 C 78 60 88 38 84 18 C 62 22 46 38 50 60 Z" fill="url(#sprout)"/>
      <path d="M50 58 C 50 72 50 84 50 92" stroke="url(#sprout)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <span class="brand-text">
      <span class="brand-author">Author of<span class="brand-tip" aria-hidden="true">marc@futbolia.org</span></span>

<main class="wrap">

  <!-- ── Helloo... ────────────────────────────────────────────────── -->
  <section class="reel" aria-label="Helloo… — About Marc">

      <video controls playsinline preload="metadata"

        <a href="https://pub-e19f5fad18fb474fb6d6c4f91194e333.r2.dev/marc/AboutMarc.mp4">Descárgalo aquí</a>.

  <!-- ── Longer... ────────────────────────────────────────────────── -->
  <section class="longer" aria-labelledby="longer-title">
    <h2 id="longer-title">Longer...</h2>
    <div class="longer-grid">
      <div class="longer-col">
        <h3>More Formal</h3>
        <div class="frame frame--empty" aria-hidden="true"></div>

          <video controls playsinline preload="metadata" aria-label="Vídeo: Pasion Selfis — Mas Informal">

          </video>

  <!-- ── Bis...: dos canciones ─────────────────────────────────────── -->
  <section class="bis" aria-labelledby="bis-title">

</main>

<footer class="foot wrap">

</footer>

<script>
  // Carrusel de versos ([data-slides]): avanza solo cada 10 s, se detiene al
  // interactuar y se puede pasar con la flecha del stepper.
  (function () {
    var INTERVAL = 10000;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setup(root) {
      var slides = [].slice.call(root.querySelectorAll('.verse'));
      if (!slides.length) return;
      var dots = [].slice.call(root.querySelectorAll('.verse-dots button'));
      var next = root.querySelector('.verse-next');
      var at = 0, timer = null;
      var hover = false, focus = false;

      function paint(i) {
        at = (i + slides.length) % slides.length;
        slides.forEach(function (s, n) {
          var on = n === at;
          s.classList.toggle('is-active', on);
          s.setAttribute('aria-hidden', on ? 'false' : 'true');
        });
        dots.forEach(function (d, n) {
          if (n === at) d.setAttribute('aria-current', 'true');
          else d.removeAttribute('aria-current');
        });
      }

      function canRun() {
        return !reduce && !hover && !focus && !document.hidden;
      }
      function stop() { if (timer) { clearInterval(timer); timer = null; } }
      function run() {
        stop();
        if (!canRun()) return;
        timer = setInterval(function () { paint(at + 1); }, INTERVAL);
      }
      function go(i) { paint(i); stop(); run(); }

      dots.forEach(function (d, n) {
        d.addEventListener('click', function () { go(n); });
      });

      if (next) next.addEventListener('click', function () { go(at + 1); });

      root.addEventListener('mouseenter', function () { hover = true; stop(); });
      root.addEventListener('mouseleave', function () { hover = false; run(); });
      root.addEventListener('focusin', function () { focus = true; stop(); });
      root.addEventListener('focusout', function () { focus = false; run(); });

      root.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); go(at + 1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); go(at - 1); }
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stop(); else run();
      });

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].isIntersecting) { run(); io.disconnect(); break; }
          }
        }, { threshold: 0.45 });
        io.observe(root);
      } else {
        run();
      }

      paint(0);
    }

    [].forEach.call(document.querySelectorAll('[data-slides]'), setup);
  })();
</script>

</body>
