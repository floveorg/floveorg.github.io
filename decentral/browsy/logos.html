<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>browsy logo animations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px system-ui;color:#1a1820;background:#f5f5f5;padding:2rem}
h1{font-size:1.4rem;margin-bottom:.3rem}
.sub{color:#888;font-size:.85rem;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}
.card{background:#fff;border-radius:12px;padding:1.5rem;text-align:center}
.card svg{width:80px;height:80px;display:block;margin:0 auto .8rem}
.card h3{font-size:.85rem;margin-bottom:.2rem}
.card p{font-size:.7rem;color:#888}

/* ── animations ──────────────────────────────────────── */

/* A1: pulse — scale bounce */
.a1 svg{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* A2: spin — full rotation */
.a2 svg{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* A3: float — vertical bob */
.a3 svg{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* A4: pulse + title */
.a4 svg{animation:pulse 2s ease-in-out infinite}
.a4 span{display:inline-block;animation:fadeTitle 2s ease-in-out infinite}
@keyframes fadeTitle{0%,100%{opacity:.6;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}

/* A5: spin + title */
.a5 svg{animation:spin 4s linear infinite}
.a5 span{display:inline-block;animation:letterWave 4s ease-in-out infinite}
@keyframes letterWave{0%,100%{letter-spacing:0}50%{letter-spacing:2px}}

/* A6: float + title */
.a6 svg{animation:float 3s ease-in-out infinite}
.a6 span{display:inline-block;animation:fadeTitle 3s ease-in-out infinite}
</style>
</head>
<body>
<h1>browsy · split arrow logo</h1>
<p class="sub">6 animations — 3 icon only, 3 with text title</p>

<div class="grid">

<!-- without text -->
<div class="card a1">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A1 · pulse</h3><p>scale bounce, icon only</p>
</div>

<div class="card a2">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A2 · spin</h3><p>full rotation, icon only</p>
</div>

<div class="card a3">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A3 · float</h3><p>vertical bob, icon only</p>
</div>

<!-- with text -->
<div class="card a4">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A4 · pulse + title</h3><span style="font-weight:700;color:#6c5ce7">browsy</span>
</div>

<div class="card a5">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A5 · spin + title</h3><span style="font-weight:700;color:#6c5ce7">browsy</span>
</div>

<div class="card a6">
<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="16" fill="#6c5ce7"/><path d="M50 70 L50 40 M50 40 L34 28 M50 40 L66 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="28" r="4" fill="#fff"/><circle cx="66" cy="28" r="4" fill="#fff"/><circle cx="50" cy="70" r="4" fill="#fff"/></svg>
<h3>A6 · float + title</h3><span style="font-weight:700;color:#6c5ce7">browsy</span>
</div>

</div>
</body>
</html>
