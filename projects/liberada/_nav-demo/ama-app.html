<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ama liberada · app abstracta</title>
<meta name="description" content="Ama/index reconstruido con la abstracción compartida (flove-feed · flove-tags · flove-player · flove-bottom-nav)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cpath%20d='M50%2088C20%2070%2012%2048%2022%2034c8-11%2022-8%2028%202%206-10%2020-13%2028-2%2010%2014%202%2036-28%2054Z'%20fill='%23f472b6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../central/shared/code/css/flove-media.css">
<link rel="stylesheet" href="../../../central/shared/code/css/flove-bottom-nav.css">
<style>
  :root{
    --app-accent:#f472b6; --app-accent-deep:#e91e8a; --app-accent-soft:#fde8f0;
    --paper:#fff8f9; --paper-card:#ffffff; --ink:#2a1810; --ink-soft:#5a3a28;
    --muted:#b07a92; --line:rgba(42,24,16,.10); --line-strong:rgba(42,24,16,.18);
    --shadow:rgba(58,26,10,.12); --radius:18px; --radius-pill:999px;
    --font-display:'Baloo 2',system-ui,sans-serif;
    --font-ui:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-ui); background:var(--paper); color:var(--ink); line-height:1.55; min-height:100vh}
  a{color:var(--app-accent-deep); text-decoration:none}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}
  .topbar{position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; background:rgba(255,248,249,.9); backdrop-filter:blur(12px); border-bottom:1.5px solid var(--line)}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:800; font-size:1.2rem; color:var(--ink)}
  .brand svg{width:32px; height:32px}
  .gente{display:grid; grid-template-columns:1fr 1.5fr; gap:24px; align-items:start; padding:26px 20px}
  .demo-note{font-family:var(--font-display); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); border:1.5px dashed var(--line-strong); border-radius:12px; padding:8px 14px; display:inline-block; margin-bottom:16px}
  .media-toggle{display:flex; gap:6px}
  .media-toggle button{padding:4px 12px; border:1.5px solid var(--line-strong); border-radius:var(--radius-pill);
    background:var(--paper-card); font-size:.72rem; font-weight:600; cursor:pointer; color:var(--muted)}
  .media-toggle button.on{background:var(--app-accent); color:#fff; border-color:var(--app-accent)}
  @media(max-width:720px){.gente{grid-template-columns:1fr}.tag-space{height:300px}}
</style>
</head>
<body class="has-bottom-nav">

<header class="topbar">
  <a class="brand" href="#top">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88 C20 70 12 48 22 34 C30 23 44 26 50 36 C56 26 70 23 78 34 C88 48 80 70 50 88Z" fill="#f472b6" stroke="#2a1810" stroke-width="6" stroke-linejoin="round"/></svg>
    <span>Ama liberada</span>
  </a>
  <a class="btn-upload" href="https://t.me/AmaLiberadaBot" target="_blank" rel="noopener" style="font-weight:700;background:var(--app-accent);color:#fff;border-radius:999px;padding:7px 18px">Publicar amor</a>
</header>

<main id="top">
  <div class="demo-note" style="margin:20px 0 0 20px">demo · ama/index abstraída con el driver de risa</div>
  <section class="gente" aria-label="Amores de la gente">
    <div class="tag-space flowing" id="tag-space" role="group" aria-label="Etiquetas de los amores: pulsa un chip para filtrar"></div>

    <div class="player-col" id="player-root">
      <div class="title-head">
        <div>
          <h3 class="plname">Amores de la gente 💗</h3>
          <div class="track"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="media-toggle" role="group" aria-label="Tipo de piezas: audio o vídeo">
            <button type="button" data-media="audio" class="on" aria-pressed="true">🎙 Audio</button>
            <button type="button" data-media="video" aria-pressed="false">🎬 Video</button>
          </div>
          <div class="transport" role="group" aria-label="Controles de reproducción">
            <button type="button" data-prev aria-label="Anterior">‹</button>
            <button type="button" class="play-btn" data-play aria-label="Reproducir">▶ Todas</button>
            <button type="button" data-next aria-label="Siguiente">›</button>
          </div>
        </div>
      </div>
      <ul class="tracklist"></ul>
      <div class="paginator" hidden>
        <div class="pg-btns">
          <button type="button" class="chip pg-prev" aria-label="Página anterior">‹</button>
          <button type="button" class="chip pg-10" aria-label="Ver 10 más">10+</button>
          <button type="button" class="chip pg-100" aria-label="Ver 100 más">100</button>
        </div>
        <span class="pg-label" aria-live="polite"></span>
        <a class="pg-repo" href="#" target="_blank" rel="noopener">Ver todas ↗</a>
      </div>
      <audio preload="none"></audio>
    </div>
  </section>
</main>

<div id="bottom-nav"></div>

<script src="../../../central/shared/code/js/flove-feed.js"></script>
<script src="../../../central/shared/code/js/flove-tags.js"></script>
<script src="../../../central/shared/code/js/flove-player.js"></script>
<script src="../../../central/shared/code/js/flove-bottom-nav.js"></script>
<script src="../../../central/shared/code/js/flove-app.js"></script>
<script src="ama-app.js"></script>
<script>
AmaApp.init();
</script>
</body>
</html>
