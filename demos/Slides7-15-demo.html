<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOVE — Demonstration · slides 7–15</title>
<meta name="description" content="Animated demonstration of FLOVE presentation pages 7 to 15, with per-slide pauses and an editable animated introduction on top.">
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --line:#2a3340;
    --ink:#e9ecf3; --mut:#9aa6b4; --faint:#6b7684;
    --accent:#ff8a3a; --accent2:#ffd633; --teal:#7dcda9; --red:#ff5d5d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  /* ── intro banner: the complementary introduction text, animated, editable ── */
  .intro{
    border-bottom:1px solid var(--line);
    padding:10px 18px 12px; display:flex; gap:12px; align-items:flex-start;
    animation:introSink .5s ease both;
  }
  @keyframes introSink{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .intro h1{
    margin:0; font-size:.8rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent2); font-weight:700; min-width:132px; line-height:1.5;
  }
  .intro-mark{white-space:nowrap}
  .intro-body{
    font-size:1.02rem; line-height:1.65; color:var(--ink); max-width:72ch; margin:0;
    min-height:1.65em; font-family:Georgia,"Times New Roman",serif;
  }
  .intro-body .w{opacity:0; filter:blur(3px); transition:opacity .5s,filter .5s}
  .intro-body .w.on{opacity:1; filter:blur(0)}
  .intro-body .w.es{color:var(--faint)}
  .intro-btn{
    margin-left:auto; flex:0 0 auto; cursor:pointer; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); border-radius:999px;
    font:600 .72rem system-ui,sans-serif; padding:.34em .78em; opacity:.85;
  }
  .intro-btn:hover{opacity:1}
  .intro-btn.on{background:var(--accent); color:#14100a; border-color:transparent}
  .intro-edit textarea{
    width:100%; min-height:8.5em; background:var(--bg); color:var(--ink);
    border:1px dashed var(--accent); border-radius:8px; padding:10px; font:1rem/1.6 Georgia,serif;
    resize:vertical; outline:none;
  }
  .intro-btns{display:flex; gap:8px; margin-top:8px; justify-content:flex-end}
  /* ── deck ── */
  .deck{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px 20px 36px; position:relative;
  }
  .stage{
    position:relative; width:min(880px,94vw); min-height:min(520px,62vh);
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:40px 46px; box-shadow:0 22px 60px rgba(0,0,0,.45);
  }
  .stage:before{content:"NEW PART"; position:absolute; top:14px; right:20px;
    font:700 .66rem system-ui,sans-serif; letter-spacing:.22em; color:var(--teal); opacity:.75}
  .slide-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    font:600 .72rem system-ui,sans-serif; letter-spacing:.14em; color:var(--faint);
    margin-bottom:18px;
  }
  .slide-meta .dots{display:flex; gap:5px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--line); transition:background .3s}
  .dot.now{background:var(--accent)}
  .slide-title{
    font:700 clamp(1.5rem,3.4vw,2.3rem)/1.2 Georgia,serif; color:var(--ink);
    margin:0 0 6px; min-height:1.2em;
  }
  .slide-sub{font:600 .78rem system-ui,sans-serif; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; margin:0 0 20px}
  .items{list-style:none; margin:0; padding:0}
  .items li{
    opacity:0; transform:translateY(14px); transition:opacity .55s ease,transform .55s ease;
    font-size:1.12rem; line-height:1.55; color:var(--ink); padding:2.5px 0 2.5px 22px;
    position:relative; border-left:2px solid var(--line);
  }
  .items li em{font-style:normal; color:var(--accent2); font-weight:600}
  .items li.small{color:var(--mut); font-size:.99rem}
  .items li.off{opacity:0; transform:none}
  .items li.on{opacity:1; transform:none; border-left-color:var(--teal)}
  .items li.hl{color:var(--accent)}
  /* progress + controls */
  .bar{position:absolute; left:0; bottom:0; height:4px; width:100%; background:var(--line); border-radius:0 0 16px 16px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .12s linear}
  .controls{display:flex; gap:10px; align-items:center; margin-top:22px; font:600 .78rem system-ui,sans-serif}
  .controls button,.controls select{
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:999px; padding:.45em 1em; cursor:pointer; font:600 .78rem system-ui,sans-serif;
  }
  .controls button:hover{opacity:1; border-color:var(--accent)}
  .controls .info{color:var(--mut); min-width:150px; text-align:center}
  .pause-chip{color:var(--teal)}
  .hint{position:absolute; bottom:6px; right:20px; color:var(--faint); font:500 .7rem system-ui,sans-serif; letter-spacing:.06em}
  @media (prefers-reduced-motion: reduce){
    .intro-body .w{opacity:1; filter:none}
    .items li{opacity:1; transform:none}
  }
</style>
</head>
<body>

<!--
  ══════════════════════════════════════════════════════════════════
  DEMONSTRATION — FLOVE presentation slides 7→15
  The animated strip on top is the complementary introduction text.
  It is MEANT FOR EDITING: click ✎ Edit, rehearse / narrate it,
  then hide it (or delete it from the slides for the final cut).
  Edit the default text directly below in the INTRO const if you prefer
  to work in the source file.
  ══════════════════════════════════════════════════════════════════
-->

<header class="intro" id="intro">
  <h1 class="intro-mark">FLOVE<span style="color:var(--accent)">·</span>new&nbsp;part</h1>
  <p class="intro-body" id="introBody" aria-live="polite"></p>
  <button class="intro-btn" id="introEdit" type="button" data-en="✎ Edit" data-es="✎ Editar">✎ Edit</button>
  <button class="intro-btn" id="introHide" type="button" data-en="Hide intro" data-es="Ocultar intro">Hide intro</button>
</header>

<main class="deck">
  <section class="stage" role="region" aria-label="Slide show">
    <div class="slide-meta">
      <span>SLIDE <span id="cur">7</span> / <span id="tot"></span> — <span class="pause-chip" id="hold">hold 4.2s</span></span>
      <span class="dots" id="dots"></span>
    </div>
    <h2 class="slide-title" id="title"></h2>
    <p class="slide-sub" id="sub"></p>
    <ul class="items" id="items"></ul>
    <div class="bar" id="bar"><i id="barFill"></i></div>
  </section>

  <div class="controls">
    <button id="prev" type="button">◀ prev</button>
    <button id="play" type="button">⏸ pause</button>
    <button id="next" type="button">next ▶</button>
    <span class="info" id="info"></span>
  </div>
  <p class="hint">← → move · space toggles play · every slide has its own pause</p>
</main>

<script>
/* ── the complementary introduction text (default). Edit here or in the banner. ── */
const INTRO = `Where do we come from — and where are we going? This is where the new part opens: not with answers, but with the question we are born with. Who am I? What is going on? Why is there something instead of nothing? — We are memory and prediction gathered in a single now: experience and expectation shaping who we are. We enjoy, we suffer, we seem — and from that, curiosity is born. We research, we evolve, we simplexify; cause becomes effect, and effect asks again. — Until the mind reaches what cannot be measured, and trips into metaphysics: from prime cause to entropy, fractal, scalar, continuous. That unmeasurability is not optional — it is where this new part begins.`;

/* ── slides 7→15, faithful to FloveSlides26-8, with their own pauses & stagger ── */
const SLIDES = [
  {n:7, t:"Where do I come from?<br>Where am I going?", sub:"Questions we begin with", hold:4200, stagger:650,
   items:["Who am I?","What's going on?","<em>M E T A P H Y S I C S</em>","Past · Now · Future"]},
  {n:8, t:"Where do I come from?<br>Where am I going?", sub:"Three tenses of the self", hold:5200, stagger:720,
   items:["Who am I?","<<span>Past</span> — <span>Now</span> — <span>Future</span>>"]},
  {n:9, t:"WE ARE", sub:"Memory · prediction", hold:4400, stagger:700,
   items:["Past / Future","<em>MEMORY PREDICTION</em>"]},
  {n:10, t:"WE ARE", sub:"Memory · prediction", hold:5600, stagger:520,
   items:["Past / Future","<em>MEMORY PREDICTION</em>","Experience","Enjoy","Suffer",". . .",". . .","<span class='small'>Seem to —</span>"]},
  {n:11, t:"MEMORY PREDICTION", sub:"Curiosity", hold:5400, stagger:620,
   items:["<em>CURIOSITY</em> for appliance","Because of —","WE RESEARCH","EVOLVE","SIMPLEXIFY",". . ."]},
  {n:12, t:"MEMORY PREDICTION", sub:"Curiosity", hold:6000, stagger:560,
   items:["<em>CURIOSITY</em> for appliance","Because of —","WE RESEARCH","EVOLVE","SIMPLEXIFY",". . .","<span class='small'>WHY · Cause · Effect · HOW</span>","<span class='small'>WHAT</span>"]},
  {n:13, t:"Cause → Effect", sub:"Crossing the limit", hold:6200, stagger:640,
   items:["WHY <b>WHAT</b> HOW","WHY WHAT HOW . . .","<em>RESEARCH · METAPHYSICS</em>","studies the <span class='small'>unmeasurable</span>","up to <span class='hl'>prime cause</span>"]},
  {n:14, t:"Cause → Effect", sub:"The unmeasurable is mandatory", hold:7200, stagger:580,
   items:["WHY <b>WHAT</b> HOW","WHY WHAT HOW . . .","Very . very .","<em>RESEARCH · METAPHYSICS</em>","studies unmeasurability","up to prime cause","<span class='hl'>Metaphysics are unavoidable because unmeasurability is mandatory.</span>","Entropy"]},
  {n:15, t:"Cause → Effect", sub:"From prime cause to entropy", hold:8200, stagger:540,
   items:["WHY <b>WHAT</b> HOW","WHY WHAT HOW . . .","Very . very .","<em>RESEARCH · METAPHYSICS</em>","studies unmeasurability","up to prime cause","<span class='hl'>Metaphysics are unavoidable — the unmeasurable is fundamental.</span>","Entropy","<span class='small'>It's as useful as it is continuous</span>","<span class='small'>Fractal · linear · scalar conservation · · ·</span>","<span class='small hl'>This is where the new part begins.</span>"]}
];

const $=s=>document.querySelector(s);
const introSheet=document.getElementById("introBody");
const titleEl=$("#title"), subEl=$("#sub"), itemsEl=$("#items");
const curEl=$("#cur"), holdEl=$("#hold"), infoEl=$("#info");
const barFill=$("#barFill");
let idx=0, step=0, playing=true, timers=[];
const prefs=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
$("#tot").textContent=SLIDES.length;

/* ── intro banner: word-by-word animation, editable ── */
function lang(){return document.documentElement.lang==="es"?"es":"en"}
function setLangEls(){document.querySelectorAll("[data-en]").forEach(b=>{b.textContent=lang()==="es"?b.dataset.es:b.dataset.en})}
function animIntro(){
  introSheet.innerHTML="";
  const words=INTRO.trim().split(/\s+/);
  const holder=document.createElement("span");
  introSheet.appendChild(holder);
  const frag=document.createDocumentFragment();
  words.forEach((w,i)=>{
    const s=document.createElement("span"); s.className="w"; s.textContent=w+" ";
    frag.appendChild(s);
  });
  holder.appendChild(frag);
  if(prefs){holder.querySelectorAll(".w").forEach(w=>w.classList.add("on"));return}
  const deckMs=SLIDES.reduce((a,s)=>a+s.hold+s.stagger*s.items.length,0);
  const per=deckMs/words.length;
  words.forEach((w,i)=>setTimeout(()=>{
    const el=holder.children[i]; if(el) el.classList.add("on");
  },i*per));
}
let introText = INTRO;
$("#introEdit").addEventListener("click",()=>{
  const editing=$("#intro").classList.contains("edit");
  const body=$("#introBody");
  if(editing){ teardownEdit(); return; }
  body.classList.add("intro-edit");
  const ta=document.createElement("textarea"); ta.id="introTa";
  ta.value=introText; body.appendChild(ta);
  const btns=document.createElement("div"); btns.className="intro-btns";
  const save=document.createElement("button"); save.className="intro-btn"; save.type="button"; save.textContent=lang()==="es"?"Guardar":"Save";
  const cancel=document.createElement("button"); cancel.className="intro-btn"; cancel.type="button"; cancel.textContent=lang()==="es"?"Cancelar":"Cancel";
  btns.appendChild(cancel); btns.appendChild(save); body.appendChild(btns);
  $("#intro").classList.add("edit");
  $("#introEdit").textContent=lang()==="es"?"Cerrar":"✎ Close";
  save.onclick=()=>{ introText=$( "#introTa").value.trim()||introText; teardownEdit(); animIntro(); };
  cancel.onclick=teardownEdit;
  function teardownEdit(){
    const ta=$("#introTa"); if(ta) ta.remove();
    const b=$(".intro-btns"); if(b) b.remove();
    body.classList.remove("intro-edit"); $("#intro").classList.remove("edit");
    $("#introEdit").textContent=lang()==="es"?"✎ Editar":"✎ Edit";
  }
});
$("#introHide").addEventListener("click",()=>{
  $("#intro").style.display=$("#intro").style.display==="none"?"":"none";
  $("#introHide").textContent=$("#intro").style.display==="none"?lang()==="es"?"Mostrar intro":"Show intro":lang()==="es"?"Ocultar intro":"Hide intro";
});

/* ── deck engine —— each slide: reveal items at its stagger, hold, then advance ── */
function buildDots(){
  $("#dots").innerHTML=SLIDES.map((_,i)=>`<i class="dot" data-i="${i}"></i>`).join("");
}
function renderSlide(){
  timers.forEach(clearTimeout); timers=[];
  const s=SLIDES[idx]; step=0;
  titleEl.innerHTML=s.t; subEl.textContent=s.sub; itemsEl.innerHTML="";
  s.items.forEach(t=>{
    const li=document.createElement("li"); li.innerHTML=t; itemsEl.appendChild(li);
  });
  curEl.textContent=s.n;
  holdEl.textContent="hold "+(s.hold/1000).toFixed(1)+"s · +"+(s.stagger/1000).toFixed(2)+"s/item";
  document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("now",+d.dataset.i===idx));
  if(prefs){itemsEl.querySelectorAll("li").forEach(li=>li.classList.add("on"));return}
  s.items.forEach((_,i)=>timers.push(setTimeout(()=>{itemsEl.children[i].classList.add("on")},i*s.stagger)));
  timers.push(setTimeout(()=>{if(playing&&idx<SLIDES.length-1){idx++;renderSlide()}else if(playing){finish()}},s.hold+s.stagger*s.items.length));
}
function finish(){
  playing=false; $("#play").textContent=lang()==="es"?"▶ Repetir":"↻ replay";
  barFill.style.width="100%";
}
function advance(dir){
  if(playing){timers.forEach(clearTimeout);timers=[]}
  idx=Math.max(0,Math.min(SLIDES.length-1,idx+dir));
  renderSlide(); if(!playing)setPlaying(true);
}
function setPlaying(v){
  playing=v; $("#play").textContent=v?(lang()==="es"?"⏸ Pausar":"⏸ pause"):(lang()==="es"?"▶ Seguir":"▶ play");
}
$("#prev").onclick=()=>{if(idx===0)return;mustAutomate((idx-1))};
$("#next").onclick=()=>{if(idx===SLIDES.length-1)return;advance(1)};
$("#play").onclick=()=>{if(playing){setPlaying(false)}else{setPlaying(true);if(idx>=SLIDES.length-1){idx=0;renderSlide()}else{renderSlide()}}};
function mustAutomate(nextIdx){idx=nextIdx;renderSlide();setPlaying(true)}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")advance(1);
  else if(e.key==="ArrowLeft")advance(-1);
  else if(e.key===" ")e.preventDefault(),setPlaying(!playing),renderSlide();
});
buildDots(); renderSlide(); animIntro(); setLangEls();
setInterval(()=>{
  const s=SLIDES[idx];
  const total=s.hold+s.stagger*s.items.length;
  barFill.style.width=Math.min(100,(Date.now()%total)/total*100)+"%";
},120);
</script>
</body>
</html>
