<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>blogy · flove</title>
<link rel="icon" type="image/png" href="../appy/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:15px/1.6 'Space Mono',system-ui,sans-serif;color:#16141f;background:#f3f4fb;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;border:1px solid #e3e5f0;border-radius:16px;padding:2rem;max-width:400px;text-align:center}
.icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#6c5ce7,#8d89ff);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:#fff}
h1{font-size:1.3rem;margin-bottom:.3rem}
.sub{color:#4a4e5a;font-size:.8rem;margin-bottom:1.2rem}
.btn{display:inline-block;font-family:"Space Mono",monospace;font-size:.7rem;font-weight:700;
  padding:.6rem 1.4rem;border-radius:10px;border:1px solid #6c5ce7;
  background:#6c5ce7;color:#fff;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.95)}
.features{text-align:left;margin-top:1.2rem;font-size:.75rem;color:#4a4e5a}
.features li{margin-bottom:.3rem}
.features strong{color:#16141f}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📝</div>
  <h1>blogy</h1>
  <p class="sub">post, share, discover</p>
  <a class="btn" href="index.html">open blogy</a>
  <ul class="features">
    <li><strong>Publish</strong> — write posts, choose privacy (public/friends/private)</li>
    <li><strong>Ask Wizy</strong> — get suggestions for what to post, who to visit</li>
    <li><strong>Profile</strong> — all your posts in one place, auto-saved</li>
  </ul>
</div>
</body>
</html>
