<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 200 200" role="img" aria-labelledby="ds-title">
  <title id="ds-title">DieSafe — animación · balanceo</title>
  <style>
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}

    .ds-mark{transform-box:fill-box;transform-origin:50% 100%;animation:ds-sway 5.2s ease-in-out infinite}
    @keyframes ds-sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  </style>
  <defs>
    <linearGradient id="ds-ember" x1="28" y1="28" x2="172" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a2e"/>
      <stop offset="50%" stop-color="#ff9b5e"/>
      <stop offset="100%" stop-color="#ffcf9a"/>
    </linearGradient>
  </defs>
  <g class="ds-mark" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <g class="ds-body">
      <rect x="88" y="100" width="24" height="68" rx="4" fill="url(#ds-ember)" stroke="none"/>
      <line x1="100" y1="100" x2="100" y2="88" stroke="url(#ds-ember)"/>
      <line x1="72" y1="168" x2="128" y2="168" stroke="url(#ds-ember)"/>
    </g>
    <g class="ds-flame">
      <path d="M100 88 Q80 64 100 28 Q120 64 100 88 Z" fill="url(#ds-ember)" stroke="none"/>
    </g>
  </g>
</svg>
