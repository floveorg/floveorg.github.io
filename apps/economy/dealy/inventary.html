    const STATE_CYCLE = ['', 'have', 'wish', 'want', 'need'];

    function syncTabActive() {
      tabs.forEach(t => t.classList.toggle('active', selectedCats.has(t.dataset.cat)));
      if (topbarAllBtn) {
        topbarAllBtn.classList.toggle('active',
          categories.length > 0 && categories.every(c => selectedCats.has(c.id)));
      }
    }

    function currentRowState(row) {
      if (row.querySelector('.col-need')?.classList.contains('selected-need')) return 'need';
      if (row.querySelector('.col-want')?.classList.contains('selected-want')) return 'want';
      if (row.querySelector('.col-wish')?.classList.contains('selected-wish')) return 'wish';
      if (row.querySelector('.col-have')?.classList.contains('selected-have')) return 'have';
      return '';
    }
    function setRowState(row, state) {
      ['have', 'wish', 'want', 'need'].forEach(t => {
        row.querySelector('.col-' + t)?.classList.toggle('selected-' + t, t === state);
      });
      updateRowPriority(row);
      updateCounts();
    }
    function rowIconClass(row) {
      const ic = row.querySelector('.item-cat-icon');
      if (ic) return Array.from(ic.classList).filter(c => c === 'fas' || c.startsWith('fa-')).join(' ');
      const catClass = Array.from(row.classList).find(c => c.startsWith('cat-'));
      const cat = categories.find(c => c.class === catClass);
      return 'fas ' + (cat ? cat.icon : 'fa-shapes');
    }

    // Each selected category has a reveal level (1, 2, 3 …): clicking its
    // icon again steps the level up — showing CAT_BATCH more of its items
    // each time, exactly like shary's "+" gradually revealing chips —
    // and once everything's shown, the next click collapses the category.
    const CAT_BATCH = 8;
    const catLevel = new Map();   // catId → reveal level (absent = not selected)

    function catRows(catId) {
      const cat = categories.find(c => c.id === catId);
      if (!cat) return [];
      return getRows().filter(r => r.classList.contains(cat.class));
    }
    // step the reveal for a category icon (shary-"+"-style)
    function stepCategory(catId) {
      const total = catRows(catId).length;
      const cur = catLevel.get(catId) || 0;
      if (cur === 0) { selectedCats.add(catId); catLevel.set(catId, 1); }
      else if (cur * CAT_BATCH < total) { catLevel.set(catId, cur + 1); }
      else { selectedCats.delete(catId); catLevel.delete(catId); }
    }

    function makeBubble(row, riseIndex) {
      const name = row.querySelector('.col-item')?.textContent.trim() || '';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'inv-bubble';
      b.style.setProperty('--ri', riseIndex);
      b.title = name;
      b.setAttribute('aria-label', name);
      b.innerHTML = `<i class="${rowIconClass(row)}" aria-hidden="true"></i>`;
      const lab = document.createElement('span');
      lab.className = 'inv-bubble-label';
      lab.textContent = name;   // title shown below the icon when checked
      b.appendChild(lab);
      // bubbles start unchecked (icon only) — clicking cycles the state:
      // 1× Have-green · 2× Wish-blue · 3× Want · 4× Need · 5× Reset
      const st = currentRowState(row);
      if (st) b.dataset.state = st;
      b.addEventListener('click', () => {
        const idx = STATE_CYCLE.indexOf(currentRowState(row));
        const next = STATE_CYCLE[(idx + 1) % STATE_CYCLE.length];
        setRowState(row, next);
        if (next) b.dataset.state = next; else b.removeAttribute('data-state');
      });
      return b;
    }

    // rows to show = each selected category's items sliced to its reveal level
    function bubbleVisibleRows() {
      const rows = [];
      categories.forEach(cat => {
        if (!selectedCats.has(cat.id)) return;
        const lvl = catLevel.get(cat.id) || 1;
        rows.push(...catRows(cat.id).slice(0, lvl * CAT_BATCH));
      });
      return rows;
    }

    // ── Physics cloud (ported from shary's reasons section) — bubbles
    //    drift, bounce off the walls and off each other. ──
    const bubblePhysics = new Map(); // el → {x, y, w, h, vx, vy}  (% of cloud)
    let bubbleRaf = null;
    const bRandVel = () => (Math.random() - 0.5) * 0.22;
    function stopBubblePhysics() {
      if (bubbleRaf) { cancelAnimationFrame(bubbleRaf); bubbleRaf = null; }
      bubblePhysics.clear();
    }
    function measureBubble(el, rect) {
      const r = el.getBoundingClientRect();
      return {
        w: r.width && rect.width ? (r.width / rect.width) * 100 : 10,
        h: r.height && rect.height ? (r.height / rect.height) * 100 : 10,
      };
    }
    function stepBubbles() {
      const cloud = bubbleView.querySelector('.bubble-cloud');
      if (!cloud) { bubbleRaf = null; return; }
      const rect = cloud.getBoundingClientRect();
      if (!rect.width || !rect.height) { bubbleRaf = requestAnimationFrame(stepBubbles); return; }
      const items = [];
      Array.from(bubblePhysics.keys()).forEach(el => {
        if (el.parentNode !== cloud) { bubblePhysics.delete(el); return; }
        const it = bubblePhysics.get(el);
        const m = measureBubble(el, rect); it.w = m.w; it.h = m.h;
        items.push({ el, it });
      });
      // Velocities are in % of the cloud, so a taller cloud would make the
      // same % step cover more pixels — i.e. look faster after each expand.
      // Scale the step by a reference size so the on-screen drift speed stays
      // constant no matter how far the area has grown.
      const sx = 440 / rect.width;
      const sy = 300 / rect.height;
      for (const { it } of items) {
        it.x += it.vx * sx; it.y += it.vy * sy;
        if (it.x < 0)          { it.x = 0;          it.vx =  Math.abs(it.vx); }
        if (it.x + it.w > 100) { it.x = 100 - it.w; it.vx = -Math.abs(it.vx); }
        if (it.y < 0)          { it.y = 0;          it.vy =  Math.abs(it.vy); }
        if (it.y + it.h > 100) { it.y = 100 - it.h; it.vy = -Math.abs(it.vy); }
      }
      // pairwise bounce — skip for big clouds to keep it smooth
      if (items.length <= 80) {
        for (let i = 0; i < items.length; i++) {
          const a = items[i].it;
          for (let j = i + 1; j < items.length; j++) {
            const b = items[j].it;
            if (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) {
              const dx = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
              const dy = Math.min(a.y + a.h - b.y, b.y + b.h - a.y);
              if (dx < dy) {
                const p = dx / 2;
                if (a.x < b.x) { a.x -= p; b.x += p; } else { a.x += p; b.x -= p; }
                const t = a.vx; a.vx = b.vx; b.vx = t;
              } else {
                const p = dy / 2;
                if (a.y < b.y) { a.y -= p; b.y += p; } else { a.y += p; b.y -= p; }
                const t = a.vy; a.vy = b.vy; b.vy = t;
              }
            }
          }
        }
      }
      for (const { el, it } of items) {
        el.style.left = it.x.toFixed(2) + '%';
        el.style.top  = it.y.toFixed(2) + '%';
      }
      bubbleRaf = requestAnimationFrame(stepBubbles);
    }
    // newly added bubbles enter from the bottom edge (rising up) with a slight
    // upward velocity; reduced-motion users get a static scatter instead.
    function seedOneBubble(el, rect) {
      const m = measureBubble(el, rect);
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const x = +(Math.random() * Math.max(1, 100 - m.w)).toFixed(2);
      const y = reduce ? +(Math.random() * Math.max(1, 100 - m.h)).toFixed(2)
                       : +(100 - m.h).toFixed(2);   // start at the bottom, drift up
      el.style.left = x + '%'; el.style.top = y + '%';
      bubblePhysics.set(el, {
        x, y, w: m.w, h: m.h,
        vx: bRandVel(),
        vy: reduce ? 0 : (-Math.abs(bRandVel()) - 0.04),
      });
    }
    function ensureBubbleRaf() {
      if (!bubbleRaf && bubblePhysics.size && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        bubbleRaf = requestAnimationFrame(stepBubbles);
      }
    }
    function setCloudHeight(cloud, n, big) {
      const cw = cloud.getBoundingClientRect().width || 440;
      const perRow = Math.max(2, Math.floor(cw / 74));
      const gridRows = Math.ceil(n / perRow);
      // First reveal (every selected category still at level 1) stays compact;
      // once any category is clicked again the area expands ~4× per row.
      const rowH = big ? 416 : 110;
      cloud.style.height = Math.max(big ? 320 : 230, gridRows * rowH + (big ? 60 : 36)) + 'px';
    }

    const bubbleByRow = new Map(); // row el → bubble el (so reveals are incremental)

    // Incremental: keep already-drifting bubbles in place, only add the newly
    // revealed ones (rising from below) and drop ones whose category collapsed.
    function renderBubbles() {
      if (!bubbleView) return;
      const desired = bubbleVisibleRows();
      const desiredSet = new Set(desired);
      if (!desired.length) {
        stopBubblePhysics();
        bubbleByRow.clear();
        bubbleView.innerHTML = '<p class="bubble-hint">Pick one or more categories above to see their things as bubbles. Click a category again to reveal more of it. Tap a bubble: 1× Have · 2× Wish · 3× Want · 4× Need · 5× Reset.</p>';
        return;
      }
      let cloud = bubbleView.querySelector('.bubble-cloud');
      if (!cloud) {
        const legend =
          '<div class="bubble-legend">' +
          '<span><i class="dot have"></i>1× Have</span>' +
          '<span><i class="dot wish"></i>2× Wish</span>' +
          '<span><i class="dot want"></i>3× Want</span>' +
          '<span><i class="dot need"></i>4× Need</span>' +
          '<span><i class="dot reset"></i>5× Reset</span>' +
          '</div>';
        bubbleView.innerHTML = legend + '<div class="bubble-cloud"></div>';
        cloud = bubbleView.querySelector('.bubble-cloud');
        bubbleByRow.clear();
        bubblePhysics.clear();
      }
      // drop bubbles whose category was collapsed/deselected
      bubbleByRow.forEach((el, row) => {
        if (!desiredSet.has(row)) { el.remove(); bubblePhysics.delete(el); bubbleByRow.delete(row); }
      });
      // grow the area first so new bubbles seed against the final height.
      // Only expand big once some category has been re-clicked (level ≥ 2);
      // the first reveal stays compact (no empty space up top).
      const big = Array.from(catLevel.values()).some(l => l >= 2);
      setCloudHeight(cloud, desired.length, big);
      const rect = cloud.getBoundingClientRect();
      // add the newly revealed ones, rising from the bottom (staggered)
      let rise = 0;
      desired.forEach(row => {
        if (bubbleByRow.has(row)) return;
        const b = makeBubble(row, rise++);
        cloud.appendChild(b);
        bubbleByRow.set(row, b);
        seedOneBubble(b, rect);
      });
      ensureBubbleRaf();
    }

    function setMultiMode(on) {
      multiMode = on;
      document.body.classList.toggle('magic-mode', on);
      catMagicBtn?.setAttribute('aria-pressed', String(on));
      selectedCats.clear();
      catLevel.clear();
      stopBubblePhysics();
      bubbleByRow.clear();
      if (bubbleView) bubbleView.innerHTML = '';
      if (on) {
        // carry over the current single-select category, if any
        if (activeCat && activeCat !== 'all') { selectedCats.add(activeCat); catLevel.set(activeCat, 1); }
        syncTabActive();
        renderBubbles();
      } else {
        filterByCategory(activeCat);  // restore the normal filtered table
      }
    }
    catMagicBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      setMultiMode(!multiMode);
    });

    // ---------- PAGINATION (20 items per page) ----------
    const PAGE_SIZE = 20;
    let currentPage = 0;
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pageInfo    = document.getElementById('pageInfo');

    function applyPagination() {
      const filtered = getRows().filter(r => !r.classList.contains('hidden-row'));
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      if (currentPage < 0) currentPage = 0;
      const start = currentPage * PAGE_SIZE;
      const end   = start + PAGE_SIZE;
      getRows().forEach(r => r.classList.remove('hidden-page'));
      filtered.forEach((r, i) => {
        if (i < start || i >= end) r.classList.add('hidden-page');
      });
      if (pageInfo) pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
      if (prevPageBtn) prevPageBtn.disabled = currentPage === 0;
      if (nextPageBtn) nextPageBtn.disabled = currentPage >= totalPages - 1;
    }
    if (prevPageBtn) prevPageBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentPage > 0) { currentPage--; applyPagination(); }
    });
    if (nextPageBtn) nextPageBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentPage++;
      applyPagination();
    });

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        if (multiMode) {
          stepCategory(tab.dataset.cat);   // 1st click selects · re-clicks reveal more · then collapse
          syncTabActive();
          renderBubbles();
        } else {
          filterByCategory(tab.dataset.cat);
        }
      });
    });

    // Attach cell click listeners (delegation)
    tbody.addEventListener('click', handleCellClick);

    // ---------- TITLE → scroll to resume ----------
    const titleBtn = document.getElementById('titleBtn');
    const phrasePanel = document.getElementById('phrasePanel');
    if (titleBtn && phrasePanel) {
      titleBtn.addEventListener('click', () => {
        phrasePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    // ---------- 'My selected things' master toggle ----------
    const phraseMasterBtn = document.getElementById('phraseMasterBtn');
    if (phraseMasterBtn && phrasePanel) {
      phraseMasterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = phrasePanel.classList.toggle('is-master-open');
        phraseMasterBtn.setAttribute('aria-expanded', String(open));
      });
    }

    // ---------- MAGIC (sentence from picks) ----------
    const magicBtn = document.getElementById('magicBtn');
    function inventaryMagic(e){
      if (e) e.stopPropagation();
      const grouped = itemsByType();
      const pick = arr => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
      const haveOne = pick(grouped.have), wishOne = pick(grouped.wish);
      const wantOne = pick(grouped.want), needOne = pick(grouped.need);
      if (![haveOne, wishOne, wantOne, needOne].some(Boolean)) {
        setHint('✨ Tick some cells and I will craft a sentence from them.');
        return;
      }
      const parts = [];
      if (haveOne) parts.push(`I have <em>${escapeHtml(haveOne.name)}</em>`);
      if (wishOne) parts.push(`I dream of <em>${escapeHtml(wishOne.name)}</em>`);
      if (wantOne) parts.push(`I am looking for <em>${escapeHtml(wantOne.name)}</em>`);
      if (needOne) parts.push(`I need <em>${escapeHtml(needOne.name)}</em>`);
      setHint(`✨ Today ${parts.join(', ')}.`);
      if (magicBtn) magicBtn.setAttribute('aria-pressed','true');
    }
    magicBtn?.addEventListener('click', inventaryMagic);

    // ---------- SAVE / SHARE / PUBLISH (goddess-style reveal) ----------
    const hintMessage = document.getElementById('hintMessage');
    function setHint(html) { hintMessage.innerHTML = html; }
    const shareBtn = document.getElementById('shareBtn');
    const wraps = {
      share: document.getElementById('shareWrap'),
    };
    function closeAllWraps(except) {
      Object.values(wraps).forEach(w => { if (w !== except) w.classList.remove('is-open'); });
    }
    function toggleWrap(wrap) {
      const wasOpen = wrap.classList.contains('is-open');
      closeAllWraps();
      if (!wasOpen) wrap.classList.add('is-open');
    }
    shareBtn.addEventListener('click', e => { e.stopPropagation(); toggleWrap(wraps.share); });
    document.addEventListener('click', () => closeAllWraps());

    function selectionsByItem() {
      const out = [];
      getRows().forEach(r => {
        const item = r.querySelector('.col-item')?.textContent.trim() || '';
        const have = r.querySelector('.col-have')?.classList.contains('selected-have');
        const wish = r.querySelector('.col-wish')?.classList.contains('selected-wish');
        const want = r.querySelector('.col-want')?.classList.contains('selected-want');
        const need = r.querySelector('.col-need')?.classList.contains('selected-need');
        if (have || wish || want || need) out.push({ item, have, wish, want, need });
      });
      return out;
    }
    function plainText() {
      const sel = selectionsByItem();
      if (!sel.length) return 'inventary · no selections yet';
      return ['inventary', ...sel.map(s => {
        const tags = [];
        if (s.have) tags.push('HAVE'); if (s.wish) tags.push('WISH');
        if (s.want) tags.push('WANT'); if (s.need) tags.push('NEED');
        return `${s.item} — ${tags.join(' / ')}`;
      })].join(' · ');
    }
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function shareUrl(target) {
      const txt = `inventary · ${plainText().slice(0, 220)}`;
      const enc = encodeURIComponent(txt);
      const page = encodeURIComponent(location.href);
      switch (target) {
        case 'whatsapp': return `https://wa.me/?text=${enc}%20${page}`;
        case 'telegram': return `https://t.me/share/url?url=${page}&text=${enc}`;
        case 'mail':     return `mailto:?subject=${encodeURIComponent('inventary snapshot')}&body=${enc}%0A%0A${page}`;
      }
    }
    // ── Summary-model: the single source every export format reads from ──
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const escAttr = s => esc(s).replace(/"/g, '&quot;');
    function buildModel() {
      const sels = selectionsByItem();
      const flags = it => ['have','wish','want','need'].filter(k => it[k]);
      return {
        app: 'Inventary', version: 1,
        phrase: plainText(),
        sections: [{ label: 'Items', title: '', items: sels.map(it => `${it.item} — ${flags(it).join(', ') || '—'}`) }],
        raters: [],
        picked: sels
      };
    }
    // §13.15 wizy — domain agent block, folded into the record on a Wizy publish
    // so any agent (local MyWizy or external) can act on an Inventary.
    window.floveAgentBlock = function buildAgentBlock(m) {
      return {
        prompt: 'You are handed an Inventary: a list of things, each tagged with any of '
          + 'have · wish · want · need. Read the items and their tags, then help the user '
          + 'reflect on the balance — what they already have versus what they wish, want or '
          + 'need — without judgement, and offer one gentle question about a single item.',
        schema: {
          app: 'app slug (Inventary)',
          phrase: 'one-line human summary the app composed',
          picked: 'array of { item, have, wish, want, need } — booleans per tag',
          sections: 'rendered item lines grouped for display'
        },
        context: {
          source: 'inventary · FLOVE',
          url: 'https://flove.org/apps/economy/dealy/inventary.html',
          axis: 'economy (have · wish · want · need)'
        },
        suggestions: [
          'Summarise the balance between have and want/wish/need in one sentence.',
          'Point out anything tagged need but not have.',
          'Offer one gentle question about a single item the user might revisit.'
        ]
      };
    };
    window.floveSummary = () => buildModel();   // §13.15 — publish-to-Appy WRITER hook

    // ── flove-portrait/1 — extractive export / consult / import ──
    (function portraitBridge(){
      const app = 'inventary';
      const source = 'https://flove.org/apps/economy/dealy/inventary.html';
      const consent = { share: 'app', purposes: ['self-reflection', 'export'] };
      const tagsOf = it => ['have','wish','want','need'].filter(k => it[k]);
      function get(){
        const sels = selectionsByItem();
        const counts = { have:0, wish:0, want:0, need:0 };
        sels.forEach(it => { if (it.have) counts.have++; if (it.wish) counts.wish++; if (it.want) counts.want++; if (it.need) counts.need++; });
        return {
          schema: 'flove-portrait/1', app, version: 1,
          generatedAt: new Date().toISOString(),
          lang: (document.documentElement.lang || 'en').slice(0, 2),
          rows: sels.map((it, i) => ({
            key: 'item:' + i,
            kind: 'item',
            title: it.item,
            items: tagsOf(it)
          })),
          words: sels.flatMap(tagsOf),
          completeness: { layers: sels.length, total: getRows().length },
          stats: { items: sels.length, counts },
          consent, source: { url: source }
        };
      }
      function validatePortrait(payload){
        const errors = [];
        if (!payload || typeof payload !== 'object') errors.push('not an object');
        else {
          if (payload.schema && payload.schema !== 'flove-portrait/1' && payload.schema !== 'flove-consult/1') errors.push('bad schema');
          if (payload.app && payload.app !== app) errors.push('app must be inventary');
          if (!Array.isArray(payload.rows)) errors.push('rows must be an array');
        }
        return { ok: errors.length === 0, errors };
      }
      function consult(sel = {}){
        const m = get();
        const purpose = sel.purpose || 'export';
        const allowed = !sel.enforceConsent || consent.purposes.includes(purpose);
        const rows = allowed ? m.rows.filter(r => {
          if (sel.kinds && !sel.kinds.includes(r.kind)) return false;
          if (sel.tag && !r.items.includes(sel.tag)) return false;
          return true;
        }) : [];
        return {
          schema: 'flove-consult/1', app, version: 1, generatedAt: m.generatedAt,
          rows: rows.slice(0, sel.maxItems || rows.length),
          words: sel.includeWords ? m.words : undefined,
          completeness: m.completeness, consent, purpose, allowed
        };
      }
      function merge(payload, opts = {}){
        const v = validatePortrait(payload);
        if (!v.ok) return { ok: false, errors: v.errors, applied: 0 };
        const mode = opts.mode === 'replace' ? 'replace' : 'fill-empty';
        let applied = 0;
        (payload.rows || []).forEach(r => {
          if (!r || r.kind !== 'item' || !r.title) return;
          const tag = (r.items || [])[0];
          if (!['have','wish','want','need'].includes(tag)) return;
          const row = getRows().find(x =>
            (x.querySelector('.col-item')?.textContent.trim() || '').toLowerCase() === String(r.title).toLowerCase());
          if (!row) return;
          if (mode !== 'replace' && currentRowState(row)) return;
          setRowState(row, tag);
          applied++;
        });
        if (applied && typeof updateCounts === 'function') updateCounts();
        return { ok: true, applied, mode };
      }
      function selfTest(){
        const m = get();
        const v = validatePortrait(m);
        const c = consult({ maxItems: 3 });
        const out = { ok: v.ok && Array.isArray(c.rows), rows: m.rows.length, consultRows: c.rows.length, errors: v.errors };
        try { console.log('[flovePortrait] inventary self-test', out); } catch (_) {}
        return out;
      }
      window.flovePortrait = {
        schema: 'flove-portrait/1', get, validate: validatePortrait, consult, merge, selfTest,
        toSummary: buildModel,
        toAgent: () => (window.floveAgentBlock ? window.floveAgentBlock(buildModel()) : null)
      };
      window.flovePort = { export: get, consult, import: merge };
      window.floveNet = window.flovePort;
      window.floveImport = merge;
      try {
        if (new URLSearchParams(location.search).has('selftest')) {
          const _st = window.flovePortrait.selfTest();
          console.log('[flovePortrait] selftest', _st);
        }
      } catch (_) {}
    })();
    // JSON-only save
    document.querySelectorAll('.subitem[data-group="save"][data-action="json"]').forEach(btn => {
      btn.addEventListener('click', () => {
        downloadBlob(new Blob([JSON.stringify(window.flovePortrait.get(), null, 2)], { type: 'application/json;charset=utf-8' }), 'inventary-portrait.json');
        setHint('<i class="fas fa-check-circle"></i> JSON downloaded!');
      });
    });

    const phraseItems = {
      have: document.getElementById('phraseItemsHave'),
      wish: document.getElementById('phraseItemsWish'),
      want: document.getElementById('phraseItemsWant'),
      need: document.getElementById('phraseItemsNeed'),
    };

    // per-(item,type) state. shareable applies to HAVE, much to WISH/WANT/NEED.
    const itemState = {};
    function stateKey(name, type) { return `${type}::${name}`; }
    function ensureItemState(key) {
      if (!itemState[key]) itemState[key] = { shareable: false, much: false, maybe: false, unlikely: false, very: false, notes: [], worthy: null, worthyOpen: false, offerOpen: false, pref: null, urgent: false, fully: false };
      return itemState[key];
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function rowCatClass(row) {
      return (row.dataset.category ? `cat-${row.dataset.category}` : '') || '';
    }
    function itemsByType() {
      // collect ALL selections, regardless of active category filter
      const result = { have: [], wish: [], want: [], need: [] };
      getRows().forEach(row => {
        const name = row.querySelector('.col-item')?.textContent.trim() || '';
        const catClass = rowCatClass(row);
        ['have','wish','want','need'].forEach(t => {
          if (row.querySelector(`.col-${t}`)?.classList.contains(`selected-${t}`)) {
            result[t].push({ name, catClass });
          }
        });
      });
      return result;
    }

    function renderItemCard(name, type) {
      const key = stateKey(name, type);
      const st = ensureItemState(key);
      const keyAttr = escapeHtml(key);
      const notesHtml = st.notes.map((n, idx) =>
        `<div class="note"><span class="note-text">${escapeHtml(n)}</span><button class="note-del" data-key="${keyAttr}" data-idx="${idx}" aria-label="delete note">×</button></div>`
      ).join('');

      // per-item pills: HAVE → Shareable + maybe + unlikely + custom + ＋ (right of name);
      //                 WISH/WANT/NEED → very + Much (right of name, "very" left of Much)
      let pillsHtml = '';
      if (type === 'have') {
        const subHidden = st.shareable ? '' : 'hidden';
        const customs = (st.customSubs || []).map((c, i) =>
          `<button type="button" class="sub-pill" data-key="${keyAttr}" data-custom-idx="${i}" aria-pressed="${c.pressed}" ${subHidden}>${escapeHtml(c.label)}</button>`
        ).join('');
        pillsHtml = `
          <button type="button" class="extra-toggle" data-key="${keyAttr}" data-extra="shareable" aria-pressed="${st.shareable}">Shareable</button>
          <span class="pref-bars" role="group" aria-label="Preference 1 to 5" title="Preference 1–5">
            ${[1,2,3,4,5].map(n => `<button type="button" class="pref-bar${st.pref === n ? ' is-selected' : ''}" data-key="${keyAttr}" data-p="${n}" aria-label="Preference ${n}/5" title="${n}/5"></button>`).join('')}
          </span>
          <button type="button" class="sub-pill" data-key="${keyAttr}" data-value="maybe" aria-pressed="${st.maybe}" ${subHidden}>maybe</button>
          <button type="button" class="sub-pill" data-key="${keyAttr}" data-value="unlikely" aria-pressed="${st.unlikely}" ${subHidden}>unlikely</button>
          ${customs}
          <button type="button" class="sub-pill sub-pill--add" data-key="${keyAttr}" data-action="add-sub" title="More options" aria-label="More options" aria-pressed="${!!st.offerOpen}" ${subHidden}>＋</button>
        `;
      } else {
        const subHidden = st.much ? '' : 'hidden';
        // Wishes get a "Fully" flag; Wants & Needs get an "Urgent" flag
        const flag = type === 'wish'
          ? `<button type="button" class="flag-toggle" data-key="${keyAttr}" data-flag="fully" aria-pressed="${!!st.fully}">Fully</button>`
          : `<button type="button" class="flag-toggle" data-key="${keyAttr}" data-flag="urgent" aria-pressed="${!!st.urgent}">Urgent</button>`;
        pillsHtml = `
          ${flag}
          <button type="button" class="sub-pill" data-key="${keyAttr}" data-value="very" aria-pressed="${st.very}" ${subHidden}>very</button>
          <button type="button" class="extra-toggle" data-key="${keyAttr}" data-extra="much" aria-pressed="${st.much}">Much</button>
        `;
      }

      return `
        <div class="sel-item${type === 'have' && st.worthyOpen ? ' is-worthy-open' : ''}">
          <div class="sel-row">
            ${iconHtml(name)}
            <span class="sel-name">${escapeHtml(name)}</span>
            ${pillsHtml}
          </div>
          <div class="sel-notes">${notesHtml}</div>
          <div class="add-note">
            <div class="add-note-row">
              <input type="text" data-key="${keyAttr}" placeholder="add additional info…">
              <button class="note-save" type="button" data-key="${keyAttr}">Save</button>
            </div>
            <div class="add-note-tools">
              <div class="tools-left"></div>
              <div class="tools-center">
                <button class="note-mic" type="button" data-key="${keyAttr}" title="voice note" aria-label="voice note">
                  <i class="fas fa-microphone"></i>
                </button>
                <label class="note-file" title="attach file" aria-label="attach file">
                  <i class="fas fa-paperclip"></i>
                  <input type="file" data-key="${keyAttr}">
                </label>
              </div>
              <div class="tools-right">${type === 'have' ? `<button class="note-worthing" type="button" data-key="${keyAttr}" title="Worth it" aria-pressed="${!!st.worthyOpen}">Worth it</button>` : ''}</div>
            </div>
            ${type === 'have' ? `
              <div class="worthy-bars" role="group" aria-label="Worth it level">
                ${[1,2,3,4,5,6,7,8].map(n =>
                  `<button type="button" class="worthy-bar${st.worthy === n ? ' is-selected' : ''}" data-key="${keyAttr}" data-w="${n}" aria-label="Worth it ${n}/8" title="${n}/8"></button>`
                ).join('')}
              </div>
              <div class="offer-info${st.offerOpen ? ' is-open' : ''}" data-key="${keyAttr}">
                Share it with the network? Take it to <a href="index.html">Dealy ↗</a> to offer what you already have.
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderAllCategories() {
      const grouped = itemsByType();
      ['have','wish','want','need'].forEach(type => {
        const entries = grouped[type];
        phraseItems[type].innerHTML = entries.length
          ? entries.map(e => renderItemCard(e.name, type)).join('')
          : '<div class="expand-empty">No items in this category yet.</div>';
      });
    }

    function setAllOpen(open) {
      Object.values(phraseLines).forEach(line => line.classList.toggle('open', open));
    }

    // toggle a single category by clicking its head — but ignore clicks on the inline pill toggle
    Object.entries(phraseLines).forEach(([type, line]) => {
      line.querySelector('.pl-head').addEventListener('click', (e) => {
        if (e.target.closest('.extra-toggle')) return; // pill handles its own click
        const willOpen = !line.classList.contains('open');
        line.classList.toggle('open', willOpen);     // expand first, always
        if (willOpen) renderAllCategories();          // then (re)render its items
      });
    });

    // section-level pill toggle (shareable on HAVE; much on WISH/WANT/NEED)
    function thunderZap(btn) {
      btn.classList.remove('zap');
      // restart animation
      void btn.offsetWidth;
      btn.classList.add('zap');
      btn.addEventListener('animationend', () => btn.classList.remove('zap'), { once: true });

      // splash a few bolts around the pill
      const head = btn.closest('.pl-head, .sel-row');
      if (!head) return;
      const headRect = head.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const cx = btnRect.left - headRect.left + btnRect.width / 2;
      const cy = btnRect.top  - headRect.top  + btnRect.height / 2;
      const angles = [-90, -45, 0, 45, 90, 135, 180, 225];
      angles.forEach((deg, i) => {
        const bolt = document.createElement('span');
        bolt.className = 'thunder-bolt';
        bolt.textContent = '⚡';
        bolt.setAttribute('aria-hidden', 'true');
        const rad = (deg * Math.PI) / 180;
        const dist = 30 + Math.random() * 18;
        bolt.style.left = (cx - 8) + 'px';
        bolt.style.top  = (cy - 8) + 'px';
        bolt.style.setProperty('--dx', `${Math.cos(rad) * dist}px`);
        bolt.style.setProperty('--dy', `${Math.sin(rad) * dist}px`);
        bolt.style.setProperty('--r', `${(Math.random() * 60 - 30)}deg`);
        bolt.style.animationDelay = `${i * 18}ms`;
        head.appendChild(bolt);
        bolt.addEventListener('animationend', () => bolt.remove(), { once: true });
      });
    }
    // per-item pill toggles are wired via delegation on #phraseRows below.

    // delegated handlers across all four phrase-items containers
    document.getElementById('phraseRows').addEventListener('click', (e) => {
      // per-item Shareable / Much toggle
      const xt = e.target.closest('.sel-row .extra-toggle');
      if (xt) {
        e.stopPropagation();
        const key = xt.dataset.key;
        const extra = xt.dataset.extra; // 'shareable' or 'much'
        const st = ensureItemState(key);
        st[extra] = !st[extra];
        xt.setAttribute('aria-pressed', String(st[extra]));
        // reveal/hide sibling sub-pills; collapsing also resets their state
        xt.closest('.sel-row').querySelectorAll('.sub-pill').forEach(sp => {
          sp.hidden = !st[extra];
          if (st[extra]) return;
          if (sp.classList.contains('sub-pill--add')) return; // no state
          sp.setAttribute('aria-pressed', 'false');
          if (sp.dataset.value !== undefined) {
            st[sp.dataset.value] = false;
          } else if (sp.dataset.customIdx !== undefined) {
            const idx = parseInt(sp.dataset.customIdx, 10);
            if (st.customSubs && st.customSubs[idx]) {
              st.customSubs[idx].pressed = false;
            }
          }
        });
        thunderZap(xt);
        return;
      }
      // + sub-pill — toggle the dealy-advanced.html intro panel below the card
      const addSub = e.target.closest('.sel-row .sub-pill--add');
      if (addSub) {
        e.stopPropagation();
        const key = addSub.dataset.key;
        const st = ensureItemState(key);
        st.offerOpen = !st.offerOpen;
        addSub.setAttribute('aria-pressed', String(st.offerOpen));
        const card = addSub.closest('.sel-item');
        const info = card?.querySelector('.offer-info');
        if (info) info.classList.toggle('is-open', st.offerOpen);
        return;
      }
      // sub-pill (maybe / unlikely / very / custom) — independent toggle
      const sp = e.target.closest('.sel-row .sub-pill');
      if (sp) {
        e.stopPropagation();
        const key = sp.dataset.key;
        const st = ensureItemState(key);
        if (sp.dataset.customIdx !== undefined) {
          const idx = parseInt(sp.dataset.customIdx, 10);
          if (st.customSubs && st.customSubs[idx]) {
            st.customSubs[idx].pressed = !st.customSubs[idx].pressed;
            sp.setAttribute('aria-pressed', String(st.customSubs[idx].pressed));
          }
        } else {
          const val = sp.dataset.value;
          st[val] = !st[val];
          sp.setAttribute('aria-pressed', String(st[val]));
        }
        return;
      }
      // Flag toggle — Urgent (Want/Need) · Fully (Wish)
      const flag = e.target.closest('.sel-row .flag-toggle');
      if (flag) {
        e.stopPropagation();
        const key = flag.dataset.key;
        const f = flag.dataset.flag; // 'urgent' or 'fully'
        const st = ensureItemState(key);
        st[f] = !st[f];
        flag.setAttribute('aria-pressed', String(st[f]));
        return;
      }
      // Preference bar — set the level (or clear if pressing the same one)
      const pbar = e.target.closest('.pref-bar');
      if (pbar) {
        e.stopPropagation();
        const key = pbar.dataset.key;
        const n = parseInt(pbar.dataset.p, 10);
        const st = ensureItemState(key);
        st.pref = (st.pref === n) ? null : n;
        const bars = pbar.closest('.pref-bars');
        bars.querySelectorAll('.pref-bar').forEach(b => {
          b.classList.toggle('is-selected', parseInt(b.dataset.p, 10) === st.pref);
        });
        return;
      }
      // Worthy button — toggle the 8 worthy bars below
      const worth = e.target.closest('.note-worthing');
      if (worth) {
        e.stopPropagation();
        const key = worth.dataset.key;
        const st = ensureItemState(key);
        st.worthyOpen = !st.worthyOpen;
        const card = worth.closest('.sel-item');
        if (card) card.classList.toggle('is-worthy-open', st.worthyOpen);
        worth.setAttribute('aria-pressed', String(st.worthyOpen));
        return;
      }
      // Worthy bar click — set the level (or clear if pressing the same one)
      const wbar = e.target.closest('.worthy-bar');
      if (wbar) {
        e.stopPropagation();
        const key = wbar.dataset.key;
        const n = parseInt(wbar.dataset.w, 10);
        const st = ensureItemState(key);
        st.worthy = (st.worthy === n) ? null : n;
        const bars = wbar.closest('.worthy-bars');
        bars.querySelectorAll('.worthy-bar').forEach(b => {
          b.classList.toggle('is-selected', parseInt(b.dataset.w, 10) === st.worthy);
        });
        return;
      }
      // mic button — Web Speech API if available, else manual prompt
      const mic = e.target.closest('.note-mic');
      if (mic) {
        e.stopPropagation();
        const key = mic.dataset.key;
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR && !mic.classList.contains('is-recording')) {
          const rec = new SR();
          rec.lang = navigator.language || 'es-ES';
          rec.continuous = false;
          rec.interimResults = false;
          mic.classList.add('is-recording');
          rec.onresult = (ev) => {
            const t = Array.from(ev.results).map(r => r[0].transcript).join(' ').trim();
            if (t) {
              ensureItemState(key).notes.push(`🎤 ${t}`);
              renderAllCategories();
            }
          };
          rec.onend = () => mic.classList.remove('is-recording');
          rec.onerror = () => mic.classList.remove('is-recording');
          try { rec.start(); } catch { mic.classList.remove('is-recording'); }
        } else {
          const txt = prompt('🎤 voice note:');
          if (txt && txt.trim()) {
            ensureItemState(key).notes.push(`🎤 ${txt.trim()}`);
            renderAllCategories();
          }
        }
        return;
      }
      if (e.target.classList.contains('note-save')) {
        const key = e.target.dataset.key;
        const input = e.target.closest('.add-note').querySelector('input[type="text"]');
        const val = input.value.trim();
        if (!val) return;
        ensureItemState(key).notes.push(val);
        renderAllCategories();
      } else if (e.target.classList.contains('note-del')) {
        const key = e.target.dataset.key;
        const idx = parseInt(e.target.dataset.idx, 10);
        if (itemState[key]) {
          itemState[key].notes.splice(idx, 1);
          renderAllCategories();
        }
      }
    });
    document.getElementById('phraseRows').addEventListener('change', (e) => {
      const t = e.target;
      if (t.matches('input[type="file"][data-key]')) {
        const f = t.files && t.files[0];
        if (f) {
          ensureItemState(t.dataset.key).notes.push(`📎 ${f.name}`);
          t.value = '';
          renderAllCategories();
        }
      }
    });
    document.getElementById('phraseRows').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.matches('.add-note input[type="text"]')) {
        e.preventDefault();
        e.target.closest('.add-note').querySelector('.note-save')?.click();
      }
    });

    // refresh the per-category lists when selections or filters change
    function maybeRefreshExpand() {
      const anyOpen = Object.values(phraseLines).some(l => l.classList.contains('open'));
      if (anyOpen) renderAllCategories();
    }
    tbody.addEventListener('click', () => requestAnimationFrame(maybeRefreshExpand));
    tabs.forEach(tab => tab.addEventListener('click', () => requestAnimationFrame(maybeRefreshExpand)));

    // ── topbar menu actions ──────────────────────────────────────
    const menuCtl = document.getElementById('inventaryMenuOpen');
    function closeMenu() { if (menuCtl) menuCtl.checked = false; }
    document.querySelectorAll('.inventary-menu-list .menu-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        if (action === 'expand-all') {
          if (phrasePanel) {
            phrasePanel.classList.add('is-master-open');
            phraseMasterBtn?.setAttribute('aria-expanded', 'true');
          }
          setAllOpen(true);
        } else if (action === 'collapse-all') {
          setAllOpen(false);
        }
        else if (action === 'reset') {
          getRows().forEach(r => {
            ['have','wish','want','need'].forEach(t => {
              r.querySelector(`.col-${t}`)?.classList.remove(`selected-${t}`);
            });
            updateRowPriority(r);
          });
          updateCounts();
          if (Object.values(phraseLines).some(l => l.classList.contains('open'))) renderAllCategories();
          setHint('↺ Selections reset.');
        } else if (action === 'toggle-cats') {
          if (tabsPlusBtn) tabsPlusBtn.click();
        } else if (action === 'help') {
          setHint('💡 Tap any cell to toggle HAVE/WISH/WANT/NEED · priority NEED > WANT > WISH > HAVE.');
        } else if (action === 'about') {
          setHint('🌱 Inventary · a sheet of things you have, wish, want and need.');
        }
        closeMenu();
      });
    });
    // close menu on outside click
    document.addEventListener('click', (e) => {
      if (!menuCtl || !menuCtl.checked) return;
      if (e.target.closest('.inventary-menu-wrap')) return;
      closeMenu();
    });

    // ── magic ✨ + lovely / joy / wisdom bots in the label-row ────
    const magicCtl  = document.getElementById('inventaryMagic');
    const newInput  = document.getElementById('inventaryNewInput');
    const botPools = {
      lovely: ['Yoga mat', 'Guitar', 'Watercolor set', 'Bonsai tree', 'Books', 'Pet food', 'Tutoring', 'Knitting needles', 'Coffee', 'Babysitting'],
      joy:    ['Party supplies', 'Board games', 'Concert ticket', 'Ukulele', 'Bike', 'Camping stove', 'Workshop', 'Drums', 'Gift card'],
      wisdom: ['Library card', 'Online course', 'Mentor', 'Reading list', 'Language partner', 'Notebook', 'First aid kit', 'Translator app']
    };
    function botPick(bot) {
      const pool = botPools[bot] || [];
      if (!pool.length) return '';
      return pool[Math.floor(Math.random() * pool.length)];
    }
    document.querySelectorAll('.inventary-bot').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const suggestion = botPick(btn.dataset.bot);
        if (suggestion && newInput) {
          // restart the flash animation reliably
          newInput.classList.remove('is-bot-filled');
          void newInput.offsetWidth;
          newInput.value = suggestion;
          newInput.classList.add('is-bot-filled');
          newInput.focus();
        }
        if (magicCtl) magicCtl.checked = false;
      });
    });

    // X clear button removes the bot suggestion (and the visible marker)
    const clearBtn = document.getElementById('inventaryClearBtn');
    if (clearBtn && newInput) {
      clearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        newInput.value = '';
        newInput.classList.remove('is-bot-filled');
        newInput.focus();
      });
    }
    // Typing manually clears the bot-fill marker
    if (newInput) {
      newInput.addEventListener('input', () => newInput.classList.remove('is-bot-filled'));
    }

    // Add a new thing at the top of the list, regardless of the active filter
    function addNewThingAtTop() {
      const name = newInput?.value.trim();
      if (!name) { newInput?.focus(); return; }
      const row = buildRow(name, 'cat-varios');
      row.classList.add('is-new');
      const labelRow = tbody.querySelector('.label-row');
      if (labelRow && labelRow.nextSibling) {
        tbody.insertBefore(row, labelRow.nextSibling);
      } else {
        tbody.appendChild(row);
      }
      // reset filter + page so the new row is visible regardless of current state
      currentPage = 0;
      activeCat = null;
      filterByCategory(null);
      newInput.value = '';
      newInput.classList.remove('is-bot-filled');
      setHint(`✚ "${escapeHtml(name)}" added to the top.`);
    }

    if (newInput) {
      newInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        addNewThingAtTop();
      });
    }
    const addBtn = document.getElementById('inventaryAddBtn');
    if (addBtn) {
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        addNewThingAtTop();
      });
    }

    /* ✦ F0 local persistence (backend_plan.md §10.3a/b).
       Inventary's state is class-/object-based, not form-field based, so the
       generic input-scanner pattern can't capture it. We snapshot three things:
       (1) the names of dynamically-added rows (.is-new), so they can be
       re-created on load; (2) every row's selected priority cells
       (name → [have|wish|want|need]); and (3) the per-item itemState object
       (pills, notes, pref, worthy, urgent/fully, customSubs…). On load we
       re-create added rows FIRST, then re-apply selections, then merge
       itemState, then re-render — so the structure exists before values land.
       Defensive: missing/corrupt/old storage is ignored, never throws. */
    const LS_BASE = 'flove:' + (location.pathname.split('/').pop().replace(/\.html$/, '') || 'app');
    const LS_KEY = LS_BASE + ':state';
    const LS_SCHEMA_KEY = LS_BASE + ':schema';
    const LS_SCHEMA_VERSION = '1';

    // Request durable storage on first interaction, guarded once (§10.3a).
    let _persistAsked = false;
    function requestPersist() {
      if (_persistAsked) return;
      _persistAsked = true;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    }

    function snapshotState() {
      const added = [];
      const selections = [];
      getRows().forEach(row => {
        const name = row.querySelector('.col-item')?.textContent.trim() || '';
        if (!name) return;
        if (row.classList.contains('is-new')) {
          added.push({ name, catClass: rowCatClass(row) || 'cat-varios' });
        }
        const types = ['have', 'wish', 'want', 'need'].filter(t =>
          row.querySelector('.col-' + t)?.classList.contains('selected-' + t));
        if (types.length) selections.push({ name, types });
      });
      return { added, selections, itemState };
    }

    // ✦ Stale-dot helpers (§10.3a): in-session edits to stored data un-hide the
    //   dot; Update / Reset re-hide every dot. Driven by the edit path, no timer.
    function markStale() {
      document.querySelectorAll('.stale-dot').forEach(d => { d.hidden = false; });
    }
    function clearStale() {
      document.querySelectorAll('.stale-dot').forEach(d => { d.hidden = true; });
    }

    let _saveT;
    function saveState() {
      clearTimeout(_saveT);
      _saveT = setTimeout(() => {
        try {
          window.floveStore.set(LS_KEY, JSON.stringify(snapshotState()));
          window.floveStore.set(LS_SCHEMA_KEY, LS_SCHEMA_VERSION);
        } catch (e) {
          // QuotaExceeded / private mode: never crash (§10.3b). On quota, nudge
          // the user toward export (Save) so their work isn't silently lost.
          if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
            try { setHint('<span class="t-en" lang="en">Storage is full — use <b>Save</b> to export your snapshot.</span><span class="t-es" lang="es">Almacenamiento lleno — usa <b>Save</b> para exportar tu inventario.</span>'); } catch (_) {}
          }
        }
      }, 250);
    }

    // Wipe live state back to the page's pristine start (used by Reset and as
    // the first step of a re-hydrate so Update never duplicates added rows).
    function clearLiveState() {
      getRows().forEach(row => {
        if (row.classList.contains('is-new')) { row.remove(); return; }
        ['have', 'wish', 'want', 'need'].forEach(t => row.querySelector('.col-' + t)?.classList.remove('selected-' + t));
        updateRowPriority(row);
      });
      Object.keys(itemState).forEach(k => { delete itemState[k]; });
    }

    function restoreState() {
      // re-hydrate is idempotent: wipe live structure first so re-creating the
      // stored .is-new rows / selections / itemState doesn't pile up duplicates.
      clearLiveState();
      let raw = null;
      try { raw = window.floveStore.getRaw(LS_KEY); } catch (_) { return; }
      if (!raw) { renderAllCategories(); return; }
      let data;
      try { data = JSON.parse(raw); } catch (_) { renderAllCategories(); return; }  // corrupt → ignore
      if (!data || typeof data !== 'object') { renderAllCategories(); return; }

      // (1) re-create dynamically-added rows at the top (newest restored first
      //     so the visible order roughly matches insert-at-top behavior).
      if (Array.isArray(data.added)) {
        const labelRow = tbody.querySelector('.label-row');
        data.added.slice().reverse().forEach(a => {
          if (!a || !a.name) return;
          const row = buildRow(a.name, a.catClass || 'cat-varios');
          row.classList.add('is-new');
          if (labelRow && labelRow.nextSibling) tbody.insertBefore(row, labelRow.nextSibling);
          else tbody.appendChild(row);
        });
      }

      // (2) re-apply priority-cell selections by item name.
      if (Array.isArray(data.selections)) {
        const byName = {};
        getRows().forEach(row => {
          const n = row.querySelector('.col-item')?.textContent.trim() || '';
          if (n && !(n in byName)) byName[n] = row;
        });
        data.selections.forEach(sel => {
          const row = sel && byName[sel.name];
          if (!row || !Array.isArray(sel.types)) return;
          sel.types.forEach(t => {
            if (['have', 'wish', 'want', 'need'].indexOf(t) === -1) return;
            row.querySelector('.col-' + t)?.classList.add('selected-' + t);
          });
          updateRowPriority(row);
        });
      }

      // (3) merge the per-item state object (pills, notes, pref, worthy…).
      if (data.itemState && typeof data.itemState === 'object') {
        Object.keys(data.itemState).forEach(k => {
          const s = data.itemState[k];
          if (s && typeof s === 'object') itemState[k] = Object.assign(ensureItemState(k), s);
        });
      }
      renderAllCategories();
    }

    // A fresh OPEN restores saved choices; a RELOAD (F5 / reload logo) starts
    // fresh — clear this app's own keys and skip restore (§5.3 / §10.3a).
    function navIsReload() {
      try {
        const nav = performance.getEntriesByType &&
                    performance.getEntriesByType('navigation')[0];
        if (nav && nav.type) return nav.type === 'reload';
        if (performance.navigation) return performance.navigation.type === 1; // legacy
      } catch (_) {}
      return false;
    }

    // Initialize · no category expanded by default (all items shown, no active tab)
    if (navIsReload()) {
      // Empty ONLY this app's own keys — never localStorage.clear() (§10.3a).
      try { window.floveStore.remove(LS_KEY); } catch (_) {}
      try { window.floveStore.remove(LS_SCHEMA_KEY); } catch (_) {}
    }
    restoreState();  // no key present after a reload → renders empty default
    filterByCategory(null);
    updateAllHighlights();
    updateCounts();
    clearStale();  // a freshly-hydrated page is, by definition, up to date

    // ✦ Update: re-derive from stored state, then clear all stale dots (§10.3a).
    function onUpdate() {
      restoreState();
      filterByCategory(activeCat || null);
      updateAllHighlights();
      updateCounts();
      clearStale();
    }
    document.querySelectorAll('[data-flove-update]').forEach(b => b.addEventListener('click', onUpdate));

    // ✦ Reset: destructive — start a new play. Guard with confirm() (§10.3a).
    function onReset() {
      const ok = confirm(
        document.documentElement.lang === 'es'
          ? '¿Borrar todo y empezar de nuevo? Esto no se puede deshacer.'
          : 'Clear everything and start a new play? This cannot be undone.'
      );
      if (!ok) return;
      // Empty ONLY this app's own keys — never localStorage.clear() (§10.3a).
      try { window.floveStore.remove(LS_KEY); } catch (_) {}
      try { window.floveStore.remove(LS_SCHEMA_KEY); } catch (_) {}
      // Reload for a clean slate — the reload gate above then skips restore and
      // renders the empty default, so Reset and reload land identically.
      location.reload();
    }
    document.querySelectorAll('[data-flove-reset]').forEach(b => b.addEventListener('click', onReset));

    // Persist on any interaction — bubble-phase listeners fire AFTER the app's
    // own click/change handlers mutate the DOM classes and itemState.
    // Same path marks the stored snapshot stale (un-hides .stale-dot) and asks
    // for durable storage once, so it's hooked to the real edit flow, no timer.
    function onEdit(e) {
      const t = e.target && e.target.closest && e.target.closest('[data-flove-update],[data-flove-reset]');
      if (t) return;            // Update/Reset themselves manage the dots
      requestPersist();
      markStale();
      saveState();
    }
    document.addEventListener('click', onEdit, false);
    document.addEventListener('change', onEdit, false);
    document.addEventListener('input', onEdit, false);
  })();
</script>

/* Runtime conformance — dev harness: development/tools/conformance.html

(function(){
  var api = window.flovePortrait;
  if (!api || typeof api.get !== 'function' || typeof api.conformance === 'function') return;

  function flatFields(list, out){
    out = out || [];
    (list || []).forEach(function(f){

    }

    check('schema is flove-portrait/1', p.schema === 'flove-portrait/1', 'critical', p.schema);
    check('app slug is present', !!app, 'critical', p.app);

    var filename = app + '-portrait.json';

    catch (e) { v = { ok: false, errors: [e.message] }; }

    var rows = Array.isArray(p.rows) ? p.rows : null;
    check('rows[] is an array', !!rows, 'critical', rows ? rows.length + ' rows' : typeof p.rows);
    if (!rows){

    }

      if (list.length && !String(r.title || '').trim()) untitled = true;
      list.forEach(function(it){

          Math.round(fields.length ? mapped.length / fields.length * 100 : 100) + '%');

    try { c = api.consult ? api.consult(opts.consult || {}) : null; } catch (e) { c = null; }

          c && c.schema === 'flove-consult/1' && Array.isArray(c.rows), 'critical',

})();

<script data-flove-appy-standard>
(function(){

  function appyUrl(){ return location.href.replace(/\/(apps|projects)\/.*$/, '/apps/appy/appy-basic.html#profile'); }
  function toast(html){
    var el = document.getElementById('floveAppyToast');
    if (!el){
      el = document.createElement('div'); el.id = 'floveAppyToast';
      el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,520px);background:#161623;color:#ecebf5;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 18px 40px rgba(0,0,0,.45)';

  }
  function message(html){
    var h = document.querySelector('[data-flove-hint],#hintMessage,.hint-area,.flove-hint,[role="status"]');
    if (h) h.innerHTML = html; else toast(html);
  }
  function openAppy(rec){
    var w = null;
    try { w = window.open(appyUrl(), '_blank'); } catch (_) {}
    if (!w) return false;
    var fileMode = location.protocol === 'file:' || location.origin === 'null';
    var target = fileMode ? '*' : location.origin;
    var same = function (o) { return o === location.origin || (fileMode && (o === 'null' || o === 'file://')); };

    var name = String(raw).charAt(0).toUpperCase() + String(raw).slice(1);
    var id = String((p && p.appId) || raw).toLowerCase().replace(/[^a-z0-9]+/g, '') || 'app';
    var pth = location.pathname;
    var cat = /\/metas\//.test(pth) ? 'inside'
      : /\/bio\//.test(pth) ? 'inside'
      : /\/economy\//.test(pth) ? 'economy'
      : /\/trusty\//.test(pth) ? 'mating'
      : /\/puzzy\//.test(pth) ? 'ling'

    if (!window.flovePortrait || typeof window.flovePortrait.get !== 'function'){
      message('✈ ' + bx('This app has no portrait to share yet.', 'Esta app aún no tiene un retrato para compartir.'));
      return;
    }
    var p;
    try { p = window.flovePortrait.get(); }
    catch (_) { message('✈ ' + bx('Could not build the portrait.', 'No se pudo construir el retrato.')); return; }
    var v = window.flovePortrait.validate ? window.flovePortrait.validate(p) : { ok: true };

      return;

    var raw = storeGet(), list = [];
    try { list = raw ? JSON.parse(raw) : []; } catch (_) { list = []; }
    if (!Array.isArray(list)) list = [];

      schema: p.schema || 'flove-portrait/1', portrait: p,
      url: (p.source && p.source.url) || location.href,
      via: 'share', date: new Date().toISOString(),
      id: 'a' + Date.now().toString(36), file: m.id + '-portrait.json'

      if (list[i] && list[i].app === entry.app && list[i].via !== 'upload'){ at = i; break; }
    }
    if (at >= 0){ entry.id = (list[at] && list[at].id) || entry.id; list[at] = entry; }
    else list.push(entry);
    if (!storeSet(JSON.stringify(list))){
      message('✈ ' + bx('Local storage is blocked — use Save JSON and upload it in Appy.', 'El almacenamiento local está bloqueado — usa Guardar JSON y súbelo en Appy.'));
      return;
    }
    message('✓ ' + bx('Saved in your Appy profile · <a href="' + appyUrl() + '" data-appy-link>See profile</a>',

    });

    var b = document.createElement('button');
    b.type = 'button';
    b.className = ref.className;
    b.setAttribute('data-appy-standard', '1');
    b.setAttribute('aria-label', 'Send to Appy');
    b.innerHTML = '✈ <span class="en" lang="en">Appy</span><span class="es" lang="es">Appy</span>';

  }

    var g = document.querySelector('[data-group="share"]');
    if (g){
      var par = g.parentElement;
      var b = mk(g);
      var save = par.querySelector('[data-group="save"],[data-action="save"]');

      return;
    }
    var a = document.querySelector('[data-act="save"]');
    if (a){
      a.parentElement.insertBefore(mk(a), a.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var f = document.querySelector('.flove-share__item[data-action="save"]') || document.querySelector('.flove-share__item');
    if (f){
      f.parentElement.insertBefore(mk(f), f.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var fs = document.querySelector('.flove-summary__item[data-action="save"]') || document.querySelector('.flove-summary__item');
    if (fs){
      fs.parentElement.insertBefore(mk(fs), fs.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var b2 = mk({ className: '' });
    b2.textContent = '✈ Appy';
    b2.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9998;border:1px solid rgba(34,211,238,.55);background:rgba(8,12,20,.88);color:#22d3ee;border-radius:999px;padding:9px 14px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)';
    b2.addEventListener('click', function (e) { e.preventDefault(); save(); });
    document.body.appendChild(b2);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add);
  else add();
  setTimeout(add, 1200);
})();
</script>

  window.floveFieldsFlat = function(){
    var out = [];
    walk(typeof window.floveFields === 'function' ? window.floveFields() : [], '', out);
    return out;
  };
  if (window.flovePort && !window.flovePort.fields) window.flovePort.fields = window.floveFieldsFlat;
})();
</script>
<script>
/* a11y — labels that hold the state checkboxes: Enter/Space toggle them */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (!t || !t.matches || !t.matches('label[for][tabindex]')) return;
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); t.click(); }
});
</script>
