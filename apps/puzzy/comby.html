<script>
/* flove-store/1 + flove-net fallback — the common local-storage/net layer.
   Apps inline this same block so they stay self-contained; this file is the
   canonical reference and is shipped in the offline package. */
(function () {
  if (!window.floveStore) {
    var mem = new Map();
    function rawGet(k) {
      try { return localStorage.getItem(k); }
      catch (_) { return mem.has(k) ? mem.get(k) : null; }
    }
    function rawSet(k, v) {
      try { localStorage.setItem(k, v); return true; }
      catch (e) {
        mem.set(k, v);
        try { window.dispatchEvent(new CustomEvent('flove:storage-error', { detail: { key: k, error: e } })); } catch (_) {}
        return false;
      }
    }
    window.floveStore = {
      getRaw: function (k, fallback) { var v = rawGet(k); return v == null ? (fallback === undefined ? null : fallback) : v; },
      getJSON: function (k, fallback) {
        try { var v = rawGet(k); return v == null ? (fallback === undefined ? null : fallback) : JSON.parse(v); }
        catch (_) { return fallback === undefined ? null : fallback; }
      },
      set: function (k, v) { return rawSet(k, typeof v === 'string' ? v : JSON.stringify(v)); },
      setJSON: function (k, v) { return rawSet(k, JSON.stringify(v)); },
      remove: function (k) { try { localStorage.removeItem(k); } catch (_) {} mem.delete(k); },
      available: function () {
        try { var k = '__flove_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
        catch (_) { return false; }
      },
      memoryOnly: function () { return !this.available(); }
    };
  }
  if (!window.floveFields) window.floveFields = function () {
    try { var el = document.getElementById('flove-fields'); return el ? (JSON.parse(el.textContent).fields || []) : []; }
    catch (_) { return []; }
  };
  if (!window.flovePort) {
    window.flovePort = {
      schema: 'flove-port/1',
      export: function () { return { schema: 'flove-portrait/1', app: null, version: 1, generatedAt: new Date().toISOString(), rows: [] }; },
      consult: function () { return { schema: 'flove-consult/1', app: null, version: 1, generatedAt: new Date().toISOString(), rows: [] }; },
      import: function () { return { ok: false, applied: 0, errors: ['no app adapter'] }; }
    };
  }
  if (!window.floveNet) window.floveNet = window.flovePort; // deprecated alias
  if (!window.flovePortrait) window.flovePortrait = window.flovePort;
  if (!window.floveSummary) window.floveSummary = function () { return window.flovePort.export(); };
})();

</script>

/* inlined from apps/flove.css */
/* ============================================================
   🌱 flove.css · shared identity layer for all FLOVE demos
   --------------------------------------------------------------
   Design intent
   - One cohesive frame around 13 very different apps.
   - Each app keeps its own palette by overriding `--app-*` tokens
     in its local `:root`. This file only paints the common skin.
   - Two visual primitives identify the family everywhere:
       1. The 🌱 sprout mark (brand)
       2. The flove-bar at the very top (back to launcher + app name)
   - A common motion vocabulary (gentle lift, soft fade, wiggle).
   ============================================================ */

:root {
  /* The sprout — flove brand mark. Used as logo glyph everywhere. */
  --flove-mark: "🌱";

  /* Per-app overridable accent. Apps redeclare these. */
  --app-accent:        #6ee7b7;
  --app-accent-soft:   #a7f3d0;
  --app-ink-on-accent: #042418;

  /* Family geometry & motion (constant across apps) */
  --flove-radius-sm: 12px;
  --flove-radius:    20px;
  --flove-radius-lg: 28px;
  --flove-radius-pill: 999px;
  --flove-ease:    cubic-bezier(.2,.8,.2,1);
  --flove-fast:    .15s var(--flove-ease);
  --flove-medium:  .25s var(--flove-ease);
  --flove-slow:    .4s  var(--flove-ease);

  /* Family typography. Apps may override font-family but should keep these scales. */
  --flove-font-ui: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --flove-font-display: 'Georgia', 'Times New Roman', serif;
}

/* ============================================================
   THE FLOVE BAR — a thin sticky strip at the very top of every
   app. Holds the back-to-launcher link, the sprout brand,
   and the app name. Lives ABOVE every app's own header.
   ============================================================ */
.flove-bar {
  position: sticky;
  top: 0;
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  font-family: var(--flove-font-ui);
  font-size: 13px;
  letter-spacing: .3px;
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid rgba(0,0,0,.06);
  color: #1a1a1a;
}

/* Auto dark variant when app body is dark */
@media (prefers-color-scheme: dark) {
  .flove-bar.flove-bar--auto {
    background: rgba(10,12,18,.55);
    border-bottom-color: rgba(255,255,255,.08);
    color: #e9ecf3;
  }
}
.flove-bar--dark {
  background: rgba(10,12,18,.6);
  border-bottom-color: rgba(255,255,255,.08);
  color: #e9ecf3;
}

.flove-bar a.flove-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: inherit;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--flove-radius-pill);
  transition: background var(--flove-fast), transform var(--flove-fast);
}
.flove-bar a.flove-home:hover {
  background: var(--app-accent-soft);
  color: var(--app-ink-on-accent);
  transform: translateX(-2px);
}
.flove-bar .flove-mark {
  font-size: 16px;
  color: var(--app-accent);
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--app-accent) 35%, transparent));
}
.flove-bar .flove-app-name {
  font-weight: 500;
  opacity: .85;
}
.flove-bar .flove-spacer { flex: 1; }
.flove-bar .flove-tag {
  font-size: 11px;
  letter-spacing: .8px;
  text-transform: uppercase;
  opacity: .55;
}

/* ============================================================
   SPROUT ANIMATION — used wherever a `.flove-sprout` lives
   (launcher hero, footer badges, splash). Subtle slow rotation.
   ============================================================ */
.flove-sprout {
  display: inline-block;
  font-style: normal;
  animation: flove-spin 12s linear infinite;
  transform-origin: center;
  color: var(--app-accent);
}
.flove-sprout.flove-sprout--still { animation: none; }
@keyframes flove-spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   FLOVE FOOTER BADGE — small "back to launcher" pill that any
   app can drop in at the bottom of the page.
   ============================================================ */
.flove-footer-badge {
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 50;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-family: var(--flove-font-ui);
  font-size: 12px;
  letter-spacing: .4px;
  color: #1a1a1a;
  text-decoration: none;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(0,0,0,.06);
  border-radius: var(--flove-radius-pill);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
  transition: transform var(--flove-fast), box-shadow var(--flove-fast);
}
.flove-footer-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,0,0,.12);
}
.flove-footer-badge--dark {
  background: rgba(20,24,32,.7);
  color: #e9ecf3;
  border-color: rgba(255,255,255,.08);
}

/* ============================================================
   COMMON UTILITIES — kept tiny on purpose so that each app's
   own bespoke styles still rule. These are opt-in classes.
   ============================================================ */

/* Soft glass card */
.flove-card {
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  border: 1px solid rgba(127,127,127,.18);
  border-radius: var(--flove-radius-lg);
  padding: 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
}

/* Pill shape for tags / chips / nav items */
.flove-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.22);
  background: rgba(255,255,255,.04);
  cursor: pointer;
  transition: transform var(--flove-fast), background var(--flove-fast), border-color var(--flove-fast);
}
.flove-pill:hover { transform: translateY(-1px); border-color: var(--app-accent); }
.flove-pill[aria-pressed="true"], .flove-pill.is-active {
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  border-color: var(--app-accent);
}

/* A primary action button — shared shape, app paints color */
.flove-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid var(--app-accent);
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  font-weight: 600;
  font-family: var(--flove-font-ui);
  cursor: pointer;
  transition: transform var(--flove-fast), box-shadow var(--flove-fast), filter var(--flove-fast);
}
.flove-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px color-mix(in srgb, var(--app-accent) 40%, transparent); }
.flove-btn:active { transform: translateY(0); filter: brightness(.95); }
.flove-btn--ghost {
  background: transparent;
  color: inherit;
  border-color: rgba(127,127,127,.3);
}
.flove-btn--ghost:hover { border-color: var(--app-accent); color: var(--app-accent); }

/* Tiny floating toast feedback (optional, used by some apps) */
.flove-toast {
  position: fixed;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,22,30,.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--flove-radius-pill);
  font-size: 13px;
  font-family: var(--flove-font-ui);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--flove-medium), transform var(--flove-medium);
  z-index: 999;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.flove-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Wiggle on tap, used by playful elements (launcher tiles, brand mark, …) */
@keyframes flove-wiggle {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-3deg); }
  40% { transform: rotate(3deg); }
  60% { transform: rotate(-2deg); }
  80% { transform: rotate(2deg); }
}
.flove-wiggle { animation: flove-wiggle .4s ease-out; }

/* Soft float used in the launcher tiles and avatars */
@keyframes flove-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* Reduced motion: disable all flove animations */
@media (prefers-reduced-motion: reduce) {
  .flove-sprout, .flove-wiggle { animation: none !important; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}

/* Mobile: hide the bottom badge so it doesn't compete with app UI */
@media (max-width: 480px) {
  .flove-footer-badge { display: none; }
  .flove-bar { font-size: 12px; padding: 6px 10px; }
}

/* ============================================================
   FLOVE-IO ACTION BAR — emitted by flove-io.js (F0).
   Sits inside a form, gives the user Copy / Save / Share / Publish
   over the form's current FloveElement payload.
   ============================================================ */
.flove-action-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin-top: 14px;
  border-radius: var(--flove-radius);
  background: rgba(127,127,127,.06);
  border: 1px solid rgba(127,127,127,.18);
  font-family: var(--flove-font-ui);
}
.flove-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid rgba(127,127,127,.3);
  background: rgba(255,255,255,.04);
  color: inherit;
  font-family: inherit;
  font-size: 13px;
  border-radius: var(--flove-radius-pill);
  cursor: pointer;
  transition: transform var(--flove-fast),
              border-color var(--flove-fast),
              background var(--flove-fast);
}
.flove-action-btn:hover {
  transform: translateY(-1px);
  border-color: var(--app-accent);
}
.flove-action-btn:active { transform: translateY(0); }
.flove-action-btn--primary {
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  border-color: var(--app-accent);
  font-weight: 600;
}
.flove-action-btn--primary:hover { filter: brightness(1.05); }
.flove-action-btn[hidden] { display: none; }

/* Toast variant used by flove-io (slightly tighter, top of footer) */
.flove-toast--io { bottom: 80px; }

/* ============================================================
   FLOVE SHELL — feature-driven UI rendered by flove-shell.js.
   Per-textarea voice + add-another · phrase card · 6-button bar ·
   insight result · publish modal · format popover.
   ============================================================ */

/* per-textarea / per-input controls ────────────────────────── */
.flove-field-wrap {
  position: relative;
  display: block;
}
.flove-field-wrap > textarea,
.flove-field-wrap > input {
  width: 100%;
  padding-right: 88px;     /* room for the two field buttons */
}
.flove-field-tools {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 4px;
  z-index: 1;
}
.flove-field-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.25);
  background: rgba(255,255,255,.7);
  color: inherit;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--flove-fast), border-color var(--flove-fast),
              background var(--flove-fast);
  padding: 0;
  line-height: 1;
}
.flove-field-btn:hover {
  border-color: var(--app-accent);
  transform: translateY(-1px);
}
.flove-field-btn--voice.is-recording {
  background: #fb7185;
  color: #fff;
  border-color: #fb7185;
  animation: flove-pulse 1.4s infinite;
}
@keyframes flove-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,.45); }
  50%      { box-shadow: 0 0 0 8px rgba(251,113,133,0); }
}

/* phrase card (phrase + 6-button bar + result panel) ────────── */
.flove-phrase-card {
  margin: 18px 0;
  padding: 16px;
  background: linear-gradient(180deg, var(--app-accent-soft) 0%,
                                      color-mix(in srgb, var(--app-accent-soft) 30%, transparent) 100%);
  border: 1px solid color-mix(in srgb, var(--app-accent) 35%, transparent);
  border-radius: var(--flove-radius-lg);
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
  font-family: var(--flove-font-ui);
}
.flove-phrase {
  margin: 0 0 12px;
  padding: 12px 14px;
  font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
  font-size: 13px;
  line-height: 1.55;
  color: var(--app-ink-on-accent);
  background: rgba(255,255,255,.6);
  border-radius: var(--flove-radius);
  word-break: break-word;
  min-height: 1.55em;
}
.flove-phrase.is-magic {
  background: linear-gradient(110deg, rgba(255,255,255,.55), rgba(255,255,255,.85));
  font-style: italic;
}

/* six-button action bar (overrides the 4-button defaults) ──── */
.flove-action-bar--six {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  padding: 6px;
  background: rgba(255,255,255,.5);
  border-radius: var(--flove-radius);
  border: 1px solid rgba(127,127,127,.18);
  margin-top: 0;
}
.flove-action-bar--six .flove-action-btn {
  justify-content: center;
  padding: 10px 6px;
  font-size: 12px;
  white-space: nowrap;
}
@media (max-width: 540px) {
  .flove-action-bar--six .flove-action-btn span:nth-child(2) { display: none; }
}

/* result panel (insight, publish progress) ─────────────────── */
.flove-result {
  margin-top: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(127,127,127,.22);
  border-radius: var(--flove-radius);
}
.flove-result[hidden] { display: none; }
.flove-result__title {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--app-ink-on-accent);
}
.flove-result__lede {
  margin: 0;
  font-size: 13px;
  color: rgba(0,0,0,.6);
}
.flove-result__body {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.flove-result__list {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.7;
}
.flove-result__error {
  margin: 0;
  color: #b91c1c;
  font-size: 13px;
}
.flove-result__row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* modal (insight config, publish multi-select) ─────────────── */
.flove-modal {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  font-family: var(--flove-font-ui);
}
.flove-modal__backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.flove-modal__panel {
  position: relative;
  width: min(540px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: #fff;
  color: #1a1a1a;
  border-radius: var(--flove-radius-lg);
  padding: 22px;
  box-shadow: 0 30px 60px rgba(0,0,0,.3);
  display: grid;
  gap: 12px;
}
.flove-modal__title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
}
.flove-modal__lede {
  margin: 0;
  color: #52606d;
  font-size: .9rem;
}
.flove-modal label {
  display: grid;
  gap: 4px;
  font-size: .85rem;
  color: #52606d;
}
.flove-modal input,
.flove-modal textarea,
.flove-modal select {
  padding: 10px 12px;
  border: 1px solid rgba(0,0,0,.15);
  border-radius: var(--flove-radius);
  font: inherit;
  background: #fff;
  color: #1a1a1a;
}
.flove-modal__row {
  display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  padding-top: 6px;
  border-top: 1px solid rgba(0,0,0,.06);
}

/* publish multi-select list ────────────────────────────────── */
.flove-publish-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.flove-publish-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: var(--flove-radius);
  background: rgba(0,0,0,.02);
}
.flove-publish-row label {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-direction: row;
  font-size: .92rem;
}
.flove-publish-kind {
  font-size: .72rem;
  letter-spacing: .3px;
  color: #6b7280;
  text-transform: uppercase;
  background: rgba(0,0,0,.04);
  border-radius: var(--flove-radius-pill);
  padding: 2px 8px;
}
.flove-publish-add {
  border: 1px dashed rgba(0,0,0,.15);
  border-radius: var(--flove-radius);
  padding: 10px 12px;
}
.flove-publish-add summary {
  cursor: pointer;
  font-size: .85rem;
  color: #4b5563;
}
.flove-publish-add[open] summary { margin-bottom: 8px; }
.flove-publish-add label { margin-bottom: 6px; }

/* enhanced flove-bar — center categories + right menu ───────── */
.flove-bar--enhanced .flove-mark,
.flove-bar--enhanced .flove-sprout {
  user-select: none;
  transition: transform var(--flove-fast);
}
.flove-bar--enhanced .flove-mark:hover,
.flove-bar--enhanced .flove-sprout:hover { transform: rotate(20deg) scale(1.08); }

.flove-categories {
  flex: 1 1 auto;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 6px;
  scroll-snap-type: x proximity;
  justify-content: center;
}
.flove-categories::-webkit-scrollbar { display: none; }
.flove-cat-chip {
  flex: 0 0 auto;
  scroll-snap-align: center;
  padding: 4px 12px;
  font-size: 12px;
  letter-spacing: .2px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.25);
  background: rgba(255,255,255,.5);
  color: inherit;
  cursor: pointer;
  font-family: inherit;
  transition: transform var(--flove-fast),
              background var(--flove-fast),
              border-color var(--flove-fast);
}
.flove-cat-chip:hover { border-color: var(--app-accent); transform: translateY(-1px); }
.flove-cat-chip.is-active {
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  border-color: var(--app-accent);
}

    <script>
    (function(){
      const el = id => document.getElementById(id);
      const out = el('floveSummaryPhrase');
      const isEs = () => !!(document.getElementById('ui-lang-es') && document.getElementById('ui-lang-es').checked);
      let magic = false;

      function picked(){
        return [...document.querySelectorAll('#combosList .combo input:checked')]
          .map(i => i.closest('.combo').querySelector('.combo-line').textContent.replace(/\s+/g, ' ').trim())
          .filter(Boolean);
      }
      function rows(){
        const rr = picked().map((p, i) => ({ key:'combo:' + i, kind:'combo', title:p, items:[] }));
        document.querySelectorAll('#editorList textarea').forEach((ta, i) => {
          const v = ta.value.trim();
          if (v) rr.push({ key:'text:' + i, kind:'text', title:'Note', items:[v] });
        });
        return rr;
      }
      function plain(){
        const p = picked();
        return p.length ? 'Combos · ' + p.slice(0, 4).join(' · ') + (p.length > 4 ? ' …' : '')
                        : (isEs() ? 'Aún no has elegido ningún combo.' : 'No combos picked yet.');
      }
      function magicPhrase(){
        const p = picked();
        return p.length ? '✦ ' + p.length + (isEs() ? ' combinaciones tejidas: ' : ' woven combinations: ') + p.slice(0, 3).join(' · ') : '✦ ' + plain();
      }
      function portrait(){
        const rr = rows();
        return {
          schema:'flove-portrait/1', app:'comby', version:1,
          generatedAt:new Date().toISOString(),
          lang:isEs() ? 'es' : 'en',
          phrase: plain(),
          rows: rr, words: [],
          completeness:{ layers: rr.length, total: rr.length || 1 },
          consent:{ share:'app', purposes:['self-reflection', 'export'] },
          source:{ url:'https://flove.org/apps/puzzy/comby.html' }
        };
      }
      window.flovePortrait = window.flovePortrait || {};
      window.flovePortrait.get = portrait;
      window.flovePortrait.validate = p => Array.isArray(p && p.rows) ? { ok:true, errors:[] } : { ok:false, errors:['rows'] };
      window.flovePortrait.consult = () => {
  const __p = portrait();
  return { schema: 'flove-consult/1', app: __p.app, version: __p.version, generatedAt: new Date().toISOString(), rows: __p.rows };
};
      window.flovePortrait.selfTest = () => ({ ok:true, errors:[] });

      function paint(){ out.textContent = (magic ? magicPhrase() : plain()) || '—'; }
  function download(){
    const blob = new Blob([JSON.stringify(portrait(), null, 2)], { type:'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'comby-portrait.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function touchDevice(){
    return !!(navigator.canShare && (navigator.maxTouchPoints > 1 || window.matchMedia('(pointer: coarse)').matches));
  }
  const menu = el('floveSummaryShareMenu');
  const shareBtn = el('floveSummaryShare');
  async function share(){
    const p = portrait();
    const text = p.phrase || out.textContent;
    const file = new File([JSON.stringify(p, null, 2)], 'comby-portrait.json', { type:'application/json' });
    if (touchDevice() && navigator.canShare({ files:[file] })){
      try { await navigator.share({ title:'flove · comby', text, files:[file] }); return; } catch(_){}
    }
    menu.hidden = !menu.hidden;
    shareBtn.setAttribute('aria-expanded', String(!menu.hidden));
  }
  el('floveSummaryMagic').addEventListener('click', e => { magic = !magic; e.currentTarget.setAttribute('aria-pressed', String(magic)); paint(); });
  shareBtn.addEventListener('click', share);
  menu.querySelector('[data-action="save"]').addEventListener('click', () => { download(); menu.hidden = true; shareBtn.setAttribute('aria-expanded','false'); });
  document.addEventListener('click', e => {
    if (!menu.hidden && !e.target.closest('#floveSummaryShare') && !e.target.closest('#floveSummaryShareMenu')){
      menu.hidden = true; shareBtn.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !menu.hidden){ menu.hidden = true; shareBtn.setAttribute('aria-expanded','false'); shareBtn.focus(); }
  });
  document.addEventListener('input', paint);
  document.addEventListener('change', paint);
  paint();
  })();
</script>

        const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const seedInput = document.getElementById('seedInput');

    // toggle a token on/off (multiselect card parts) — returns true if now selected

      const i = customValues.indexOf(clean);

      customValues.push(clean);

    // ===== Further lists: Systems (the 11 from souls.html) + Emotions =====

    // Build one card. Emotions get a selectable title + emoji; both kinds get a
    // multiselect verb (each verb in the 3-click loop can be toggled on/off).
    function makeCard(item, kind) {

      let vi = 0;

      const title = document.createElement('small');

      const cycle = document.createElement('button');
      cycle.type = 'button';
      cycle.className = 'lc-cycle';
      cycle.textContent = '+';
      cycle.setAttribute('aria-label', 'Change verb');
      cycle.addEventListener('click', () => {         // loop through the three verbs
        vi = (vi + 1) % item.verbs.length;
        verb.textContent = item.verbs[vi];
        verb.classList.toggle('sel', selectedVerbs.has(verb.textContent));
      });
      verbRow.append(verb, cycle);
      card.appendChild(verbRow);

      return card;
    }

    // Systems always sit fixed in three rows: 5 · 1 · 5 (never repositioned).
    function systemRows() {
      return [SYSTEMS.slice(0,5), SYSTEMS.slice(5,6), SYSTEMS.slice(6,11)].map(group => {
        const row = document.createElement('div');
        row.className = 'frame-row';
        group.forEach(s => row.appendChild(makeCard(s, 'system')));
        return row;
      });
    }

    // ===== render state =====
    let systemsOn = false, emotionsOn = false;
    let csvItems = [];

    function renderLists() {
      listsRender.innerHTML = '';

      if (systemsOn) {
        // systems are fixed in three rows; when emotions are on too they frame them:
        //   5 above · [row1: 5] · [row2: 1 | 1 right] · [row3: 5] · 5 below
        const frame = document.createElement('div');
        frame.className = 'frame';
        const [sRow1, sRow2, sRow3] = systemRows();

        if (emotionsOn) {
          const eTop = document.createElement('div'); eTop.className = 'frame-row';
          EMOTIONS.slice(0, 5).forEach(e => eTop.appendChild(makeCard(e, 'emotion')));
          frame.appendChild(eTop);
        }

        frame.appendChild(sRow1);

        const mid = document.createElement('div'); mid.className = 'frame-mid';
        if (emotionsOn) {                          // central-row emotion sits BEFORE the system
          const eMid = document.createElement('div'); eMid.className = 'frame-aside';
          EMOTIONS.slice(5, 6).forEach(e => eMid.appendChild(makeCard(e, 'emotion')));
          mid.appendChild(eMid);
        }
        mid.appendChild(sRow2);
        frame.appendChild(mid);

        frame.appendChild(sRow3);

        if (emotionsOn) {
          const eBot = document.createElement('div'); eBot.className = 'frame-row';
          EMOTIONS.slice(6, 11).forEach(e => eBot.appendChild(makeCard(e, 'emotion')));
          frame.appendChild(eBot);
        }

        listsRender.appendChild(frame);
      } else if (emotionsOn) {
        const grid = document.createElement('div');
        grid.className = 'emotion-grid';
        EMOTIONS.forEach(e => grid.appendChild(makeCard(e, 'emotion')));
        listsRender.appendChild(grid);
      }

      // uploaded .csv list (if any) — selectable chips that add to combinations
      if (csvItems.length) {
        const wrap = document.createElement('div');
        wrap.className = 'chips';
        csvItems.forEach(w => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip lc-sel';
          chip.textContent = w;
          if (customValues.includes(w)) chip.classList.add('sel');
          chip.addEventListener('click', () => chip.classList.toggle('sel', toggleToken(w)));
          wrap.appendChild(chip);
        });
        listsRender.appendChild(wrap);
      }
    }

    // Senses: expand/collapse its cards in the space below
    btnSenses.addEventListener('click', () => {
      const open = sensesGrid.hidden;
      sensesGrid.hidden = !open;
      btnSenses.setAttribute('aria-pressed', String(open));
    });
    btnSystems.addEventListener('click', () => {
      systemsOn = !systemsOn;
      btnSystems.setAttribute('aria-pressed', String(systemsOn));
      renderLists();
    });
    btnEmotions.addEventListener('click', () => {
      emotionsOn = !emotionsOn;
      btnEmotions.setAttribute('aria-pressed', String(emotionsOn));
      renderLists();
    });

    // plus below the two buttons → invite a .csv list upload
    function showCsvNote(msg, kind = 'info') {
      csvNote.textContent = msg;
      csvNote.className = `action-note ${kind}`;
    }
    csvInput.addEventListener('change', () => {
      const file = csvInput.files && csvInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        csvItems = String(reader.result || '')
          .split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
        if (!csvItems.length) { showCsvNote('No values found in that file.', 'warn'); return; }
        showCsvNote(`Loaded ${csvItems.length} value(s) from “${file.name}”. Tap any to add.`, 'ok');
        renderLists();
      };
      reader.readAsText(file);
      csvInput.value = '';
    });

    // ===== Collect & combine =====
    function collectSelectedPool() {
      const senses = Array.from(document.querySelectorAll('.sense-check:checked')).map(i => i.value);
      return [...senses, ...customValues];
    }

    function combinations(items) {
      const out = [];
      const n = items.length;
      for (let mask = 1; mask < (1 << n); mask++) {
        const combo = [];
        for (let i = 0; i < n; i++) if (mask & (1 << i)) combo.push(items[i]);
        out.push(combo);
      }
      return out;
    }

    function renderComboRow(combo, idx) {
      // No plus sign — render as inline tokens with spacing only
      const id = `combo-${idx}`;
      const row = document.createElement('label');
      row.className = 'combo';
      const tokens = combo.map(v => `<em class="token">${escHtml(v)}</em>`).join(' ');
      row.innerHTML = `<input type="checkbox" id="${id}">
                       <span class="combo-line">${tokens}</span>`;
      return row;
    }

    function buildCombos() {
      const pool = collectSelectedPool();
      combosList.innerHTML = '';
      if (pool.length === 0) { combosWrap.hidden = true; return false; }

      const combos = combinations(pool);
      const frag = document.createDocumentFragment();
      combos
        .sort((a,b)=> a.length-b.length || a.join().localeCompare(b.join()))
        .forEach((combo, idx) => frag.appendChild(renderComboRow(combo, idx)));

      combosList.appendChild(frag);
      combosWrap.hidden = false;
      toggleAll.checked = false; // keep unchecked by default
      return true;
    }

    // "See combos": click to build & expand the combos (the button turns into the
    // section title) and reveal "Select all"; click again to collapse back.
    let combosOpen = false;
    seeCombosBtn.addEventListener('click', () => {
      if (!combosOpen) {
        const built = buildCombos();
        if (!built) return;                 // nothing to combine yet — stay collapsed
        combosOpen = true;
        seeCombosBtn.classList.add('is-open');
        seeCombosBtn.setAttribute('aria-expanded', 'true');
        selectAllWrap.hidden = false;
      } else {
        combosOpen = false;
        seeCombosBtn.classList.remove('is-open');
        seeCombosBtn.setAttribute('aria-expanded', 'false');
        combosWrap.hidden = true;
        selectAllWrap.hidden = true;
        toggleAll.checked = false;
      }
    });

    toggleAll.addEventListener('change', () => {
      const boxes = combosList.querySelectorAll('input[type="checkbox"]');
      boxes.forEach(b => b.checked = toggleAll.checked);
    });

    // ===== Wise it selections =====
    // Wise pickers are now toggle buttons (aria-pressed)
    document.querySelectorAll('.wise').forEach(b => {
      b.addEventListener('click', () => {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      });
    });
    function getWiseSelections() {
      return Array.from(document.querySelectorAll('.wise[aria-pressed="true"]')).map(b => b.dataset.value);
    }

    // ===== Build data snapshot =====
    function collectSelectedCombos() {
      const rows = combosList.querySelectorAll('.combo');
      const picks = [];
      rows.forEach(row => {
        const box = row.querySelector('input[type="checkbox"]');
        if (box && box.checked) {
          const tokens = Array.from(row.querySelectorAll('.token')).map(el => el.textContent.trim());
          if (tokens.length) picks.push(tokens);
        }
      });
      return picks;
    }

    function buildExportObject() {
      return {
        seeds: customValues.slice(),
        senses: Array.from(document.querySelectorAll('.sense-check:checked')).map(i => i.value),
        wise: getWiseSelections(),
        combinations: collectSelectedCombos(),
        timestamp: new Date().toISOString()
      };
    }

    // ===== Save: create editor inputs per combination + wise fields =====
    function renderEditor() {
      const wise = getWiseSelections();
      const combos = collectSelectedCombos();

      editorList.innerHTML = '';
      if (combos.length === 0) {
        editorWrap.hidden = true;
        showNote('Select at least one combination before saving.', 'warn');
        return;
      }

      const frag = document.createDocumentFragment();
      combos.forEach((combo, i) => {
        const block = document.createElement('div');
        block.className = 'editor-block';

        const title = document.createElement('h3');
        title.className = 'editor-title';
        // No plus sign — show tokens spaced
        title.innerHTML = combo.map(v => `<span class="tag-sm">${escHtml(v)}</span>`).join(' ');
        block.appendChild(title);

        // Main free text for the combination
        const line = document.createElement('div');
        line.className = 'editor-row';
        line.innerHTML = `
          <label>Note for this combination</label>
          <input type="text" class="editor-input" placeholder="Write something…">
        `;
        block.appendChild(line);

        // Wise fields (only those selected)
        wise.forEach(w => {
          const row = document.createElement('div');
          row.className = 'editor-row';
          const safe = w.toLowerCase().replace(/\W+/g,'-');
          row.innerHTML = `
            <label>${w}</label>
            <input type="text" class="editor-input" placeholder="${w}…"
              name="wise-${safe}-${i}">
          `;
          block.appendChild(row);
        });

        frag.appendChild(block);
      });

      editorList.appendChild(frag);
      editorWrap.hidden = false;
      editorWrap.scrollIntoView({behavior:'smooth', block:'start'});
      showOverlay('Saved', 'Your fields were generated below, one set per selected combination.');
    }

    saveBtn.addEventListener('click', renderEditor);

    // ===== Download my combos form (a fillable .html form of the selected combos) =====
    function handleDownloadForm() {
      const combos = collectSelectedCombos();
      const wise = getWiseSelections();
      if (combos.length === 0) { showNote('Select at least one combination first.', 'warn'); return; }
      const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const blocks = combos.map((combo, i) => {
        const tags = combo.map(v => `<span class="tag">${escHtml(v)}</span>`).join(' ');
        const wiseFields = wise.map(w =>
          `<label>${escHtml(w)}<input type="text" name="wise-${i}-${escHtml(w)}"></label>`).join('');
        return `<fieldset><legend>${tags}</legend>` +
          `<label>Note<textarea name="note-${i}" rows="3"></textarea></label>${wiseFields}</fieldset>`;
      }).join('\n');
      const html =
        `<!doctype html><html lang="en"><head><meta charset="utf-8">` +
        `<meta name="viewport" content="width=device-width,initial-scale=1"><title>My combos form</title>` +
        `<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#13131a}` +
        `h1{font-size:1.4rem}fieldset{border:1px solid #ccc;border-radius:10px;margin:1rem 0;padding:.8rem 1rem}` +
        `legend{font-weight:800}.tag{display:inline-block;background:#eef;border-radius:6px;padding:.1rem .45rem;font-weight:700;margin:.1rem}` +
        `label{display:block;margin:.6rem 0;font-weight:600}input,textarea{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:8px;font:inherit;margin-top:.2rem}` +
        `</style></head><body><h1>My combos form</h1><form>${blocks}` +
        `<p><button type="button" onclick="window.print()">Print / Save as PDF</button></p></form></body></html>`;
      downloadBlob(html, 'text/html;charset=utf-8', `flove-combos-form-${new Date().toISOString().replace(/[:.]/g,'-')}.html`);
      showNote('Your combos form was downloaded.', 'ok');
    }
    downloadFormBtn.addEventListener('click', handleDownloadForm);

    // ===== Share =====
    async function handleShare() {
      const data = buildExportObject();
      const summary =
        `FLOVE — Share\n\nSeeds: ${data.seeds.join(', ') || '—'}\n` +
        `Senses: ${data.senses.join(', ') || '—'}\n` +
        `Wise: ${data.wise.join(', ') || '—'}\n` +
        `Combos: ${data.combinations.map(c=>c.join(' ')).join(' | ') || '—'}\n` +
        `When: ${data.timestamp}`;

      try {
        if (navigator.share) {
          await navigator.share({ title: 'FLOVE selections', text: summary });
          showNote('Shared via system share sheet.', 'ok');
        } else {
          const mailto =
            `mailto:?subject=${encodeURIComponent('FUZZY selections')}` +
            `&body=${encodeURIComponent(summary)}`;
          window.location.href = mailto;
          showNote('Opening your email app to share…', 'ok');
        }
      } catch (e) {
        showNote('Share canceled or failed.', 'warn');
      }
    }
    shareBtn.addEventListener('click', handleShare);

    // ===== Publish =====
    async function handlePublish() {
      const data = buildExportObject();
      const json = JSON.stringify(data, null, 2);
      downloadBlob(json, 'application/json;charset=utf-8', `flove-data-${new Date().toISOString().replace(/[:.]/g,'-')}.json`);

      // Copy to clipboard
      try {
        await navigator.clipboard.writeText(json);
        showOverlay('Published', 'JSON downloaded and also copied to your clipboard.');
      } catch {
        showOverlay('Published', 'JSON downloaded. (Clipboard copy not permitted by browser.)');
      }
    }
    publishBtn.addEventListener('click', handlePublish);

    // ===== Helpers: notes & overlay =====
    function showNote(msg, kind='info'){
      actionNote.textContent = msg;
      actionNote.className = `action-note ${kind}`;
      setTimeout(() => {
        actionNote.textContent = '';
        actionNote.className = 'action-note';
      }, 4000);
    }

    function showOverlay(title, msg){
      overlayTitle.textContent = title;
      overlayMsg.textContent = msg;
      overlay.classList.add('show');
    }
    overlayClose.addEventListener('click', ()=> overlay.classList.remove('show'));
    overlay.addEventListener('click', (e)=> {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  </script>

<script data-flove-conformance>
/* Runtime conformance — dev harness: development/tools/conformance.html
   Supersedes selfTest(); never writes user data (merge gets an empty envelope).
   Parity vs floveFields() is advisory: rows are semantic layers, not a field
   dump, so an app's field ids may not appear verbatim. */
(function(){
  var api = window.flovePortrait;
  if (!api || typeof api.get !== 'function' || typeof api.conformance === 'function') return;

  function flatFields(list, out){
    out = out || [];
    (list || []).forEach(function(f){
      if (!f || !f.id) return;
      out.push(f.id);              // leaf ids are already dotted (bonds.friendship)
      if (f.fields) flatFields(f.fields, out);
    });
    return out;
  }
  function norm(s){
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[\s_:.\/-]+/g, '.').replace(/^\.+|\.+$/g, '');
  }
  function slug(s){
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  api.conformance = function(opts){
    opts = opts || {};
    var checks = [];
    function check(name, ok, level, detail){
      checks.push({ name: name, ok: !!ok, level: level || 'critical',
                    detail: detail == null ? '' : String(detail) });
    }

    var p = null, getError = '';
    try { p = api.get(); } catch (e) { getError = e && e.message || String(e); }
    check('get() returns an envelope', p && typeof p === 'object', 'critical', getError);
    if (!p || typeof p !== 'object'){
      return { ok: false, app: null, checks: checks, errors: ['get()'], coverage: null };
    }

    var app = slug(p.app);
    check('schema is flove-portrait/1', p.schema === 'flove-portrait/1', 'critical', p.schema);
    check('app slug is present', !!app, 'critical', p.app);

    var filename = app + '-portrait.json';
    check('filename is <app>-portrait.json',
          /^[a-z0-9][a-z0-9-]*-portrait\.json$/.test(filename), 'advisory', filename);
    var json = '';
    try { json = JSON.stringify(p); } catch (e) { json = ''; }
    var mime = '';
    try { mime = new Blob([json], { type: 'application/json;charset=utf-8' }).type; } catch (e) {}
    check('blob MIME is application/json;charset=utf-8',
          mime === 'application/json;charset=utf-8', 'advisory', mime);
    check('envelope survives JSON.stringify', json.length > 2, 'critical', json.length + ' chars');

    var v = null;
    try { v = api.validate ? api.validate(p) : null; }
    catch (e) { v = { ok: false, errors: [e.message] }; }
    check('validate() accepts the envelope', v && v.ok, 'critical',
          v && (v.errors || []).join('; '));

    var rows = Array.isArray(p.rows) ? p.rows : null;
    check('rows[] is an array', !!rows, 'critical', rows ? rows.length + ' rows' : typeof p.rows);
    if (!rows){
      return { ok: false, app: app, checks: checks, errors: ['rows[]'], coverage: null };
    }

    var keys = [], items = [], blank = false, untitled = false;
    rows.forEach(function(r){
      r = r || {};
      var k = norm(r.key);
      if (k) keys.push(k);
      var list = Array.isArray(r.items) ? r.items : [];
      if (list.length && !String(r.title || '').trim()) untitled = true;
      list.forEach(function(it){
        if (it === null || it === undefined) { blank = true; return; }
        if (typeof it === 'string' && !it.trim()) { blank = true; return; }
        items.push(typeof it === 'object' ? JSON.stringify(it) : String(it));
      });
    });
    check('row keys are unique', new Set(keys).size === keys.length, 'critical',
          keys.length + ' keys');
    check('items are never blank', !blank, 'critical');
    check('filled rows have a title', !untitled, 'critical');

    var fieldsSource = window.floveFields, fields = [];
    var fieldsKind = typeof fieldsSource;
    try {
      if (fieldsKind === 'function') fields = flatFields(fieldsSource() || []);
      else if (Array.isArray(fieldsSource)) fields = flatFields(fieldsSource);
    } catch (e) {}
    check('floveFields() is callable', fieldsKind === 'function' || fieldsKind === 'undefined',
          'advisory', fieldsKind === 'function' || fieldsKind === 'undefined' ? '' : fieldsKind);
    var haystack = norm(keys.join(' ') + ' ' + items.join(' ') + ' ' +
                        (p.phrase || '') + ' ' + json);
    var mapped = fields.filter(function(id){ return haystack.indexOf(norm(id)) !== -1; });
    check('field ids discoverable in the portrait (parity is advisory)', true, 'advisory',
          mapped.length + '/' + fields.length + ' fields · ' +
          Math.round(fields.length ? mapped.length / fields.length * 100 : 100) + '%');

    var c = null;
    try { c = api.consult ? api.consult(opts.consult || {}) : null; } catch (e) { c = null; }
    var consulted = c && Array.isArray(c.rows)
      ? c.rows.map(function(r){ return norm(r && r.key); }) : [];
    check('consult() returns flove-consult/1',
          c && c.schema === 'flove-consult/1' && Array.isArray(c.rows), 'critical',
          c && c.schema);
    check('consult() rows are a subset of get() rows',
          consulted.every(function(k){ return keys.indexOf(k) !== -1; }), 'critical',
          consulted.length + ' consulted');

    var merged = null, mergeError = '';
    try {
      merged = api.merge
        ? api.merge({
            schema: 'flove-portrait/1', app: p.app, version: 1,
            generatedAt: p.generatedAt, lang: p.lang,
            rows: [{ key: '__conformance__', kind: 'probe', title: '', items: [] }],
            consent: p.consent, source: p.source
          })
        : null;
    } catch (e) { mergeError = e && e.message || String(e); }
    check('merge() accepts a probe row without applying it',
          merged && merged.ok === true && (merged.applied || 0) === 0, 'advisory',
          mergeError || (merged ? 'applied ' + (merged.applied || 0) : 'no merge()'));

    var errors = checks.filter(function(x){ return !x.ok && x.level === 'critical'; })
                       .map(function(x){ return x.name; });
    var advisories = checks.filter(function(x){ return !x.ok && x.level === 'advisory'; })
                           .map(function(x){ return x.name; });
    return { ok: errors.length === 0, app: app, checks: checks,
             errors: errors, advisories: advisories,
             coverage: fields.length ? { mapped: mapped.length, total: fields.length } : null };
  };
})();
</script>
<!-- flove-conformance:end -->
<script data-flove-appy-standard>
(function(){
  if (window.floveAppyStandard) return;
  window.floveAppyStandard = true;
  var KEY = 'flove:appy:plays';
  function bx(en, es){ return '<span class="en" lang="en">'+en+'</span><span class="es" lang="es">'+es+'</span>'; }
  function storeGet(){ try { return window.floveStore ? window.floveStore.getRaw(KEY) : localStorage.getItem(KEY); } catch (_) { return null; } }
  function storeSet(v){ try { if (window.floveStore) { window.floveStore.set(KEY, v); return true; } localStorage.setItem(KEY, v); return true; } catch (_) { return false; } }
  function appyUrl(){ return location.href.replace(/\/(apps|projects)\/.*$/, '/apps/appy/index.html#profile'); }
  function toast(html){
    var el = document.getElementById('floveAppyToast');
    if (!el){
      el = document.createElement('div'); el.id = 'floveAppyToast';
      el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,520px);background:#161623;color:#ecebf5;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;font:13px/1.45 system-ui,sans-serif;box-shadow:0 18px 40px rgba(0,0,0,.45)';
      document.body.appendChild(el);
    }
    el.innerHTML = html;
    clearTimeout(el._t); el._t = setTimeout(function(){ el.remove(); }, 6000);
  }
  function message(html){
    var h = document.querySelector('[data-flove-hint],#hintMessage,.hint-area,.flove-hint,[role="status"]');
    if (h) h.innerHTML = html; else toast(html);
  }
  function openAppy(rec){
    var w = null;
    try { w = window.open(appyUrl(), '_blank'); } catch (_) {}
    if (!w) return false;
    var fileMode = location.protocol === 'file:' || location.origin === 'null';
    var target = fileMode ? '*' : location.origin;
    var same = function (o) { return o === location.origin || (fileMode && (o === 'null' || o === 'file://')); };
    var on = function (e) {
      if (e.source !== w || !same(e.origin)) return;
      if (e.data && e.data.type === 'flove-appy-ready') {
        w.postMessage({ type: 'flove-appy-play', record: rec }, target);
        window.removeEventListener('message', on);
      }
    };
    window.addEventListener('message', on);
    setTimeout(function(){ window.removeEventListener('message', on); }, 20000);
    return true;
  }
  function meta(p){
    var raw = (p && (p.app || p.appId)) || (document.title || '').split(/[·|—]/)[0].trim() || 'App';
    var name = String(raw).charAt(0).toUpperCase() + String(raw).slice(1);
    var id = String((p && p.appId) || raw).toLowerCase().replace(/[^a-z0-9]+/g, '') || 'app';
    var pth = location.pathname;
    var cat = /\/metas\//.test(pth) ? 'inside'
      : /\/bio\//.test(pth) ? 'inside'
      : /\/economy\//.test(pth) ? 'economy'
      : /\/trusty\//.test(pth) ? 'mating'
      : /\/puzzy\//.test(pth) ? 'ling'
      : /\/psychosocial\//.test(pth) ? 'social'
      : 'social';
    return { name: name, id: id, cat: cat };
  }
  function save(){
    if (!window.flovePortrait || typeof window.flovePortrait.get !== 'function'){
      message('✈ ' + bx('This app has no portrait to share yet.', 'Esta app aún no tiene un retrato para compartir.'));
      return;
    }
    var p;
    try { p = window.flovePortrait.get(); }
    catch (_) { message('✈ ' + bx('Could not build the portrait.', 'No se pudo construir el retrato.')); return; }
    var v = window.flovePortrait.validate ? window.flovePortrait.validate(p) : { ok: true };
    if (!v || v.ok === false){
      message('✈ ' + bx('Could not save to Appy — export to JSON instead.', 'No se pudo guardar en Appy — exporta el JSON.'));
      return;
    }
    var m = meta(p);
    var raw = storeGet(), list = [];
    try { list = raw ? JSON.parse(raw) : []; } catch (_) { list = []; }
    if (!Array.isArray(list)) list = [];
    var entry = {
      app: m.name, appId: m.id, category: m.cat,
      schema: p.schema || 'flove-portrait/1', portrait: p,
      url: (p.source && p.source.url) || location.href,
      via: 'share', date: new Date().toISOString(),
      id: 'a' + Date.now().toString(36), file: m.id + '-portrait.json'
    };
    var at = -1;
    for (var i = 0; i < list.length; i++){
      if (list[i] && list[i].app === entry.app && list[i].via !== 'upload'){ at = i; break; }
    }
    if (at >= 0){ entry.id = (list[at] && list[at].id) || entry.id; list[at] = entry; }
    else list.push(entry);
    if (!storeSet(JSON.stringify(list))){
      message('✈ ' + bx('Local storage is blocked — use Save JSON and upload it in Appy.', 'El almacenamiento local está bloqueado — usa Guardar JSON y súbelo en Appy.'));
      return;
    }
    message('✓ ' + bx('Saved in your Appy profile · <a href="' + appyUrl() + '" data-appy-link>See profile</a>',
                     'Guardado en tu perfil de Appy · <a href="' + appyUrl() + '" data-appy-link>Ver perfil</a>'));
    Array.prototype.forEach.call(document.querySelectorAll('[data-appy-link]'), function (a) {
      a.addEventListener('click', function (e) { if (openAppy(entry)) e.preventDefault(); });
    });
    if (location.protocol === 'file:' || location.origin === 'null') openAppy(entry);
  }
  window.floveShareToAppy = save;
  function mk(ref){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = ref.className;
    b.setAttribute('data-appy-standard', '1');
    b.setAttribute('aria-label', 'Send to Appy');
    b.innerHTML = '✈ <span class="en" lang="en">Appy</span><span class="es" lang="es">Appy</span>';
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); save(); });
    return b;
  }
  function add(){
    if (document.querySelector('[data-appy-standard]')) return;
    var g = document.querySelector('[data-group="share"]');
    if (g){
      var par = g.parentElement;
      var b = mk(g);
      var save = par.querySelector('[data-group="save"],[data-action="save"]');
      if (save && save.nextSibling) par.insertBefore(b, save.nextSibling);
      else par.insertBefore(b, g);
      if (window.applyLang) applyLang();
      return;
    }
    var a = document.querySelector('[data-act="save"]');
    if (a){
      a.parentElement.insertBefore(mk(a), a.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var f = document.querySelector('.flove-share__item[data-action="save"]') || document.querySelector('.flove-share__item');
    if (f){
      f.parentElement.insertBefore(mk(f), f.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var fs = document.querySelector('.flove-summary__item[data-action="save"]') || document.querySelector('.flove-summary__item');
    if (fs){
      fs.parentElement.insertBefore(mk(fs), fs.nextSibling);
      if (window.applyLang) applyLang();
      return;
    }
    var b2 = mk({ className: '' });
    b2.textContent = '✈ Appy';
    b2.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9998;border:1px solid rgba(34,211,238,.55);background:rgba(8,12,20,.88);color:#22d3ee;border-radius:999px;padding:9px 14px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)';
    b2.addEventListener('click', function (e) { e.preventDefault(); save(); });
    document.body.appendChild(b2);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', add);
  else add();
  setTimeout(add, 1200);
})();
</script>

<script data-flove-fields-flat>
/* Technical helper: flat routing field paths for cross-app combination.
   Read-only; no UI, storage or network side effect. */
(function(){
  if (window.floveFieldsFlat) return;
  function walk(list, parent, out){
    (list || []).forEach(function(f){
      if (!f || !f.id) return;
      var path = String(f.id);
      if (parent && path.indexOf(parent + '.') !== 0) path = parent + '.' + path;
      out.push({ path: path, id: f.id, label: f.label || '', type: f.type || '', parent: parent || null });
      if (f.fields) walk(f.fields, path, out);
      if (f.item && f.item.fields) walk(f.item.fields, path, out);
    });
  }
  window.floveFieldsFlat = function(){
    var out = [];
    walk(typeof window.floveFields === 'function' ? window.floveFields() : [], '', out);
    return out;
  };
  if (window.flovePort && !window.flovePort.fields) window.flovePort.fields = window.floveFieldsFlat;
})();
</script>
