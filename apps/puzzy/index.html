<script>
/* flove-store/1 + flove-net fallback — the common local-storage/net layer.
   Apps inline this same block so they stay self-contained; this file is the
   canonical reference and is shipped in the offline package. */
(function () {
  if (!window.floveStore) {
    var mem = new Map();
    function rawGet(k) {
      try { return localStorage.getItem(k); }
      catch (_) { return mem.has(k) ? mem.get(k) : null; }
    }
    function rawSet(k, v) {
      try { localStorage.setItem(k, v); return true; }
      catch (e) {
        mem.set(k, v);
        try { window.dispatchEvent(new CustomEvent('flove:storage-error', { detail: { key: k, error: e } })); } catch (_) {}
        return false;
      }
    }
    window.floveStore = {
      getRaw: function (k, fallback) { var v = rawGet(k); return v == null ? (fallback === undefined ? null : fallback) : v; },
      getJSON: function (k, fallback) {
        try { var v = rawGet(k); return v == null ? (fallback === undefined ? null : fallback) : JSON.parse(v); }
        catch (_) { return fallback === undefined ? null : fallback; }
      },
      set: function (k, v) { return rawSet(k, typeof v === 'string' ? v : JSON.stringify(v)); },
      setJSON: function (k, v) { return rawSet(k, JSON.stringify(v)); },
      remove: function (k) { try { localStorage.removeItem(k); } catch (_) {} mem.delete(k); },
      available: function () {
        try { var k = '__flove_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
        catch (_) { return false; }
      },
      memoryOnly: function () { return !this.available(); }
    };
  }
  if (!window.floveFields) window.floveFields = function () {
    try { var el = document.getElementById('flove-fields'); return el ? (JSON.parse(el.textContent).fields || []) : []; }
    catch (_) { return []; }
  };
  if (!window.flovePort) {
    window.flovePort = {
      schema: 'flove-port/1',
      export: function () { return { schema: 'flove-portrait/1', app: null, version: 1, generatedAt: new Date().toISOString(), rows: [] }; },
      consult: function () { return { schema: 'flove-consult/1', app: null, version: 1, generatedAt: new Date().toISOString(), rows: [] }; },
      import: function () { return { ok: false, applied: 0, errors: ['no app adapter'] }; }
    };
  }
  if (!window.floveNet) window.floveNet = window.flovePort; // deprecated alias
  if (!window.flovePortrait) window.flovePortrait = window.flovePort;
  if (!window.floveSummary) window.floveSummary = function () { return window.flovePort.export(); };
})();

/* ============================================================
   flove.css · shared common CSS for flove app launchers
   ============================================================
   Sections:
     1. Theme (dark/light toggle)
     2. Sound toggle
     3. Wizy suggestion chips
     4. Reduced motion
   ============================================================ */

/* ── 1. Theme (dark/light) ── */

:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --mut: #666666;
  --line: #e0e0e0;
  --accent: #6b46c1;
  --accent-hover: #553c9a;
  --surface: #f8f9fa;
  --surface-hover: #e9ecef;
  --shadow: rgba(0,0,0,0.1);
  --transition: 0.3s ease;
}

:root.dark {
  --bg: #0b0b0f;
  --ink: #e9eaf2;
  --mut: #a3a7b4;
  --line: #1e2133;
  --accent: #9d7fff;
  --accent-hover: #b794ff;
  --surface: #11131a;
  --surface-hover: #1a1d2e;
  --shadow: rgba(0,0,0,0.3);
}

body {
  background: var(--bg);
  color: var(--ink);
  transition: background var(--transition), color var(--transition);
}

.theme-toggle {
  border: none;
  background: transparent;
  color: var(--ink);
  font-size: 1.2rem;
  padding: 0.5rem;
  border-radius: 50%;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
}

.theme-toggle:hover {
  background: var(--surface-hover);
  transform: scale(1.1);
}

.theme-toggle:active {
  transform: scale(0.95);
}

.theme-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── 2. Sound toggle ── */
/* Checkbox-driven: add <input type="checkbox" id="opt-sound" class="ctl">
   somewhere in the page (hidden). Label it with:
   <label class="sound-toggle" for="opt-sound">…</label>
   CSS uses :has() to style the track. JS reads #opt-sound.checked. */

.sound-toggle {
  border: none;
  background: transparent;
  color: var(--ink);
  font-size: 1.1rem;
  padding: 0.4rem;
  border-radius: 50%;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  user-select: none;
  -webkit-user-select: none;
}

.sound-toggle:hover {
  background: var(--surface-hover);
  transform: scale(1.1);
}

.sound-toggle:active {
  transform: scale(0.95);
}

.sound-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Icon swap: show 🔇 when off, 🔊 when on */
.sound-toggle::before { content: '🔇'; }
body:has(#opt-sound:checked) .sound-toggle::before { content: '🔊'; }

/* ── 3. Wizy suggestion chips ── */
/* Rendered by wizy.js — wizy.render(container, summary) */

.wizy-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 8px 0;
}

.wizy-chip {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  padding: 7px 14px;
  font: 500 0.82rem/1.3 var(--font-ui, system-ui, sans-serif);
  cursor: pointer;
  transition: all var(--transition);
  text-align: center;
  max-width: 260px;
}

.wizy-chip:hover {
  border-color: var(--accent);
  color: var(--accent-hover);
  background: var(--surface-hover);
  transform: translateY(-1px);
}

.wizy-chip--on,
.wizy-chip:active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  transform: scale(0.97);
}

.wizy-chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── 4. Reduced motion ── */

@media (prefers-reduced-motion: reduce) {
  body, .theme-toggle, .sound-toggle, .wizy-chip {
    transition: none !important;
  }
  .theme-toggle:hover, .sound-toggle:hover {
    transform: none;
  }
  .wizy-chip:hover {
    transform: none;
  }
}

</style>
  <style data-flove-inlined="flove.css">
/* inlined from apps/flove.css */
/* ============================================================
   🌱 flove.css · shared identity layer for all FLOVE demos
   --------------------------------------------------------------
   Design intent
   - One cohesive frame around 13 very different apps.
   - Each app keeps its own palette by overriding `--app-*` tokens
     in its local `:root`. This file only paints the common skin.
   - Two visual primitives identify the family everywhere:
       1. The 🌱 sprout mark (brand)
       2. The flove-bar at the very top (back to launcher + app name)
   - A common motion vocabulary (gentle lift, soft fade, wiggle).
   ============================================================ */

:root {
  /* The sprout — flove brand mark. Used as logo glyph everywhere. */
  --flove-mark: "🌱";

  /* Per-app overridable accent. Apps redeclare these. */
  --app-accent:        #6ee7b7;
  --app-accent-soft:   #a7f3d0;
  --app-ink-on-accent: #042418;

  /* Family geometry & motion (constant across apps) */
  --flove-radius-sm: 12px;
  --flove-radius:    20px;
  --flove-radius-lg: 28px;
  --flove-radius-pill: 999px;
  --flove-ease:    cubic-bezier(.2,.8,.2,1);
  --flove-fast:    .15s var(--flove-ease);
  --flove-medium:  .25s var(--flove-ease);
  --flove-slow:    .4s  var(--flove-ease);

  /* Family typography. Apps may override font-family but should keep these scales. */
  --flove-font-ui: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --flove-font-display: 'Georgia', 'Times New Roman', serif;
}

/* ============================================================
   THE FLOVE BAR — a thin sticky strip at the very top of every
   app. Holds the back-to-launcher link, the sprout brand,
   and the app name. Lives ABOVE every app's own header.
   ============================================================ */
.flove-bar {
  position: sticky;
  top: 0;
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  font-family: var(--flove-font-ui);
  font-size: 13px;
  letter-spacing: .3px;
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid rgba(0,0,0,.06);
  color: #1a1a1a;
}

/* Auto dark variant when app body is dark */
@media (prefers-color-scheme: dark) {
  .flove-bar.flove-bar--auto {
    background: rgba(10,12,18,.55);
    border-bottom-color: rgba(255,255,255,.08);
    color: #e9ecf3;
  }
}
.flove-bar--dark {
  background: rgba(10,12,18,.6);
  border-bottom-color: rgba(255,255,255,.08);
  color: #e9ecf3;
}

.flove-bar a.flove-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: inherit;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--flove-radius-pill);
  transition: background var(--flove-fast), transform var(--flove-fast);
}
.flove-bar a.flove-home:hover {
  background: var(--app-accent-soft);
  color: var(--app-ink-on-accent);
  transform: translateX(-2px);
}
.flove-bar .flove-mark {
  font-size: 16px;
  color: var(--app-accent);
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--app-accent) 35%, transparent));
}
.flove-bar .flove-app-name {
  font-weight: 500;
  opacity: .85;
}
.flove-bar .flove-spacer { flex: 1; }
.flove-bar .flove-tag {
  font-size: 11px;
  letter-spacing: .8px;
  text-transform: uppercase;
  opacity: .55;
}

/* ============================================================
   SPROUT ANIMATION — used wherever a `.flove-sprout` lives
   (launcher hero, footer badges, splash). Subtle slow rotation.
   ============================================================ */
.flove-sprout {
  display: inline-block;
  font-style: normal;
  animation: flove-spin 12s linear infinite;
  transform-origin: center;
  color: var(--app-accent);
}
.flove-sprout.flove-sprout--still { animation: none; }
@keyframes flove-spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   FLOVE FOOTER BADGE — small "back to launcher" pill that any
   app can drop in at the bottom of the page.
   ============================================================ */
.flove-footer-badge {
  position: fixed;
  bottom: 12px;
  right: 12px;
  z-index: 50;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-family: var(--flove-font-ui);
  font-size: 12px;
  letter-spacing: .4px;
  color: #1a1a1a;
  text-decoration: none;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(0,0,0,.06);
  border-radius: var(--flove-radius-pill);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
  transition: transform var(--flove-fast), box-shadow var(--flove-fast);
}
.flove-footer-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,0,0,.12);
}
.flove-footer-badge--dark {
  background: rgba(20,24,32,.7);
  color: #e9ecf3;
  border-color: rgba(255,255,255,.08);
}

/* ============================================================
   COMMON UTILITIES — kept tiny on purpose so that each app's
   own bespoke styles still rule. These are opt-in classes.
   ============================================================ */

/* Soft glass card */
.flove-card {
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  border: 1px solid rgba(127,127,127,.18);
  border-radius: var(--flove-radius-lg);
  padding: 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
}

/* Pill shape for tags / chips / nav items */
.flove-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.22);
  background: rgba(255,255,255,.04);
  cursor: pointer;
  transition: transform var(--flove-fast), background var(--flove-fast), border-color var(--flove-fast);
}
.flove-pill:hover { transform: translateY(-1px); border-color: var(--app-accent); }
.flove-pill[aria-pressed="true"], .flove-pill.is-active {
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  border-color: var(--app-accent);
}

/* A primary action button — shared shape, app paints color */
.flove-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid var(--app-accent);
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  font-weight: 600;
  font-family: var(--flove-font-ui);
  cursor: pointer;
  transition: transform var(--flove-fast), box-shadow var(--flove-fast), filter var(--flove-fast);
}
.flove-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px color-mix(in srgb, var(--app-accent) 40%, transparent); }
.flove-btn:active { transform: translateY(0); filter: brightness(.95); }
.flove-btn--ghost {
  background: transparent;
  color: inherit;
  border-color: rgba(127,127,127,.3);
}
.flove-btn--ghost:hover { border-color: var(--app-accent); color: var(--app-accent); }

/* Tiny floating toast feedback (optional, used by some apps) */
.flove-toast {
  position: fixed;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,22,30,.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--flove-radius-pill);
  font-size: 13px;
  font-family: var(--flove-font-ui);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--flove-medium), transform var(--flove-medium);
  z-index: 999;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.flove-toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Wiggle on tap, used by playful elements (launcher tiles, brand mark, …) */
@keyframes flove-wiggle {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-3deg); }
  40% { transform: rotate(3deg); }
  60% { transform: rotate(-2deg); }
  80% { transform: rotate(2deg); }
}
.flove-wiggle { animation: flove-wiggle .4s ease-out; }

/* Soft float used in the launcher tiles and avatars */
@keyframes flove-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* Reduced motion: disable all flove animations */
@media (prefers-reduced-motion: reduce) {
  .flove-sprout, .flove-wiggle { animation: none !important; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}

/* Mobile: hide the bottom badge so it doesn't compete with app UI */
@media (max-width: 480px) {
  .flove-footer-badge { display: none; }
  .flove-bar { font-size: 12px; padding: 6px 10px; }
}

/* ============================================================
   FLOVE-IO ACTION BAR — emitted by flove-io.js (F0).
   Sits inside a form, gives the user Copy / Save / Share / Publish
   over the form's current FloveElement payload.
   ============================================================ */
.flove-action-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin-top: 14px;
  border-radius: var(--flove-radius);
  background: rgba(127,127,127,.06);
  border: 1px solid rgba(127,127,127,.18);
  font-family: var(--flove-font-ui);
}
.flove-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid rgba(127,127,127,.3);
  background: rgba(255,255,255,.04);
  color: inherit;
  font-family: inherit;
  font-size: 13px;
  border-radius: var(--flove-radius-pill);
  cursor: pointer;
  transition: transform var(--flove-fast),
              border-color var(--flove-fast),
              background var(--flove-fast);
}
.flove-action-btn:hover {
  transform: translateY(-1px);
  border-color: var(--app-accent);
}
.flove-action-btn:active { transform: translateY(0); }
.flove-action-btn--primary {
  background: var(--app-accent);
  color: var(--app-ink-on-accent);
  border-color: var(--app-accent);
  font-weight: 600;
}
.flove-action-btn--primary:hover { filter: brightness(1.05); }
.flove-action-btn[hidden] { display: none; }

/* Toast variant used by flove-io (slightly tighter, top of footer) */
.flove-toast--io { bottom: 80px; }

/* ============================================================
   FLOVE SHELL — feature-driven UI rendered by flove-shell.js.
   Per-textarea voice + add-another · phrase card · 6-button bar ·
   insight result · publish modal · format popover.
   ============================================================ */

/* per-textarea / per-input controls ────────────────────────── */
.flove-field-wrap {
  position: relative;
  display: block;
}
.flove-field-wrap > textarea,
.flove-field-wrap > input {
  width: 100%;
  padding-right: 88px;     /* room for the two field buttons */
}
.flove-field-tools {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 4px;
  z-index: 1;
}
.flove-field-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.25);
  background: rgba(255,255,255,.7);
  color: inherit;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--flove-fast), border-color var(--flove-fast),
              background var(--flove-fast);
  padding: 0;
  line-height: 1;
}
.flove-field-btn:hover {
  border-color: var(--app-accent);
  transform: translateY(-1px);
}
.flove-field-btn--voice.is-recording {
  background: #fb7185;
  color: #fff;
  border-color: #fb7185;
  animation: flove-pulse 1.4s infinite;
}
@keyframes flove-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251,113,133,.45); }
  50%      { box-shadow: 0 0 0 8px rgba(251,113,133,0); }
}

/* phrase card (phrase + 6-button bar + result panel) ────────── */
.flove-phrase-card {
  margin: 18px 0;
  padding: 16px;
  background: linear-gradient(180deg, var(--app-accent-soft) 0%,
                                      color-mix(in srgb, var(--app-accent-soft) 30%, transparent) 100%);
  border: 1px solid color-mix(in srgb, var(--app-accent) 35%, transparent);
  border-radius: var(--flove-radius-lg);
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
  font-family: var(--flove-font-ui);
}
.flove-phrase {
  margin: 0 0 12px;
  padding: 12px 14px;
  font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
  font-size: 13px;
  line-height: 1.55;
  color: var(--app-ink-on-accent);
  background: rgba(255,255,255,.6);
  border-radius: var(--flove-radius);
  word-break: break-word;
  min-height: 1.55em;
}
.flove-phrase.is-magic {
  background: linear-gradient(110deg, rgba(255,255,255,.55), rgba(255,255,255,.85));
  font-style: italic;
}

/* six-button action bar (overrides the 4-button defaults) ──── */
.flove-action-bar--six {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
  padding: 6px;
  background: rgba(255,255,255,.5);
  border-radius: var(--flove-radius);
  border: 1px solid rgba(127,127,127,.18);
  margin-top: 0;
}
.flove-action-bar--six .flove-action-btn {
  justify-content: center;
  padding: 10px 6px;
  font-size: 12px;
  white-space: nowrap;
}
@media (max-width: 540px) {
  .flove-action-bar--six .flove-action-btn span:nth-child(2) { display: none; }
}

/* result panel (insight, publish progress) ─────────────────── */
.flove-result {
  margin-top: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(127,127,127,.22);
  border-radius: var(--flove-radius);
}
.flove-result[hidden] { display: none; }
.flove-result__title {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--app-ink-on-accent);
}
.flove-result__lede {
  margin: 0;
  font-size: 13px;
  color: rgba(0,0,0,.6);
}
.flove-result__body {
  margin: 0 0 10px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.flove-result__list {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  line-height: 1.7;
}
.flove-result__error {
  margin: 0;
  color: #b91c1c;
  font-size: 13px;
}
.flove-result__row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* modal (insight config, publish multi-select) ─────────────── */
.flove-modal {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  font-family: var(--flove-font-ui);
}
.flove-modal__backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.flove-modal__panel {
  position: relative;
  width: min(540px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: #fff;
  color: #1a1a1a;
  border-radius: var(--flove-radius-lg);
  padding: 22px;
  box-shadow: 0 30px 60px rgba(0,0,0,.3);

  gap: 12px;
}
.flove-modal__title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
}
.flove-modal__lede {
  margin: 0;
  color: #52606d;
  font-size: .9rem;
}
.flove-modal label {
  display: grid;
  gap: 4px;
  font-size: .85rem;
  color: #52606d;
}
.flove-modal input,
.flove-modal textarea,
.flove-modal select {
  padding: 10px 12px;

  border-radius: var(--flove-radius);

  background: #fff;
  color: #1a1a1a;
}
.flove-modal__row {

.flove-publish-add label { margin-bottom: 6px; }

.flove-bar--enhanced .flove-mark:hover,

.flove-categories {

  justify-content: center;
}
.flove-categories::-webkit-scrollbar { display: none; }
.flove-cat-chip {

  border-color: var(--app-accent);
}

.flove-menu-btn {
  width: 36px; height: 36px;
  border-radius: var(--flove-radius-pill);
  border: 1px solid rgba(127,127,127,.22);
  background: rgba(255,255,255,.5);
  color: inherit;
  font-size: 18px;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;

.flove-menu-btn:hover { background: var(--app-accent-soft); border-color: var(--app-accent); }
.flove-menu-btn[aria-expanded="true"] { background: var(--app-accent); color: var(--app-ink-on-accent); }

.flove-menu {

  color: #1a1a1a;
  border: 1px solid rgba(0,0,0,.1);

  box-shadow: 0 18px 40px rgba(0,0,0,.18);
  padding: 6px;
  z-index: 200;
  font-family: var(--flove-font-ui);
}
.flove-menu[hidden] { display: none; }
.flove-menu__section {
  padding: 6px 0;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.flove-menu__section:last-child { border-bottom: 0; }
.flove-menu__title {
  margin: 0 8px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: #6b7280;
}
.flove-menu__item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  font: inherit;
  font-size: .9rem;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: var(--flove-radius);
  cursor: pointer;
  text-decoration: none;
}
.flove-menu__item:hover {
  background: var(--app-accent-soft);
  color: var(--app-ink-on-accent);
}

@media (max-width: 540px) {
  .flove-categories { gap: 4px; padding: 0 2px; }
  .flove-cat-chip { padding: 3px 10px; font-size: 11px; }
}

/* format popover ────────────────────────────────────────────── */
.flove-popover {
  z-index: 999;
  width: 220px;
  background: #fff;
  color: #1a1a1a;
  border: 1px solid rgba(0,0,0,.1);

  box-shadow: 0 14px 30px rgba(0,0,0,.18);

}
.flove-popover__item {
  display: block;
  width: 100%;
  padding: 9px 12px;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: var(--flove-radius);
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.flove-popover__item:hover {
  background: var(--app-accent-soft);
  color: var(--app-ink-on-accent);
}

  <style>
    :root{
      --app-accent:#8d89ff; --app-accent-soft:#c9c6ff; --app-ink-on-accent:#0b0b14;

        radial-gradient(900px 680px at -10% 120%, rgba(112,240,211,.13), transparent 50%),

      border-radius:var(--flove-radius-pill); cursor:pointer; color:var(--muted); border:1px solid transparent }
    #ui-lang-en:checked ~ label[for=ui-lang-en],
    #ui-lang-es:checked ~ label[for=ui-lang-es]{
      color:var(--app-ink-on-accent); background:var(--app-accent); border-color:var(--app-accent) }

    /* ───── topbar: brand (own logo · click-menu) + shuffle ───── */
    .flove-bar{ position:relative; display:flex; align-items:center; gap:.7rem }
    .ctl{ position:absolute; opacity:0; pointer-events:none }
    .puz-brand{ display:inline-flex; align-items:center; gap:.5rem; cursor:pointer; user-select:none }
    .puz-logo{ display:block; filter:drop-shadow(0 0 8px rgba(141,137,255,.5)); transition:transform var(--flove-fast) }

      flex-direction:column; gap:.1rem; min-width:200px; padding:.5rem;

    body:has(#puz-menu:checked) .puz-menu{ display:flex }
    .puz-menu a{ display:flex; align-items:center; gap:.55rem; padding:.5rem .7rem; border-radius:8px; color:var(--ink); text-decoration:none;
      font-size:.9rem; font-weight:600; transition:background var(--flove-fast), color var(--flove-fast) }
    .puz-menu a svg{ width:18px; height:18px; flex:0 0 auto }
    .puz-menu a:hover{ background:rgba(141,137,255,.16); color:var(--accent2) }
    .puz-sep{ height:1px; margin:.35rem .2rem; background:var(--line) }
    .puz-mlabel{ font-size:.66rem; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:.25rem .7rem }
    .puz-menu .lang{ padding:.1rem .5rem .3rem }
    /* dice lives inside the compass bar; flashes the accent colour when rolled */
    .mode-btn.is-flash{ background:var(--app-accent); color:var(--app-ink-on-accent); border-color:var(--app-accent) }
    .dice-btn svg{ transition:transform .45s cubic-bezier(.2,.8,.2,1) }
    .dice-btn.is-flash svg{ transform:rotate(180deg) }

    /* ───── interactive field — category nodes + app bubbles ───── */
    main{ max-width:1100px; margin:.6rem auto 2rem; padding:0 .8rem }
    .hint{ text-align:center; color:var(--muted); font-size:.82rem; margin:.4rem 0 0 }
    .field{ position:relative; height:min(78vh,760px); min-height:540px; margin-top:.4rem; overflow:hidden; touch-action:manipulation }

    /* category NODES — big, prominent, distinct per category */
    .node{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      width:108px; height:108px; border-radius:50%; border:0; cursor:pointer; color:#0a0a0f;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1rem; text-align:center;
      box-shadow:0 12px 34px rgba(0,0,0,.45);
      transition:left .75s cubic-bezier(.2,.85,.25,1), top .75s cubic-bezier(.2,.85,.25,1),

    .node .ni{ font-size:1.9rem; line-height:1 }
    .node .ni svg{ width:34px; height:34px; display:block }
    .node .nl{ font-size:.82rem; font-weight:800; letter-spacing:.5px }
    .node[data-cat="rate"]    { background:radial-gradient(circle at 35% 28%, #d7d4ff, #8d89ff 78%) }
    .node[data-cat="relate"]  { background:radial-gradient(circle at 35% 28%, #b6ffe9, #25c39e 78%) }
    .node[data-cat="redefine"]{ background:radial-gradient(circle at 35% 28%, #ffe6ad, #f5a623 78%) }

      box-shadow:0 0 0 4px rgba(255,255,255,.16), 0 16px 46px rgba(141,137,255,.5) }
    .node.is-dim{ opacity:.42; transform:translate(-50%,-50%) scale(.84) }
    .node::after{ content:""; position:absolute; inset:-5px; border-radius:50%;
      border:2px solid rgba(255,255,255,.30); animation:pulse 3.2s ease-out infinite; pointer-events:none }
    @keyframes pulse{ 0%{ transform:scale(.92); opacity:.55 } 100%{ transform:scale(1.5); opacity:0 } }

    /* app BUBBLES — glassy pills with icons (wanty-style) */
    .bub{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      display:inline-flex; align-items:center; gap:.4rem; text-decoration:none; color:var(--ink);
      font-family:inherit; font-weight:700; letter-spacing:.3px; cursor:pointer; padding:.45rem .9rem; border-radius:var(--flove-radius-pill);
      background:radial-gradient(ellipse at 50% 26%, rgba(141,137,255,.30), rgba(112,240,211,.12) 72%, rgba(255,255,255,.04));
      border:1px solid rgba(201,198,255,.42);
      box-shadow:inset 0 1px 7px rgba(255,255,255,.22), 0 8px 20px rgba(0,0,0,.32);
      transition:left .75s cubic-bezier(.2,.85,.25,1), top .75s cubic-bezier(.2,.85,.25,1),
        opacity .4s, scale .4s, filter .3s; animation:floaty 5s ease-in-out infinite; z-index:3 }
    .bub .bi{ display:inline-flex; align-items:center; line-height:0 }
    .bub .bi svg{ width:24px; height:24px; display:block; filter:drop-shadow(0 0 4px rgba(0,0,0,.45)); transition:width .5s ease, height .5s ease }

      flex-direction:column; align-items:center; justify-content:center; gap:.1rem; padding:.28rem .4rem; animation:none;
      border-color:rgba(245,166,35,.5);
      background:radial-gradient(ellipse at 50% 26%, rgba(245,166,35,.24), rgba(245,166,35,.07) 72%, rgba(255,255,255,.04));

    .bub-child .bi{ color:#f5a623 }
    .bub-child .bi svg{ width:18px; height:18px }
    .bub-child .bn{ font-size:.62rem; line-height:1.1; text-align:center; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis }

  // language persistence (§13.2) — one family-wide key
  (function(){
    var KEY = 'flove:lang';
    var saved = null;
    try { saved = window.floveStore.getRaw(KEY) || window.floveStore.getRaw('translaty-lang') || window.floveStore.getRaw('translate2-lang'); } catch (_) {}
    if (saved) { var r = document.getElementById('ui-lang-' + saved); if (r) r.checked = true; }
    document.querySelectorAll('input[name="ui-lang"]').forEach(function(r){
      r.addEventListener('change', function(){
        try { window.floveStore.set(KEY, r.id.replace('ui-lang-', '')); } catch (_) {}
      });
    });
  })();
  </script>
  <script>
  (function(){
    const field = document.getElementById('field');
    if(!field) return;
    const CATS  = ['rate','relate','redefine'];
    const nodes = [...field.querySelectorAll('.node')];
    const bubs  = [...field.querySelectorAll('.bub:not(.bub-child)')];
    const musicBall = field.querySelector('.bub-music');
    const musicChildren = [...field.querySelectorAll('.bub-child')];
    let musicOpen = false;
    // where each category node sits (fractions of the field)
    const anchors = { rate:{x:.28,y:.30}, relate:{x:.50,y:.78}, redefine:{x:.72,y:.30} };
    const SIZE_POOL = [1.5, 1.28, 1.12, 1.0, 0.9, 0.8];

    const activeCats = new Set();                 // multiselect of the category balls
    const display = { layout:'field', sized:false };
    const scatter = new Map();
    const vel = new Map();                        // per-bubble velocity, for the Bubbles drift
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let driftRAF = 0;

    const rnd = (a,b)=> a + Math.random()*(b-a);
    const clamp = (v,lo,hi)=> Math.max(lo, Math.min(hi, v));
    function genScatter(){
      bubs.forEach(b=>{
        if(b.classList.contains('bub-music')) scatter.set(b, { x:.72, y:.41 });
        else scatter.set(b, { x:rnd(.10,.90), y:rnd(.12,.86) });
      });
    }
    function genSizes(){ bubs.forEach(b=> b.style.setProperty('--bs', SIZE_POOL[Math.floor(Math.random()*SIZE_POOL.length)])); }
    function genListOrder(){                       // shuffle the order of apps within each category
      CATS.forEach(cat=>{
        const mem = bubs.filter(b=> b.dataset.cat === cat);
        const order = mem.map((_,i)=> i);
        for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
        mem.forEach((b,i)=> b.dataset.lrank = order[i]);
      });
    }
    function place(el, fx, fy){
      el.style.left = (clamp(fx,.04,.96)*field.clientWidth) + 'px';
      el.style.top  = (clamp(fy,.05,.95)*field.clientHeight) + 'px';
    }

    function layout(){
      closeMusicChildren();
      const w = field.clientWidth, h = field.clientHeight, mode = display.layout;

      // ── LIST · vertical flow grouped by category (CSS flex + order) ──
      if(mode === 'list'){
        nodes.forEach(n=>{
          n.style.left=''; n.style.top=''; n.style.order = CATS.indexOf(n.dataset.cat)*100;
          n.classList.remove('is-active','is-dim');
        });
        bubs.forEach(b=>{
          b.style.left=''; b.style.top='';
          b.style.order = b.classList.contains('bub-music')
            ? 290
            : (CATS.indexOf(b.dataset.cat)*100 + 1 + Number(b.dataset.lrank||0));
          b.classList.remove('is-on','is-dim');
        });
        return;
      }

      // ── BUBBLES · balls hidden, every app drifts free ──
      if(mode === 'bubbles'){
        bubs.forEach(b=>{ const p = scatter.get(b); b.style.order=''; place(b, p.x, p.y); b.classList.remove('is-on','is-dim'); });
        return;
      }

      // ── FIELD · category balls + orbit-on-select (multiselect) ──
      nodes.forEach(n=>{
        const a = anchors[n.dataset.cat]; n.style.order=''; place(n, a.x, a.y);
        n.classList.toggle('is-active', activeCats.has(n.dataset.cat));
        n.classList.toggle('is-dim', activeCats.size>0 && !activeCats.has(n.dataset.cat));
      });
      bubs.forEach(b=> b.style.order='');
      if(activeCats.size === 0){
        bubs.forEach(b=>{ const p = scatter.get(b); place(b, p.x, p.y); b.classList.remove('is-on','is-dim'); });
        return;
      }
      const park = [];
      CATS.forEach(cat=>{
        const mem = bubs.filter(b=> b.dataset.cat === cat);
        if(activeCats.has(cat)){
          const a = anchors[cat], R = Math.min(w,h) * 0.20;     // each active ball orbits its own apps
          mem.forEach((b,i)=>{
            const isMusic = b.classList.contains('bub-music');
            const rr = isMusic ? R*0.62 : R;
            const ang = isMusic ? Math.PI/2 : ((2*Math.PI*i/mem.length) - Math.PI/2);
            place(b, a.x + (rr*Math.cos(ang))/w, a.y + (rr*Math.sin(ang))/h);
            b.classList.add('is-on'); b.classList.remove('is-dim');
          });
        } else {
          mem.forEach(b=> park.push(b));                        // the rest park along the bottom, dim
        }
      });
      park.forEach((b,i)=>{ place(b, (i+1)/(park.length+1), 0.965); b.classList.add('is-dim'); b.classList.remove('is-on'); });
    }

    // ── Bubbles mode · free random drift around the whole field ──
    function seedVelocities(){ bubs.forEach(b=> vel.set(b, { vx:rnd(-1,1)*0.00065, vy:rnd(-1,1)*0.00065 })); }
    function stopDrift(){ if(driftRAF){ cancelAnimationFrame(driftRAF); driftRAF = 0; } }

          const sp = Math.hypot(v.vx, v.vy), max = 0.0012, min = 0.0004;

/* flove-theme.js — shared dark/light theme toggle for app launchers */
/* Usage: include <script src="flove-theme.js"><\/script> in launcher HTML */
/* Then add class="theme-toggle" to your toggle button */

(function() {
  'use strict';

  const STORAGE_KEY = 'flove-theme';
  const DARK_CLASS = 'dark';
  const DARK_MODE = 1;
  const LIGHT_MODE = 0;

  // Get stored preference or follow system
  function getStoredPreference() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored !== null) {
      return parseInt(stored, 10);
    }
    // Follow system preference
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK_MODE : LIGHT_MODE;
  }

  // Apply theme
  function applyTheme(mode) {
    if (mode === DARK_MODE) {
      document.documentElement.classList.add(DARK_CLASS);
    } else {
      document.documentElement.classList.remove(DARK_CLASS);
    }
  }

  // Toggle theme
  function toggleTheme() {
    const current = document.documentElement.classList.contains(DARK_CLASS) ? DARK_MODE : LIGHT_MODE;
    const next = current === DARK_MODE ? LIGHT_MODE : DARK_MODE;
    applyTheme(next);
    localStorage.setItem(STORAGE_KEY, next.toString());
  }

  // Initialize on load
  function init() {
    applyTheme(getStoredPreference());

    // Add click handlers to all theme toggle buttons
    const toggleButtons = document.querySelectorAll('.theme-toggle');
    toggleButtons.forEach(button => {
      button.addEventListener('click', toggleTheme);
    });

    // Listen for system preference changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      // Only follow system if no stored preference
      if (localStorage.getItem(STORAGE_KEY) === null) {
        applyTheme(e.matches ? DARK_MODE : LIGHT_MODE);
      }
    });
  }

  // Run when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

        if (it === null || it === undefined) { blank = true; return; }
        if (typeof it === 'string' && !it.trim()) { blank = true; return; }
        items.push(typeof it === 'object' ? JSON.stringify(it) : String(it));
      });
    });
    check('row keys are unique', new Set(keys).size === keys.length, 'critical',
          keys.length + ' keys');
    check('items are never blank', !blank, 'critical');
    check('filled rows have a title', !untitled, 'critical');

    var fieldsSource = window.floveFields, fields = [];
    var fieldsKind = typeof fieldsSource;
    try {
      if (fieldsKind === 'function') fields = flatFields(fieldsSource() || []);
      else if (Array.isArray(fieldsSource)) fields = flatFields(fieldsSource);
    } catch (e) {}
    check('floveFields() is callable', fieldsKind === 'function' || fieldsKind === 'undefined',
          'advisory', fieldsKind === 'function' || fieldsKind === 'undefined' ? '' : fieldsKind);
    var haystack = norm(keys.join(' ') + ' ' + items.join(' ') + ' ' +
                        (p.phrase || '') + ' ' + json);
    var mapped = fields.filter(function(id){ return haystack.indexOf(norm(id)) !== -1; });
    check('field ids discoverable in the portrait (parity is advisory)', true, 'advisory',
          mapped.length + '/' + fields.length + ' fields · ' +
          Math.round(fields.length ? mapped.length / fields.length * 100 : 100) + '%');

    var c = null;
    try { c = api.consult ? api.consult(opts.consult || {}) : null; } catch (e) { c = null; }
    var consulted = c && Array.isArray(c.rows)
      ? c.rows.map(function(r){ return norm(r && r.key); }) : [];
    check('consult() returns flove-consult/1',
          c && c.schema === 'flove-consult/1' && Array.isArray(c.rows), 'critical',
          c && c.schema);
    check('consult() rows are a subset of get() rows',
          consulted.every(function(k){ return keys.indexOf(k) !== -1; }), 'critical',
          consulted.length + ' consulted');

    var merged = null, mergeError = '';
    try {
      merged = api.merge
        ? api.merge({
            schema: 'flove-portrait/1', app: p.app, version: 1,
            generatedAt: p.generatedAt, lang: p.lang,
            rows: [{ key: '__conformance__', kind: 'probe', title: '', items: [] }],
            consent: p.consent, source: p.source
          })
        : null;
    } catch (e) { mergeError = e && e.message || String(e); }
    check('merge() accepts a probe row without applying it',
          merged && merged.ok === true && (merged.applied || 0) === 0, 'advisory',
          mergeError || (merged ? 'applied ' + (merged.applied || 0) : 'no merge()'));

    var errors = checks.filter(function(x){ return !x.ok && x.level === 'critical'; })
                       .map(function(x){ return x.name; });
    var advisories = checks.filter(function(x){ return !x.ok && x.level === 'advisory'; })
                           .map(function(x){ return x.name; });
    return { ok: errors.length === 0, app: app, checks: checks,
             errors: errors, advisories: advisories,
             coverage: fields.length ? { mapped: mapped.length, total: fields.length } : null };
  };
})();
</script>
<!-- flove-conformance:end -->
<script data-flove-fields-flat>
/* Technical helper: flat routing field paths for cross-app combination.
   Read-only; no UI, storage or network side effect. */
(function(){
  if (window.floveFieldsFlat) return;
  function walk(list, parent, out){
    (list || []).forEach(function(f){
      if (!f || !f.id) return;
      var path = String(f.id);
      if (parent && path.indexOf(parent + '.') !== 0) path = parent + '.' + path;
      out.push({ path: path, id: f.id, label: f.label || '', type: f.type || '', parent: parent || null });
      if (f.fields) walk(f.fields, path, out);
      if (f.item && f.item.fields) walk(f.item.fields, path, out);
    });
  }
  window.floveFieldsFlat = function(){
    var out = [];
    walk(typeof window.floveFields === 'function' ? window.floveFields() : [], '', out);
    return out;
  };
  if (window.flovePort && !window.flovePort.fields) window.flovePort.fields = window.floveFieldsFlat;
})();
</script>
