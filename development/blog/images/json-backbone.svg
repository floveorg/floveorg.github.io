<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" role="img" aria-labelledby="t d">
  <title id="t">The JSON backbone — jsony routine</title>
  <desc id="d">Five steps: apps/ commit, queue only, four checks, pending report, review and apply — plus what jsony treats as critical and advisory.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d89ff"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fdc"/><stop offset=".55" stop-color="#8d89ff"/><stop offset="1" stop-color="#70f0d3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7f5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="940" height="660" rx="18" fill="#fdfbfa"/>
  <rect x="1" y="1" width="938" height="658" rx="17" fill="none" stroke="#eadfd9"/>

  <text x="40" y="46" font-family="ui-serif, Georgia, serif" font-size="22" font-weight="700" fill="#241413">The JSON backbone</text>
  <text x="40" y="69" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b4a47">jsony · one commit in apps/ → one pending JSON update · it never edits the canonical files</text>
  <rect x="40" y="82" width="120" height="4" rx="2" fill="url(#hdr)"/>

  <!-- 1 -->
  <rect x="40" y="104" width="576" height="66" rx="12" fill="url(#card)" stroke="#e6d9d2"/>
  <circle cx="68" cy="137" r="12" fill="#8d89ff"/>
  <text x="68" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="94" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#241413">A commit touches apps/</text>
  <text x="94" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">The post-commit hook checks the changed paths. No apps/ change → it exits quietly.</text>

  <!-- 2 -->
  <rect x="40" y="188" width="576" height="66" rx="12" fill="url(#card)" stroke="#e6d9d2"/>
  <circle cx="68" cy="221" r="12" fill="#8d89ff"/>
  <text x="68" y="226" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="94" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#241413">Queue only</text>
  <text x="94" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">--record --soft appends the changed files to tools/jsony-state.json. No check, no block.</text>

  <!-- 3 -->
  <rect x="40" y="272" width="576" height="98" rx="12" fill="url(#card)" stroke="#e6d9d2"/>
  <circle cx="68" cy="305" r="12" fill="#8d89ff"/>
  <text x="68" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="94" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#241413">--changed → four checks</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">
    <text x="94" y="320">routing.json · app ids and URLs exist</text>
    <text x="94" y="337">Appy APP_ROUTING · ids and categories match</text>
    <text x="94" y="354">export envelopes · flove-portrait · flove-profile</text>
  </g>

  <!-- 4 -->
  <rect x="40" y="388" width="576" height="66" rx="12" fill="url(#card)" stroke="#e6d9d2"/>
  <circle cx="68" cy="421" r="12" fill="#8d89ff"/>
  <text x="68" y="426" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="94" y="416" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#241413">A pending report</text>
  <text x="94" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">tools/jsony-pending.md (for you) · .json (for a later agent pass). The commit is the watermark.</text>

  <!-- 5 -->
  <rect x="40" y="472" width="576" height="86" rx="12" fill="url(#card)" stroke="#e6d9d2"/>
  <circle cx="68" cy="505" r="12" fill="#8d89ff"/>
  <text x="68" y="510" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="94" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#241413">Review → apply → align</text>
  <text x="94" y="520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">Fix routing · update the Appy snapshot · regenerate the catalogue</text>
  <text x="94" y="537" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b4a47">run exporty on the changed app · re-run --strict until clean</text>

  <!-- arrows -->
  <g stroke="#8d89ff" stroke-width="1.8" marker-end="url(#ar)">
    <line x1="328" y1="172" x2="328" y2="184"/>
    <line x1="328" y1="256" x2="328" y2="268"/>
    <line x1="328" y1="372" x2="328" y2="384"/>
    <line x1="328" y1="456" x2="328" y2="468"/>
  </g>

  <!-- side panel -->
  <rect x="646" y="104" width="254" height="454" rx="14" fill="#ffffff" stroke="#e6d9d2"/>
  <text x="668" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8d89ff" letter-spacing="1.2">WHAT IS CHECKED</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#241413">
    <text x="668" y="160" font-weight="700">Critical</text>
    <text x="668" y="180" fill="#6b4a47">manifest missing from routing</text>
    <text x="668" y="197" fill="#6b4a47">routing URL does not resolve</text>
    <text x="668" y="214" fill="#6b4a47">APP_ROUTING missing / extra /</text>
    <text x="668" y="229" fill="#6b4a47">wrong category</text>
    <text x="668" y="246" fill="#6b4a47">envelope lost flove-profile,</text>
    <text x="668" y="261" fill="#6b4a47">flove-routing/3, appsPlayed,</text>
    <text x="668" y="276" fill="#6b4a47">flove-portrait/1 or flovePort</text>
  </g>

  <line x1="668" y1="294" x2="878" y2="294" stroke="#eadfd9"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#241413">
    <text x="668" y="320" font-weight="700">Advisory</text>
    <text x="668" y="340" fill="#6b4a47">an app with fields has no</text>
    <text x="668" y="355" fill="#6b4a47">flovePortrait / flovePort</text>
  </g>

  <line x1="668" y1="376" x2="878" y2="376" stroke="#eadfd9"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <text x="668" y="402" font-weight="700" fill="#241413">Apply order</text>
    <text x="668" y="422" fill="#6b4a47">1 · read the pending report</text>
    <text x="668" y="439" fill="#6b4a47">2 · fix routing / run</text>
    <text x="668" y="454" fill="#6b4a47">    extract-fields.py --apply</text>
    <text x="668" y="471" fill="#6b4a47">3 · update APP_ROUTING</text>
    <text x="668" y="488" fill="#6b4a47">4 · exporty on the app</text>
    <text x="668" y="505" fill="#6b4a47">5 · --strict until clean</text>
  </g>

  <rect x="646" y="574" width="254" height="52" rx="12" fill="#f6f1ff" stroke="#e6d9d2"/>
  <text x="668" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8d89ff">jsony inside updaty</text>
  <text x="668" y="614" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#6b4a47">the last step before the push</text>

  <text x="40" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#9a7a77">Every commit in apps/ moves one small stone. The backbone stays legible because it is checked, not trusted.</text>
</svg>
