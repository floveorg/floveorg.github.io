# Hugo config for the flove blog. Built by ../build-blog.sh into this
# directory's root (no /public segment), committed, and shipped with the main
# site via publish-web.sh → https://flove.org/development/blog/ (no CI).
baseURL = "https://flove.org/development/blog/"
defaultContentLanguage = "en"
title = "flove · blog"
theme = "flovelite"
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Notes from flove — a slower internet where relating, not extracting, is the point."
  tagline = "slow it · flow it · love it"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML in posts (flove writes hand-tuned markup)

[markup.highlight]
  noClasses = false
  lineNos = false
