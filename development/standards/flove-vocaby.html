<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flove · standards matrix</title>
<style>
  :root{
    --bg:#faf8f5; --ink:#2a2622; --line:#e3ddd4; --accent:#7b6cf6; --accent3:#1f9e6b;
    --num:#b6ab9c; --head:#f1ece4; --grp:#e7e0fb; --edit:#fffdf8;
    --mother:#9a8cf0;
    font-family: system-ui, "Inter", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:1.2rem;line-height:1.4}
  h1{font-size:1.15rem;margin:0 0 .2rem}
  h2{font-size:1rem;margin:1.3rem 0 .4rem}
  p.sub{margin:.1rem 0 1rem;color:#7d7468;font-size:.85rem}
  .toolbar{padding:.5rem 0;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .topbar{position:sticky;top:0;background:var(--bg);z-index:9;border-bottom:1px solid var(--line);margin-bottom:.6rem}
  button{font:inherit;font-size:.82rem;padding:.5rem .8rem;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  select{font:inherit;font-size:.82rem;padding:.45rem .6rem;border:1px solid var(--line);border-radius:10px;background:#fff}
  button:hover{filter:brightness(.97)}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 0 .1rem}
  .chip{font:inherit;font-size:.8rem;padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--ink)}
  .chip:hover{filter:brightness(.97)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.all{background:var(--grp);color:#5b4fae;border-color:var(--grp);font-weight:600}
  .chip.all.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .appsec{margin-top:1.2rem}
  .appsec h2{font-size:.95rem;margin:0 0 .35rem}
  .wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
  table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.78rem}
  th,td{border:1px solid var(--line);vertical-align:top;min-width:138px}
  th{background:var(--head);padding:.45rem;text-align:left;font-size:.74rem}
  thead th{position:sticky;top:0;z-index:2}
  th.tier,td.tier{position:sticky;left:0;background:var(--head);min-width:118px;font-weight:600;z-index:2}
  th.corner{left:0;z-index:6;background:var(--grp)}
  th.gb, td.gb{ border-left:3px solid var(--mother); }
  td .num{display:block;font-size:.6rem;color:var(--num);font-weight:600;padding:.25rem .4rem 0;user-select:none}
  td .cell{padding:.15rem .4rem .3rem;min-height:1.5em;outline:none}
  td .cell:focus{background:var(--edit);box-shadow:inset 0 0 0 2px var(--accent)}
  td.empty .cell:empty::before{content:"—";color:#cfc6b8}
  #appView{margin-top:1rem;border-top:2px dashed var(--line);padding-top:.6rem}
  #appView .cell:focus{box-shadow:inset 0 0 0 2px var(--accent3)}
  .lvl{display:inline-block;font-size:.66rem;background:var(--grp);color:#5b4fae;border-radius:6px;padding:.1rem .4rem;margin-left:.4rem}
  .apvt{display:inline-flex;gap:.4rem;align-items:center;margin:0 0 .5rem}
  .vtog{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.42rem .7rem;cursor:pointer;user-select:none}
  .vtog input{accent-color:var(--accent)}
  tr.nav-row td.tier{background:#efe9fc;color:#4a3f8f}
  tr.wizrow td{background:#fdf9f2;border-top:1px dashed var(--line)}
  tr.wizrow td.tier.wiz{white-space:nowrap;color:#7d5a3c;font-weight:600}
  .wizname{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:#a08c74;font-weight:600}
  .cell-wiz{min-width:240px;color:#5a4630}
  tr.navhead td{background:var(--grp);color:#5b4fae;font-weight:600}
  .tchip{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;border:1px solid var(--line);border-radius:999px;background:#fff;padding:.15rem .6rem;margin:0 .25rem .15rem 0;cursor:pointer;color:var(--ink);font-weight:600;user-select:none}
  .tchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tchip input{display:none}
  tr.navgroup td{background:#f4f0fb;color:#5b4fae;font-weight:600}
  .navtag{display:inline-block;font-size:.64rem;background:var(--accent);color:#fff;border-radius:6px;padding:.08rem .45rem;text-transform:uppercase;letter-spacing:.04em}
  .navadd{font-size:.68rem;padding:.18rem .5rem;margin-left:.5rem;border-radius:8px}
  .ok{color:#2b8a3e;font-size:.8rem}
  .full{width:100%}
  #exportView{margin-top:1rem;border-top:2px dashed var(--line);padding-top:.6rem;display:flex;flex-direction:column;gap:.5rem}
  .row33{display:flex;gap:.5rem}
  .row33 button{flex:1}
  #promptArea{width:100%;height:38vh;border:1px solid var(--line);border-radius:12px;padding:.8rem;font-family:ui-monospace,monospace;font-size:.78rem;resize:vertical;background:#fff;color:var(--ink);outline:none}
</style>
</head>
<body>
  <div class="topbar">
    <div class="chips" id="chips"></div>
  </div>

  <section id="appView">
    <div class="toolbar">
      <button onclick="addSlot()">+ Add slot</button>
      <button onclick="addWizy()">+ Add wizy</button>
    </div>
    <div id="appList"></div>

    <h2>Prompt for Claude</h2>
    <p class="sub">Mirrors the vocabulary table above. Press Update after editing so the prompt and exports carry the latest wording.</p>
    <button class="primary full" onclick="updateExport()">⟳ Update export</button>
    <div class="row33">
      <button class="primary" onclick="copyForClaude()">📋 Copy for Claude</button>
      <button onclick="downloadJSON()">{ } JSON</button>
      <button onclick="downloadCSV()">⬇ CSV</button>
    </div>
    <span class="ok" id="ok"></span>
    <textarea id="promptArea" readonly placeholder="Pick chips above, then press Update to see the prompt text here."></textarea>

const SLOTS = ["App title","Tagline","Entry label","About (body)"];
const LABELERS = ["Default","Formal","Casual","Hotter","Lovely","Fatal","Lucky","Random"];

const NAV_TIERS = ["basic","normal","advanced","super"];          // upper tiers above mini (the base table)
const appTiers = {};   // app → tiers actually shipped; absent = all NAV_TIERS
const navSlots = {};   // app → { tier: [extra slot names this tier provides] }
const wizys = {};      // app → { slot: { wizard: text the wizard shows for that field when checked } }
const sel = new Set(APPS);   // checked apps (multicheck); exports & list follow this
const wz = {};               // app → wizys toggle (absent = on)
const nv = {};               // app → navs toggle (absent = on)
function wzOn(app){ return wz[app]!==false; }
function nvOn(app){ return nv[app]!==false; }
function shippedTiers(app){ const t=appTiers[app]; return t===undefined?NAV_TIERS:t; }
function navSlotsOf(app,t){ return (navSlots[app]&&navSlots[app][t])||[]; }
function rowList(app){
  const rows=[];
  SLOTS.concat(appSlots[app]||[]).forEach(s=>rows.push({s,tier:null}));
  if(nvOn(app)){ const has=shippedTiers(app);
    NAV_TIERS.forEach(t=>{ if(!has.includes(t))return; navSlotsOf(app,t).forEach(s=>rows.push({s,tier:t})); });
  }
  return rows;
}

// ===== render ===============================================================
function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
function appSection(app){
  vocab[app]||(vocab[app]={});
  const rows=rowList(app);
  let n=1, html=`<div class='appsec'><h2>${esc(app)} <span class='lvl'>vocabulary · labelers × slots</span></h2>`
    +`<div class='apvt'>`
    +`<label class='vtog'><input type='checkbox' ${wzOn(app)?"checked":""} onchange='toggleAppView("${esc(app)}","wizys",this.checked)'> Wizys</label>`
    +`<label class='vtog'><input type='checkbox' ${nvOn(app)?"checked":""} onchange='toggleAppView("${esc(app)}","navs",this.checked)'> Navs</label>`
    +`</div><div class='wrap'><table>`;
  html+="<thead><tr><th class='corner tier'>slot \\ labeler</th>";
  LABELERS.forEach(l=> html+=`<th class='${l==="Default"?"gb":""}'>${esc(l)}</th>`);
  html+="</tr></thead><tbody>";
  if(nvOn(app)){
    const has=shippedTiers(app);
    html+=`<tr class='navhead'><td class='tier' colspan='${LABELERS.length+1}'>Tiers shipped: `;
    NAV_TIERS.forEach(t=> html+=`<label class='tchip ${has.includes(t)?"on":""}'><input type='checkbox' data-app='${esc(app)}' data-tier='${t}' ${has.includes(t)?"checked":""} onchange='toggleTier(this)'>${esc(t)}</label>`);
    html+=`</td></tr>`;
  }
  let curTier=null;
  rows.forEach(r=>{
    if(r.tier!==curTier){ curTier=r.tier;
      if(r.tier) html+=`<tr class='navgroup'><td class='tier' colspan='${LABELERS.length+1}'>`
        +`<span class='navtag'>${esc(r.tier)}</span> — extra fields `
        +`<button class='navadd' onclick='addNavSlot("${esc(app)}","${esc(r.tier)}")'>+ add</button></td></tr>`;
    }
    const d=vocab[app][r.s]||(vocab[app][r.s]={});
    html+=`<tr class='${r.tier?"nav-row":"slot-row"}'><td class='tier'>${esc(r.s)}</td>`;
    LABELERS.forEach(l=>{ const v=d[l]||"";
      html+=`<td class='${v?"":"empty"}'><span class='num'>${app}.V${n}</span>`
          +`<div class='cell' contenteditable data-app='${esc(app)}' data-slot='${esc(r.s)}' data-lab='${esc(l)}'>${esc(v)}</div></td>`; n++; });
    html+="</tr>";
    if(wzOn(app)){
      WIZARDS.forEach(([w,icon])=>{
        const v=(wizys[app]&&wizys[app][r.s]&&wizys[app][r.s][w])||"";
        html+=`<tr class='wizrow'><td class='tier wiz'>${icon} <span class='wizname'>${esc(w)}</span></td>`
            +`<td colspan='${LABELERS.length}'><span class='num'>${app}.V${n}</span>`
            +`<div class='cell cell-wiz' contenteditable data-app='${esc(app)}' data-slot='${esc(r.s)}' data-wiz='${w}'>${esc(v)}</div></td></tr>`;
        n++;
      });
    }
  });
  return html+"</tbody></table></div></div>";
}
function render(){
  const list=document.getElementById("appList");
  list.innerHTML=[...sel].map(appSection).join("");
  list.querySelectorAll(".cell").forEach(el=>el.addEventListener("input",e=>{
    const a=e.target.dataset.app, s=e.target.dataset.slot; if(!a||!s)return;
    if(e.target.dataset.wiz){
      wizys[a]||(wizys[a]={}); wizys[a][s]||(wizys[a][s]={});
      wizys[a][s][e.target.dataset.wiz]=e.target.innerText.trim();
    }else{
      const vd=vocab[a]; if(!vd||!vd[s])return;
      vd[s][e.target.dataset.lab]=e.target.innerText.trim();
      e.target.parentElement.classList.toggle("empty",!e.target.innerText.trim());
    }
  }));
  document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("on",c.dataset.app==="all"?sel.size===APPS.length:sel.has(c.dataset.app)));
}
function toggleAppView(app,name,on){ if(name==="wizys")wz[app]=on; else nv[app]=on; render(); updateExport(); }
function toggleTier(cb){
  const app=cb.dataset.app, t=cb.dataset.tier, cur=(appTiers[app]||[]).slice();
  if(cb.checked){ if(!cur.includes(t))cur.push(t); } else { const i=cur.indexOf(t); if(i>=0)cur.splice(i,1); }
  appTiers[app]=cur;
  render(); updateExport();
}
function buildChips(){
  let html="<button class='chip all' data-app='all' onclick='toggleApp(\"all\")'>All</button>";
  APPS.forEach(a=> html+=`<button class='chip' data-app='${esc(a)}' onclick='toggleApp("${esc(a)}")'>${esc(a)}</button>`);
  document.getElementById("chips").innerHTML=html;
}
function toggleApp(a){
  if(a==="all"){ sel.size===APPS.length ? sel.clear() : APPS.forEach(x=>sel.add(x)); }
  else sel.has(a) ? sel.delete(a) : sel.add(a);
  render(); updateExport();
}
function curApp(){ return sel.size===1?[...sel][0]:null; }

// ===== adders ===============================================================
function addSlot(){
  let app=curApp();
  if(!app){ const a=prompt("App name?",""); if(!a||!APPS.includes(a)){flash("ok","unknown app");return;} app=a; }
  const v=prompt("New "+app+" slot?",""); if(!v)return;
  appSlots[app]||(appSlots[app]=[]); appSlots[app].push(v);
  render(); updateExport();
}
function addWizy(){
  const v=prompt("New wizard (icon + name, e.g. 🙂 mood)?",""); if(!v)return;
  const m=v.trim().match(/^(\S+)\s+(.+)$/);
  WIZARDS.push(m?[m[2],m[1]]:[v,"✦"]);
  render(); updateExport();
}
function addNavSlot(app,t){
  const v=prompt("New "+app+" "+t+" slot?",""); if(!v)return;
  navSlots[app]||(navSlots[app]={}); navSlots[app][t]||(navSlots[app][t]=[]);
  if(!navSlots[app][t].includes(v)) navSlots[app][t].push(v);
  vocab[app]||(vocab[app]={}); vocab[app][v]||(vocab[app][v]={});
  render(); updateExport();
}

// ===== exports ==============================================================
function vocabLines(app){
  vocab[app]||(vocab[app]={});
  const rows=rowList(app);
  let n=1,out=[];
  rows.forEach(r=>{ const vd=vocab[app][r.s]; if(!vd)return;
    LABELERS.forEach(l=>{ const v=vd[l]||""; if(v) out.push(`${app}.V${n}: [${r.s} · ${l}] ${v}`); n++; });
    if(wzOn(app)) WIZARDS.forEach(([w])=>{ const v=(wizys[app]&&wizys[app][r.s]&&wizys[app][r.s][w])||""; if(v) out.push(`${app}.V${n}: [${r.s} · wizard-${w}] ${v}`); n++; });
  });
  return `# ${app} — vocabulary\n\n`+out.join("\n");
}
function allVocabLines(){ const out=[];
  [...sel].forEach(a=>{ const t=vocabLines(a); if(t.split("\n").slice(2).some(Boolean)) out.push(t); });
  return out.join("\n\n"); }
function updateExport(){ const t=document.getElementById("promptArea");
  const single=curApp();
  t.value=single?vocabLines(single):allVocabLines(); flash("ok","✓ export updated"); }
function flash(id,m){const e=document.getElementById(id);e.textContent=m;setTimeout(()=>e.textContent="",1800);}
function copyForClaude(){const t=document.getElementById("promptArea").value.trim();
  if(!t){flash("ok","press Update first");return;}
  navigator.clipboard.writeText(t).then(()=>flash("ok","✓ copied — paste into chat"));}
function appVocab(app){
  vocab[app]||(vocab[app]={});
  const rows=rowList(app), voc={};
  rows.forEach(r=>{ const vd=vocab[app][r.s]; if(!vd)return; const o={};
    LABELERS.forEach(l=>{ if(vd[l]) o[l]=vd[l]; });
    if(wzOn(app)) WIZARDS.forEach(([w])=>{ const v=(wizys[app]&&wizys[app][r.s]&&wizys[app][r.s][w])||""; if(v) o["wizard-"+w]=v; });
    if(Object.keys(o).length){
      if(r.tier){ voc[r.tier]||(voc[r.tier]={}); voc[r.tier][r.s]=o; }
      else voc[r.s]=o;
    }
  });
  return voc;
}
function downloadJSON(){
  const single=curApp();
  const data=single
    ? {app:single, vocabulary:appVocab(single)}
    : {apps:Object.fromEntries([...sel].filter(a=>Object.keys(appVocab(a)).length).map(a=>[a,appVocab(a)]))};
  const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(single?single:(sel.size===APPS.length?"flove-vocab-all":"flove-vocab-multi"))+"-vocab.json";a.click();flash("ok","✓ JSON downloaded");}
function downloadCSV(){
  const single=curApp(), rows=single?[["tier","slot","labeler","value"]]:[["app","tier","slot","labeler","value"]];
  (single?[single]:[...sel]).forEach(a=>{ rowList(a).forEach(r=>{
    const vd=vocab[a][r.s]; if(!vd)return;
    const tier=r.tier||"mini";
    LABELERS.forEach(l=>{ const v=vd[l]; if(!v)return; if(single) rows.push([tier,r.s,l,v]); else rows.push([a,tier,r.s,l,v]); });
    if(wzOn(a)) WIZARDS.forEach(([w])=>{ const v=(wizys[a]&&wizys[a][r.s]&&wizys[a][r.s][w])||""; if(!v)return;
      if(single) rows.push([tier,r.s,w,v]); else rows.push([a,tier,r.s,w,v]); });
  }); });
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const b=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(single?single:(sel.size===APPS.length?"flove-vocab-all":"flove-vocab-multi"))+"-vocab.csv";a.click();flash("ok","✓ CSV downloaded");}

buildChips(); render(); updateExport();
</script>
