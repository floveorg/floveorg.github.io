<!-- translaty worldball — place near the top of the app (inside the header if
     there is one, else right after <body>). One <input>+<label> per language;
     ids MUST be lang-<code> (the engine CSS/JS keys off them) and each input is
     immediately followed by its label (the :checked + label highlight needs it).
     EN/ES shown; add an option per extra language and keep the first checked. -->
<details class="lang">
  <summary class="worldball" title="Language" aria-label="Language" data-aria-en="Language" data-aria-es="Idioma">🌐</summary>
  <div class="lang-opts">
    <input type="radio" name="lang" id="lang-en" checked><label for="lang-en">English</label>
    <input type="radio" name="lang" id="lang-es"><label for="lang-es">Español</label>
  </div>
</details>
