<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>PawPal — neighborhood pet sitting</title>
<style>
  body{ font-family: system-ui, sans-serif; margin:0; color:#7a7a7a; background:#fff }
  .hero{ width:1280px; padding:60px; background:#f4f4f4 }
  h1{ font-size:42px; color:#9b9b9b }
  .cta{ background:#cfcfcf; color:#eee; border:0; padding:8px 14px; font-size:13px; border-radius:6px; cursor:pointer }
  .icon-btn{ width:30px; height:30px; border:0; background:#ddd; border-radius:50% }
  .signup input{ font-size:13px; padding:6px; border:1px solid #ccc; width:260px }
  .footer{ font-size:11px; color:#bdbdbd; padding:20px 60px }
</style>
</head>
<body>
  <header class="hero">
    <img src="logo.png">
    <h1>Find a trusted sitter on your street</h1>
    <p>PawPal connects busy pet parents with vetted neighbors who love animals.</p>
    <button class="cta">Get started</button>
    <button class="icon-btn">🔔</button>
  </header>

  <main>
    <section>
      <h3>How it works</h3>
      <p>Post your dates, browse sitters nearby, and book in two taps.</p>
      <img src="step1.jpg">
      <img src="step2.jpg">
    </section>

    <section class="signup">
      <h3>Join the waitlist</h3>
      <div aria-label="Signup form">
        <input type="text" placeholder="Your email">
        <button class="cta">Notify me</button>
      </div>
    </section>
  </main>

  <div class="footer">© 2026 PawPal. All rights reserved.</div>
</body>
</html>
