<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="flove:app" content="workflow">
<meta name="flove:tier" content="normal">
<meta name="flove:distro" content="development">
<meta name="description" content="The flove publishing workflow — my folders → gitea → github → flove.org. Click a node to expand it in place; click an arrow to thicken it; click the left human to show the arrow to the other human. Public page: no private data shown.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='12' y1='0' x2='88' y2='0' gradientUnits='userSpaceOnUse'><stop offset='0' stop-color='%23ff3344'/><stop offset='.5' stop-color='%23ff8a3a'/><stop offset='1' stop-color='%23ffd633'/></linearGradient></defs><path d='M50 60 C 22 60, 12 38, 16 18 C 38 22, 54 38, 50 60 Z' fill='url(%23g)'/><path d='M50 60 C 78 60, 88 38, 84 18 C 62 22, 46 38, 50 60 Z' fill='url(%23g)'/><path d='M50 58 C 50 72, 50 84, 50 92' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' fill='none'/></svg>">
<title>workflow · flove</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0c0c14;--panel:#131320;--panel2:#1d1d2b;--line:#29293c;
    --ink:#ffffff;--muted:#ffffff;--accent:#6c5ce7;--accent2:#8b7df0;
    --bar-h:74px;--safe-b:env(safe-area-inset-bottom,0px);
  }
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 120% at 50% 28%,#16142e 0%,var(--bg) 72%);
    min-height:100svh;line-height:1.55;
    padding:10px 16px calc(var(--bar-h) + var(--safe-b) + 18px);
    overflow-x:hidden;
  }
  ::selection{background:rgba(108,92,231,.4)}

  .stage{max-width:1040px;margin:0 auto}
  .stage svg{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 50px rgba(0,0,0,.45))}

  /* node expand / shrink in place (geometry props need the head style, not the svg style) */
  .node .node-rect{transition:height .3s cubic-bezier(.22,.61,.36,1)}
  .node.open .node-rect{height:240px}
  .node .extras{opacity:0;pointer-events:none;transition:opacity .2s ease .08s}
  .node.open .extras{opacity:1;pointer-events:auto}

  /* ── action bar ── */
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;
           padding:10px max(12px,calc((100vw - 1040px)/2 + 8px)) calc(10px + var(--safe-b));
           background:rgba(12,12,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .act{border:none;border-radius:14px;padding:15px 0;font-size:14px;font-weight:800;cursor:pointer;
       font-family:inherit;transition:.15s;color:var(--ink);background:var(--panel2);border:1px solid var(--line)}
  .act.copy{flex:1}
  .act.save{flex:2;background:var(--accent);border-color:var(--accent);color:#fff}
  .act.copy:hover{border-color:var(--accent2)}
  .act.save:hover{background:#7c6cf0}
  .act:active{transform:scale(.985)}

  .toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 14px);transform:translateX(-50%) translateY(8px);
         background:var(--panel2);border:1px solid var(--accent);color:var(--ink);
         padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;
         opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<main class="stage">
  <svg id="diagram" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="flove publishing workflow: two human icons, skills label between the left human and the agents bar, then folders → gitea → github → flove.org. Click a node to expand it in place; click an arrow to thicken it; click the left human to show the arrow to the right human.">
    <style>

<nav class="actions">
  <button class="act copy" id="copyBtn" type="button">⧉ &nbsp;Copy as text</button>
  <button class="act save" id="saveBtn" type="button">⬇ &nbsp;Save diagram (SVG)</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var NODES = ['folders','gitea','github','flove'];

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  /* click a node → expand it in place, growing the card (only one at a time) */
  function closeAllDetails(){
    NODES.forEach(function(k){
      document.getElementById(k).classList.remove('open');
      document.getElementById(k).setAttribute('aria-expanded','false');
    });
  }
  function toggleDetail(k){
    var el = document.getElementById(k);
    var willOpen = !el.classList.contains('open');
    closeAllDetails();
    if(willOpen){ el.classList.add('open'); el.setAttribute('aria-expanded','true'); }
  }
  NODES.forEach(function(k){
    var el = document.getElementById(k);
    el.addEventListener('click', function(e){ e.preventDefault(); toggleDetail(k); });
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleDetail(k); } });
  });

  /* click an arrow → thicken it (only one at a time) */
  function resetArrows(){
    document.querySelectorAll('.arrow').forEach(function(a){
      a.classList.remove('thick');
      a.setAttribute('aria-pressed','false');
    });
  }
  function toggleArrow(a){
    var was = a.classList.contains('thick');
    resetArrows();
    if(!was){ a.classList.add('thick'); a.setAttribute('aria-pressed','true'); }
  }
  document.querySelectorAll('.arrow').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); toggleArrow(a); });
    a.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleArrow(a); } });
  });

  /* click the first human → arrow to the other human icon */
  var humansArrow = document.getElementById('humansArrow');
  var human1 = document.getElementById('human1');
  function toggleHumansArrow(){
    var show = humansArrow.getAttribute('display') === 'none';
    humansArrow.setAttribute('display', show ? 'block' : 'none');
    human1.setAttribute('aria-pressed', show ? 'true' : 'false');
  }
  human1.addEventListener('click', function(e){ e.preventDefault(); toggleHumansArrow(); });
  human1.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleHumansArrow(); } });

  /* ── copy as text ── */
  var TEXT =
'🌱 FLOVE — PUBLISHING WORKFLOW\n' +
'folders → gitea → github → flove.org\n' +
'how this site gets from my desk to the web.\n' +
'\n' +
'HUMAN + SKILLS + AGENTS\n' +
'  🧑 Marc — the human · icon above my folders and above flove.org\n' +
'     (click the left one to draw the arrow to the right one)\n' +
'  SKILLS — between the human and the agents bar\n' +
'  🤖 agents — wide bar below the human, spanning my folders → github\n' +
'\n' +
'1 · MY FOLDERS   ~/Documents/flove\n' +
'   💭 theory/        ideas\n' +
'   📄 docs/          free · no nesting\n' +
'   📂 development/   nests:\n' +
'       📚 standards/  — the §13 book\n' +
'       💬 debates/    — plans & decisions\n' +
'\n' +
'2 · GITEA   localhost:3000/marc — PRIVATE (LAN only)\n' +
'   repos: marc/flove · marc/flove-skills\n' +
'   sync:  git push origin main\n' +
'\n' +
'3 · GITHUB   github.com/floveorg — PUBLIC\n' +
'   repos: floveorg.github.io (blog included) · flove-skills\n' +
'   sync:  git push github main\n' +
'   (site mirror via the updaty-web skill)\n' +
'\n' +
'4 · FLOVE.ORG   GitHub Pages — LIVE\n' +
'   flove.org/      ← floveorg/floveorg.github.io\n' +
'   flove.org/development/blog/  ← built in repo, via publish-web.sh\n' +
'   Solo v1       — all code in the file, local friendly\n' +
'   Central v2    — css-js libs, FastAPI + Railway + libsql\n' +
'   Decentral v2  — browser extension and p2p client\n' +
'\n' +
'EXTRAS\n' +
'   Android APK → updaty-apk → GitHub Releases (TWA wrapping flove.org)\n' +
'   flove.zip  → upgrade → rebuilt from committed HEAD\n' +
'   Blog posts → build-blog.sh publish → build in place, ships via updaty-web (drafts stay private)\n' +
'\n' +
'Click a node to expand it · click an arrow to thicken it.\n' +
'No private data shown — tokens & passwords stay local.';

  function fallbackCopy(txt, done){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    try{ document.execCommand('copy'); done(); }
    catch(e){ showToast('Copy failed — select the text manually.'); }
    document.body.removeChild(ta);
  }
  function copyWorkflow(){
    function done(){ showToast('Workflow copied to clipboard'); }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(TEXT).then(done, function(){ fallbackCopy(TEXT, done); });
    } else { fallbackCopy(TEXT, done); }
  }
  document.getElementById('copyBtn').addEventListener('click', copyWorkflow);

  /* ── save diagram as SVG (formal, always the base state) ── */
  function saveDiagram(){
    var wasOpen = {};
    NODES.forEach(function(k){ wasOpen[k] = document.getElementById(k).classList.contains('open'); });
    var wasThick = {};
    document.querySelectorAll('.arrow').forEach(function(a){ wasThick[a.id] = a.classList.contains('thick'); });
    var wasHumans = humansArrow.getAttribute('display') !== 'none';

    closeAllDetails();
    resetArrows();
    humansArrow.setAttribute('display','none');

    var svg = document.getElementById('diagram');
    var clone = svg.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('role', null);
    var title = document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent = 'flove · publishing workflow — folders → gitea → github → flove.org';
    clone.insertBefore(title, clone.firstChild);
    var str = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    var blob = new Blob([str], {type:'image/svg+xml'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'flove-workflow-diagram.svg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);

    NODES.forEach(function(k){
      if(wasOpen[k]){ document.getElementById(k).classList.add('open'); document.getElementById(k).setAttribute('aria-expanded','true'); }
    });
    document.querySelectorAll('.arrow').forEach(function(a){
      if(wasThick[a.id]){ a.classList.add('thick'); a.setAttribute('aria-pressed','true'); }
    });
    if(wasHumans){ humansArrow.setAttribute('display','block'); human1.setAttribute('aria-pressed','true'); }
    showToast('Diagram saved as flove-workflow-diagram.svg');
  }
  document.getElementById('saveBtn').addEventListener('click', saveDiagram);
})();
</script>
</body>
</html>
