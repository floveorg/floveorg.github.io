<title>workflow · flove</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0c0c14;--panel:#131320;--panel2:#1d1d2b;--line:#29293c;
    --ink:#ffffff;--muted:#ffffff;--accent:#6c5ce7;--accent2:#8b7df0;
    --bar-h:74px;--safe-b:env(safe-area-inset-bottom,0px);
  }
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 120% at 50% 28%,#16142e 0%,var(--bg) 72%);
    min-height:100svh;line-height:1.55;
    padding:10px 16px calc(var(--bar-h) + var(--safe-b) + 18px);
    overflow-x:hidden;
  }
  ::selection{background:rgba(108,92,231,.4)}

  .stage{max-width:1040px;margin:0 auto}
  .stage svg{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 50px rgba(0,0,0,.45))}

  /* node expand / shrink in place */
  .node .node-rect{transition:height .3s cubic-bezier(.22,.61,.36,1)}
  .node.open .node-rect{height:240px}
  .node .extras{opacity:0;pointer-events:none;transition:opacity .2s ease .08s}
  .node.open .extras{opacity:1;pointer-events:auto}

  /* main cards (folders/gitea/github) reveal below WITHOUT growing the card */
  #folders.open .node-rect, #gitea.open .node-rect, #github.open .node-rect{height:84px}

  /* shrink the REST of the graph when exploring flove's fork */
  .rest{transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .5s ease}
  .rest.shrunk{transform:scale(.25);transform-origin:820px 160px;opacity:.45;pointer-events:none}
  #flove{transition:transform .5s cubic-bezier(.22,.61,.36,1)}
  #flove.zoomed{transform:translate(-334px,82px) scale(3);transform-origin:820px 160px}
  #flove.zoomed .node-rect{stroke:#8b7df0;stroke-width:2.5}
  #fan{opacity:0;pointer-events:none;transition:opacity .3s ease}
  #fan.show{opacity:1;pointer-events:auto}
  #backArrow{opacity:0;pointer-events:none;transition:opacity .25s ease}
  #backArrow.show{opacity:1;pointer-events:auto}
  #backArrow:hover .ba-c{stroke:#8b7df0;fill:#242438}

  /* arrow click → tiny info revealed below */
  .arrow-info{opacity:0;pointer-events:none;transition:opacity .2s ease .05s}
  .arrow.shown .arrow-info{opacity:1;pointer-events:auto}
  #pushgraph{transition:opacity .25s ease}
  #humansArrow{transition:opacity .2s ease}

  /* ── action bar ── */
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;
           padding:10px max(12px,calc((100vw - 1040px)/2 + 8px)) calc(10px + var(--safe-b));
           background:rgba(12,12,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .act{border:none;border-radius:14px;padding:15px 0;font-size:14px;font-weight:800;cursor:pointer;
       font-family:inherit;transition:.15s;color:var(--ink);background:var(--panel2);border:1px solid var(--line)}
  .act.copy{flex:1}
  .act.save{flex:2;background:var(--accent);border-color:var(--accent);color:#fff}
  .act.copy:hover{border-color:var(--accent2)}
  .act.save:hover{background:#7c6cf0}
  .act:active{transform:scale(.985)}

  .toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 14px);transform:translateX(-50%) translateY(8px);
         background:var(--panel2);border:1px solid var(--accent);color:var(--ink);
         padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;
         opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

        <text x="189" y="348" text-anchor="middle" font-size="7" class="mono">docs-files/</text>
        <rect x="420" y="250" width="150" height="44" rx="22" fill="#161b2b" stroke="#ff8a3a"/>
        <text x="495" y="268" text-anchor="middle" font-size="8.5" font-weight="700">☁️ CLOUDINARY</text>
        <text x="495" y="282" text-anchor="middle" font-size="6" fill="#9b9bb0">videos · big files · CDN</text>
        <path d="M316 260 Q 380 250 430 262" fill="none" stroke="#ff8a3a" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#aor)"/>
        <path d="M497 240 Q 600 220 712 220" fill="none" stroke="#ff8a3a" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#aor)"/>
        <text x="596" y="206" text-anchor="middle" font-size="6" fill="#9b9bb0">CDN serves media to</text>
      </g>

    </g><!-- /rest -->

    <!-- 4 · flove.org (click → shrink the graph, dive into the fork) -->
    <g id="flove" class="click node-clickable node" role="button" tabindex="0" aria-expanded="false" aria-label="flove.org — click to shrink the graph and see its three ways to run">
      <rect class="node-rect" x="838" y="128" width="130" height="64" rx="12" fill="#171726" stroke="#2b2b3e"/>
      <text x="903" y="180" text-anchor="middle" font-size="20">🌐</text>
      <text x="903" y="202" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1">FLOVE</text>
      <text x="903" y="215" text-anchor="middle" font-size="6.5" class="mono">.org</text>
      <g class="extras">
        <text x="848" y="214" font-size="8.5"><tspan font-weight="700">Solo</tspan></text>
        <text x="848" y="232" font-size="8.5"><tspan font-weight="700">Central</tspan></text>
        <text x="848" y="250" font-size="8.5"><tspan font-weight="700">Decentral</tspan></text>
      </g>
    </g>

    <!-- fan: the three ways to run, each can expand further -->
    <g id="fan">
      <text x="700" y="262" text-anchor="middle" font-size="7" font-weight="800" letter-spacing="2" fill="#ffffff">FLOVE · THREE WAYS TO RUN</text>

      <!-- SOLO · sits above flove.org; expands into a localhost run + pros/cons -->
      <g id="solo" class="node" role="button" tabindex="0" aria-expanded="false" aria-label="Solo — self contained files, click to see localhost + pros/cons">
        <rect class="node-rect" x="430" y="284" width="230" height="60" rx="16" fill="#14142a" stroke="#6c5ce7"/>
        <text x="430" y="310" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1">SOLO</text>
        <text x="430" y="332" text-anchor="middle" font-size="8" fill="#9b9bb0">self-contained files</text>
        <g class="extras">
          <text x="340" y="398" font-size="14" font-weight="800" fill="#d9d2ff">► localhost</text>
          <text x="340" y="424" font-size="5.5" fill="#9b9bb0"> a local run of one app · edit &amp; see it live</text>
          <rect x="340" y="434" width="130" height="30" rx="12" fill="#101a26" stroke="#5ea4e6"/>
          <text x="405" y="453" text-anchor="middle" font-size="6" class="mono" fill="#cfe3fb">app.html · file://</text>
          <line x1="405" y1="468" x2="405" y2="484" stroke="#8b7df0" stroke-width="2"/>
          <text x="340" y="500" font-size="9" font-weight="800" fill="#6ee7a0">Pros</text>
          <text x="340" y="514" font-size="5" fill="#9b9bb0">· free · no build · internet-free</text>
          <text x="492" y="500" font-size="9" font-weight="800" fill="#fb7185">Cons</text>
          <text x="492" y="514" font-size="5" fill="#9b9bb0">· heavy code · manual sync</text>
        </g>
      </g>

      <!-- CENTRAL · sits below/centre; expands into a shared/ lib + pros/cons -->
      <g id="central" class="node" role="button" tabindex="0" aria-expanded="false" aria-label="Central — abstracted code, click to see shared lib + pros/cons">
        <rect class="node-rect" x="430" y="372" width="230" height="60" rx="16" fill="#141625" stroke="#5ea4e6"/>
        <text x="430" y="398" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1">CENTRAL</text>
        <text x="430" y="420" text-anchor="middle" font-size="8" fill="#9b9bb0">abstracted code</text>
        <g class="extras">
          <text x="340" y="476" font-size="14" font-weight="800" fill="#a9d4ff">► shared/</text>
          <text x="340" y="502" font-size="5.5" fill="#9b9bb0">css-js libs · core backend · once, used everywhere</text>
          <rect x="340" y="512" width="150" height="30" rx="12" fill="#101a20" stroke="#5ea4e6"/>
          <text x="415" y="531" text-anchor="middle" font-size="6" class="mono" fill="#cfe3fb">FastAPI · libsql · deps</text>
          <text x="340" y="558" font-size="9" font-weight="800" fill="#6ee7a0">Pros</text>
          <text x="340" y="572" font-size="5" fill="#9b9bb0">· robust · once updated, all</text>
          <text x="492" y="558" font-size="9" font-weight="800" fill="#fb7185">Cons</text>
          <text x="492" y="572" font-size="5" fill="#9b9bb0">· deps + backend</text>
        </g>
      </g>

      <!-- DECENTRAL · sits just above flove.org; its three nodes fan out above -->
      <g id="decentral" class="click" role="button" tabindex="0" aria-expanded="false" aria-label="Decentral — above flove.org, click to see Browsy, Nety and Bridges">
        <rect class="node-rect" x="580" y="232" width="230" height="50" rx="12" fill="#141b2b" stroke="#ff8a3a"/>
        <text x="580" y="266" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#ffd9b8">DECENTRAL</text>
      </g>
    </g>

    <!-- back arrow · shown when flove is zoomed-in; returns to the main diagram -->
    <g id="backArrow" class="click" role="button" tabindex="0" aria-hidden="true" aria-label="Back to the main diagram">
      <circle class="ba-c" cx="70" cy="280" r="24" fill="#171726" stroke="#8b7df0" stroke-width="2"/>
      <path d="M80 266 L54 280 L80 294" fill="none" stroke="#8b7df0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- DECENTRAL'S fan-out sits ABOVE the decentral card -->
    <g id="decFan" style="opacity:0;pointer-events:none" aria-hidden="true">
      <rect x="620" y="96" width="130" height="30" rx="15" fill="#141b2b" stroke="#ff8a3a"/>
      <text x="685" y="116" text-anchor="middle" font-size="9" font-weight="800" fill="#ffd9b8">Browsy</text>
      <rect x="760" y="96" width="130" height="30" rx="15" fill="#141b2b" stroke="#ff8a3a"/>
      <text x="825" y="116" text-anchor="middle" font-size="9" font-weight="800" fill="#ffd9b8">Nety</text>
      <rect x="900" y="96" width="130" height="30" rx="15" fill="#141b2b" stroke="#ff8a3a"/>
      <text x="965" y="116" text-anchor="middle" font-size="9" font-weight="800" fill="#ffd9b8">Bridges</text>
      <line x1="680" y1="126" x2="680" y2="232" stroke="#ff8a3a" stroke-width="2" marker-end="url(#aor)"/>
      <line x1="825" y1="126" x2="775" y2="232" stroke="#ff8a3a" stroke-width="2" marker-end="url(#aor)"/>
      <line x1="965" y1="126" x2="860" y2="232" stroke="#ff8a3a" stroke-width="2" marker-end="url(#aor)"/>
    </g>
  </svg>
</main>

<nav class="actions">
  <button class="act copy" id="copyBtn" type="button">⧉ &nbsp;Copy as text</button>
  <button class="act save" id="saveBtn" type="button">⬇ &nbsp;Save diagram (SVG)</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var NODES = ['folders','gitea','github'];
  var FANNODES = ['solo','central'];

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  /* click a normal node → toggle it, leaving others open (multi-open) */
  function toggleDetail(k){
    var el = document.getElementById(k);
    var willOpen = !el.classList.contains('open');
    el.classList.toggle('open', willOpen);
    el.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  }
  NODES.forEach(function(k){
    var el = document.getElementById(k);
    el.addEventListener('click', function(e){ e.preventDefault(); toggleDetail(k); });
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleDetail(k); } });
  });

  /* clickable folder rows inside MY FOLDERS */
  document.querySelectorAll('.fitem').forEach(function(it){
    it.addEventListener('click', function(e){
      if(it.querySelector('a') && e.target.closest && e.target.closest('a')) return;
      e.preventDefault(); e.stopPropagation();
      if(it.classList.contains('fold')){
        var open = it.classList.toggle('exp');
        it.setAttribute('aria-expanded', open ? 'true' : 'false');
      } else {
        var on = it.classList.toggle('se');
        it.setAttribute('aria-pressed', on ? 'true' : 'false');
      }
    });
    it.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); it.click(); }
    });
  });

  /* click an arrow → reveal its info below (others stay open) */
  function resetArrows(){
    document.querySelectorAll('.arrow').forEach(function(a){
      a.classList.remove('shown');
      a.setAttribute('aria-expanded','false');
    });
    togglePush(false);
  }
  function togglePush(on){
    var pg = document.getElementById('pushgraph');
    pg.style.opacity = on ? 1 : 0;
    pg.style.pointerEvents = on ? 'auto' : 'none';
  }
  function toggleArrow(a){
    var on = a.classList.toggle('shown');
    a.setAttribute('aria-expanded', on ? 'true' : 'false');
    if(a.id === 'arrowA') togglePush(on);
  }
  document.querySelectorAll('.arrow').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); toggleArrow(a); });
    a.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleArrow(a); } });
  });

  /* click the human → arrow to flove.org */
  var humansArrow = document.getElementById('humansArrow');
  var dnsNode = document.getElementById('dns');
  var human1 = document.getElementById('human1');
  function toggleHumansArrow(){
    var show = humansArrow.getAttribute('display') === 'none';
    humansArrow.setAttribute('display', show ? 'block' : 'none');
    dnsNode.setAttribute('display', show ? 'block' : 'none');
    human1.setAttribute('aria-pressed', show ? 'true' : 'false');
  }
  human1.addEventListener('click', function(e){ e.preventDefault(); toggleHumansArrow(); });
  human1.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleHumansArrow(); } });

  /* /sort chip → reveal what it ignores (dev/addons, drafts) */
  var updChip = document.getElementById('updChip');
  function toggleUpdChip(){
    var was = updChip.classList.contains('shown');
    updChip.classList.toggle('shown', !was);
    updChip.setAttribute('aria-expanded', was ? 'false' : 'true');
  }
  updChip.addEventListener('click', function(e){ e.preventDefault(); toggleUpdChip(); });
  updChip.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleUpdChip(); } });

  /* SKILLS chip → reveal the skill chips */
  var skillChips = document.getElementById('skillChips');
  var skillsChip = document.getElementById('skillsChip');
  function toggleSkillsChips(){
    var show = skillChips.classList.toggle('show');
    skillsChip.setAttribute('aria-expanded', show ? 'true' : 'false');
  }
  skillsChip.addEventListener('click', function(e){ e.preventDefault(); toggleSkillsChips(); });
  skillsChip.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleSkillsChips(); } });

  /* decentral → fan out its three nodes above flove.org */
  var decNode = document.getElementById('decentral');
  var decNet = document.getElementById('decFan');
  function toggleDecNet(){
    var was = decNet.style.opacity === '1';
    decNet.style.opacity = was ? '0' : '1';
    decNet.style.pointerEvents = was ? 'none' : 'auto';
    decNode.setAttribute('aria-expanded', was ? 'false' : 'true');
  }
  decNode.addEventListener('click', function(e){ e.preventDefault(); toggleDecNet(); });

  /* remember what was open so restore returns exactly there */
  var snap = { nodes:{}, arrows:[], humans:false, zoom:false, fans:{} };
  function captureState(){
    snap.nodes = {};
    NODES.forEach(function(k){ snap.nodes[k] = document.getElementById(k).classList.contains('open'); });
    snap.arrows = [];
    document.querySelectorAll('.arrow').forEach(function(a){ if(a.classList.contains('shown')) snap.arrows.push(a.id); });
    snap.humans = humansArrow.getAttribute('display') !== 'none';
    snap.zoom = flovePhase;
    snap.upd = updChip.classList.contains('shown');
    snap.skills = skillChips.classList.contains('show');
    snap.dect = decNet.style.opacity === '1';
    snap.fans = {};
    FANNODES.forEach(function(k){ snap.fans[k] = document.getElementById(k).classList.contains('open'); });
  }
  function resetAll(){
    NODES.forEach(function(k){ document.getElementById(k).classList.remove('open'); document.getElementById(k).setAttribute('aria-expanded','false'); });
    resetArrows();
    setFlovePhase(0);
    FANNODES.forEach(function(k){ document.getElementById(k).classList.remove('open'); document.getElementById(k).setAttribute('aria-expanded','false'); });
    document.getElementById('humansArrow').setAttribute('display','none');
    dnsNode.setAttribute('display','none');
    human1.setAttribute('aria-pressed','false');
    updChip.classList.remove('shown');
    updChip.setAttribute('aria-expanded','false');
    skillChips.classList.remove('show');
    skillsChip.setAttribute('aria-expanded','false');
    decNet.style.opacity = '0';
    decNet.style.pointerEvents = 'none';
    decNode.setAttribute('aria-expanded','false');
  }

  /* ── restore from a captured snapshot ── */
  function restore(s){
    NODES.forEach(function(k){
      var el = document.getElementById(k);
      if(s.nodes[k]){ el.classList.add('open'); el.setAttribute('aria-expanded','true'); }
      else { el.classList.remove('open'); el.setAttribute('aria-expanded','false'); }
    });
    document.querySelectorAll('.arrow').forEach(function(a){
      if(s.arrows.indexOf(a.id) >= 0){ a.classList.add('shown'); a.setAttribute('aria-expanded','true'); }
      else { a.classList.remove('shown'); a.setAttribute('aria-expanded','false'); }
    });
    togglePush(s.arrows.indexOf('arrowA') >= 0);
    if(s.upd){ updChip.classList.add('shown'); updChip.setAttribute('aria-expanded','true'); }
    else { updChip.classList.remove('shown'); updChip.setAttribute('aria-expanded','false'); }
    skillChips.classList.toggle('show', !!s.skills);
    skillsChip.setAttribute('aria-expanded', s.skills ? 'true' : 'false');
    if(s.dect){ decNet.style.opacity = '1'; decNet.style.pointerEvents = 'auto'; decNode.setAttribute('aria-expanded','true'); }
    else { decNet.style.opacity = '0'; decNet.style.pointerEvents = 'none'; decNode.setAttribute('aria-expanded','false'); }
    setFlovePhase(s.zoom || 0);
    FANNODES.forEach(function(k){
      var el = document.getElementById(k);
      if(s.fans[k]){ el.classList.add('open'); el.setAttribute('aria-expanded','true'); }
      else { el.classList.remove('open'); el.setAttribute('aria-expanded','false'); }
    });
    if(s.humans){ document.getElementById('humansArrow').setAttribute('display','block'); dnsNode.setAttribute('display','block'); human1.setAttribute('aria-pressed','true'); }
    else { document.getElementById('humansArrow').setAttribute('display','none'); dnsNode.setAttribute('display','none'); human1.setAttribute('aria-pressed','false'); }
  }

  /* flove.org → shrink the rest to 25% and show the fork fan */
  var flove = document.getElementById('flove');
  var backArrow = document.getElementById('backArrow');
  var flovePhase = 0; /* 0 none · 1 fan below · 2 zoomed centered */
  function setFlovePhase(p){
    flovePhase = p;
    var rest = document.getElementById('rest');
    var fan = document.getElementById('fan');
    rest.classList.toggle('shrunk', p === 2);
    fan.classList.toggle('show', p === 1);
    flove.classList.toggle('zoomed', p === 2);
    flove.setAttribute('aria-expanded', p === 1 || p === 2 ? 'true' : 'false');
    backArrow.classList.toggle('show', p === 2);
    backArrow.setAttribute('aria-hidden', p === 2 ? 'false' : 'true');
  }
  function toggleZoom(){
    setFlovePhase(flovePhase === 0 ? 1 : (flovePhase === 1 ? 2 : 0));
  }
  flove.addEventListener('click', function(e){ e.preventDefault(); if(flovePhase === 2) setFlovePhase(0); else toggleZoom(); });
  flove.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flove.click(); } });
  backArrow.addEventListener('click', function(e){ e.preventDefault(); setFlovePhase(0); });
  backArrow.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setFlovePhase(0); } });

  /* fan-out: each fork node expands further in place (one at a time) */
  function toggleFan(id){
    var el = document.getElementById(id);
    var willOpen = !el.classList.contains('open');
    FANNODES.forEach(function(k){
      document.getElementById(k).classList.remove('open');
      document.getElementById(k).setAttribute('aria-expanded','false');
    });
    if(willOpen){ el.classList.add('open'); el.setAttribute('aria-expanded','true'); }
  }
  FANNODES.forEach(function(k){
    document.getElementById(k).addEventListener('click', function(e){ e.preventDefault(); toggleFan(k); });
  });

  /* ── Esc: close whatever is open ── */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ resetAll(); }
  });

  /* ── copy as text ── */
  var TEXT =
'🌱 FLOVE — PUBLISHING WORKFLOW\n' +
'folders → gitea → github → flove.org\n' +
'how this site gets from my desk to the web.\n' +
'\n' +
'HUMAN + SKILLS + AGENTS\n' +
'  🧑 Marc — the human · click the arrow toward flove.org\n' +
'  DNS above pages: floveorg.github.io\n' +
'  SKILLS — link to the skill library; chips on the skills row\n' +
'  🤖 agents — a wide bar over the whole pipeline\n' +
'  chips: /optimizy · /updaty (click → ignores dev/development + drafts) · /upgrady (by gitea) · /questy + /form (by standards)\n' +
'\n' +
'SMALL ARROWS — click each to see what it does\n' +
'  push   → gitignore: dev/docs-files → Cloudinary (CDN) → flove.org\n' +
'  mirror → Sync (gitea ⇄ github) · shown on click\n' +
'  pages  → what the live site serves\n' +
'\n' +
'1 · MY FOLDERS   ~/Documents/flove\n' +
'   …            placeholder · All my other files\n' +
'   📄 docs/          Theory\n' +
'   💻 development/\n' +
'   📘 /standards     — opening sources: ↳ debates/ · ↳ Wiki/ · Docsify · ↳ Blog/ · Hugo\n' +
'   📱 apps/          Practice\n' +
'\n' +
'2 · GITEA   PRIVATE — LAN only\n' +
'   repos: marc/flove · marc/flove-skills ●  sync:  git push origin main\n' +
'   /upgrady — rebuild the package\n' +
'\n' +
'3 · GITHUB   PUBLIC\n' +
'   opening sources: Docsify → Wiki/ · Hugo → Blog/ · /blogy. Click to reveal arrows.\n' +
'\n' +
'4 · FLOVE.ORG   GitHub Pages — LIVE  (click to open the fan)\n' +
'   Solo      · self-contained · localhost · free, no deps\n' +
'   Central   · abstracted code · shared/ · FastAPI + deps → robust\n' +
'   Decentral · federated · fans into Browsy / Nety / Bridges\n' +
'\n' +
'EXTRAS\n' +
'   Android APK → updaty-apk → GitHub Releases (TWA wrapping flove.org)\n' +
'   flove.zip   → upgrady → rebuilt from committed HEAD\n' +
'   Blog posts  → build-blog.sh → build in place, ships via updaty\n' +
'\n' +
'Click a node to expand it · click a small arrow to read it · click flove.org for the fork.\n' +
'No private data shown — tokens & passwords stay local.';

  function fallbackCopy(txt, done){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    try{ document.execCommand('copy'); done(); }
    catch(e){ showToast('Copy failed — select the text manually.'); }
    document.body.removeChild(ta);
  }
  function copyWorkflow(){
    function done(){ showToast('Workflow copied to clipboard'); }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(TEXT).then(done, function(){ fallbackCopy(TEXT, done); });
    } else { fallbackCopy(TEXT, done); }
  }
  document.getElementById('copyBtn').addEventListener('click', copyWorkflow);

  /* ── save diagram as SVG (formal, always the base state) ── */
  function saveDiagram(){
    captureState();
    resetAll();
    var svg = document.getElementById('diagram');
    var clone = svg.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('role', null);
    var title = document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent = 'flove · publishing workflow — folders → gitea → github → flove.org';
    clone.insertBefore(title, clone.firstChild);
    var str = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    var blob = new Blob([str], {type:'image/svg+xml'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'flove-workflow-diagram.svg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    restore(snap);
    showToast('Diagram saved as flove-workflow-diagram.svg');
  }
  document.getElementById('saveBtn').addEventListener('click', saveDiagram);
})();
</script>
</body>
