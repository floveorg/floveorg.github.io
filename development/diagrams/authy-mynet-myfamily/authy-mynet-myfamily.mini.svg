<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telegram unlocks Authy L2, which enables MyNet, a simplified MyFamily, saved as L in Browsy and pulled by a peer.">
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#6c5ce7"/></marker>
  </defs>
  <rect x="4" y="8" width="312" height="164" rx="16" fill="none" stroke="#6c5ce7" stroke-opacity=".32" stroke-width="1.2" stroke-dasharray="6 5"/>
  <g stroke="#6c5ce7" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M86 63 L99 63" marker-end="url(#a1)"/>
    <path d="M178 63 L193 63" marker-end="url(#a1)"/>
    <path d="M226 80 C 230 92, 232 100, 232 111" marker-end="url(#a1)"/>
    <path d="M194 129 L180 129" marker-end="url(#a1)"/>
    <path d="M100 129 L87 129" marker-end="url(#a1)"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="8.5" text-anchor="middle">
    <rect x="18" y="46" width="68" height="34" rx="8" fill="#11131a" stroke="#6c5ce7" stroke-width="2"/>
    <text x="52" y="67" fill="#e9eaf2">Telegram</text>
    <rect x="100" y="46" width="78" height="34" rx="8" fill="#11131a" stroke="#00d9a3" stroke-width="2"/>
    <text x="139" y="67" fill="#e9eaf2">Authy L2</text>
    <rect x="194" y="46" width="64" height="34" rx="8" fill="#11131a" stroke="#6c5ce7" stroke-width="2"/>
    <text x="226" y="67" fill="#e9eaf2">MyNet</text>
    <rect x="194" y="112" width="80" height="34" rx="8" fill="#11131a" stroke="#6c5ce7" stroke-width="2"/>
    <text x="234" y="133" fill="#e9eaf2">MyFamily</text>
    <rect x="100" y="112" width="78" height="34" rx="8" fill="#11131a" stroke="#00d9a3" stroke-width="2"/>
    <text x="139" y="133" fill="#e9eaf2">Browsy</text>
    <rect x="18" y="112" width="68" height="34" rx="8" fill="#11131a" stroke="#6c5ce7" stroke-width="2"/>
    <text x="52" y="133" fill="#e9eaf2">Peer</text>
  </g>
  <text x="93" y="106" font-family="ui-monospace,monospace" font-size="6.5" text-anchor="middle" fill="#a3a7b4">Local</text>
  <text x="160" y="168" font-family="ui-monospace,monospace" font-size="7.5" text-anchor="middle" fill="#a3a7b4">Telegram → Authy → MyNet → MyFamily → Browsy → Peer</text>
</svg>
