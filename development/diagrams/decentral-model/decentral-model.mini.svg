  <path d="M106 162 L183 162" stroke="#a78bfa" stroke-width="1.9" fill="none" stroke-dasharray="4 4" marker-end="url(#a3s)"/>
  <text x="193" y="104" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle" fill="#a3a7b4" textLength="124" lengthAdjust="spacing">Local</text>
  <text x="145" y="192" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle" fill="#a78bfa" textLength="62" lengthAdjust="spacing">Social</text>
