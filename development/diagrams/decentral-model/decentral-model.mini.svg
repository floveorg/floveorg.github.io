<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Authy with Personal inside authenticates Telegram, Telegram enables MyNet, MyFamily is a sub of MyNet, Authy points to Browsy entry which sits below Authy, Wizy spans the lower row, MyNet and MyFamily feed Browsy host's Local records, and a Social arrow runs from Nety to Browsy host with the Social label below it.">
